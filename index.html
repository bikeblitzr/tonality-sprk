/* ---------- structural analysis ---------- */
var STOPWORDS = ('a an the and or but if of to in on at for with from by as is are was were be been being am do does did done have has had will would can could shall should may might must ' +
  'i you he she it we they me him her us them my your his its our their this that these those there here what which who whom whose when where why how not no nor so than then too very just about into over under again further once').split(' ');
var STOP = {}; STOPWORDS.forEach(function(w){ STOP[w]=1; });

function tokenise(s){
  return String(s||'').trim().split(/\s+/).filter(Boolean).map(function(w){
    return {raw:w, clean:w.toLowerCase().replace(/[^a-z0-9'’-]/g,'')};
  });
}
function isContent(w){ return w.clean && !STOP[w.clean] && w.clean.length>1; }

function analyseForm(line){
  var t=String(line||'').trim();
  var f={
    isQuestion: /\?\s*$/.test(t),
    isWh: /^\s*(what|why|how|when|where|who|which|whose)\b/i.test(t),
    isYesNo: false,
    isImperative: false,
    words: tokenise(t).length,
    hedges: [],
    contrast: null,
    repeats: []
  };
  f.isYesNo = f.isQuestion && !f.isWh &&
    /^\s*(is|are|was|were|do|does|did|can|could|will|would|shall|should|have|has|had|am|may|might|must|any|so)\b/i.test(t);
  f.isImperative = !f.isQuestion && /^\s*(stop|go|do|send|put|get|come|look|listen|tell|give|take|call|sit|leave|wait|show|make)\b/i.test(t);

  var HEDGE=/\b(just|sort of|kind of|maybe|perhaps|possibly|i think|i guess|a bit|a little|probably|sorry|quickly|if that('| i)s ok|i could be wrong|might)\b/gi, m;
  while((m=HEDGE.exec(t))) f.hedges.push(m[0]);

  var c = t.match(/\bnot\s+(?:the\s+|a\s+|an\s+)?([\w'’-]+)\b[^.]*?\b(?:it'?s|its|but|it is)\s+(?:the\s+|a\s+|an\s+)?([\w'’-]+)/i);
  if(c) f.contrast={from:c[1], to:c[2]};

  var seen={}, toks=tokenise(t);
  toks.forEach(function(w,i){
    if(!isContent(w)) return;
    if(seen[w.clean]!=null) f.repeats.push({word:w.raw, first:seen[w.clean], again:i});
    else seen[w.clean]=i;
  });
  return f;
}

/* where the nuclear accent should land */
function findNucleus(line, form){
  var toks=tokenise(line);
  if(!toks.length) return null;
  if(form.contrast){
    for(var i=toks.length-1;i>=0;i--)
      if(toks[i].clean===form.contrast.to.toLowerCase().replace(/[^a-z0-9'’-]/g,''))
        return {i:i, word:toks[i].raw, rule:'contrast',
          why:'Contrast overrides everything. "'+form.contrast.from+'" versus "'+form.contrast.to+'" is the whole point of the sentence, so the accent goes on the correction — and it needs the low onglide: dip below your baseline immediately before the peak, or it just reads as ordinary emphasis and the contrast does not land.'};
  }
  for(var j=toks.length-1;j>=0;j--){
    if(isContent(toks[j])){
      var rep=null;
      form.repeats.forEach(function(r){ if(r.again===j) rep=r; });
      if(rep){
        for(var k=j-1;k>=0;k--) if(isContent(toks[k]) && k!==rep.first)
          return {i:k, word:toks[k].raw, rule:'given',
            why:'"'+rep.word+'" has already been said, so it is given information and loses the accent. Re-accenting a word you already used is the most common cause of speech that sounds patronising, and almost nobody notices they are doing it.'};
      }
      return {i:j, word:toks[j].raw, rule:'default',
        why:'Default focus falls on the last content word. Everything after it should drop in pitch range and volume — that is post-focus compression, and it improves how clearly a listener identifies your emphasis by twenty-five to thirty percentage points.'};
    }
  }
  return {i:toks.length-1, word:toks[toks.length-1].raw, rule:'default', why:'Last word carries it.'};
}

/* ---------- the engine ---------- */
function advise(input){
  var stageId=input.stage, line=String(input.line||'').trim(), mods=input.mods||[];
  var stage = STAGES.filter(function(s){return s.id===stageId;})[0] || STAGES[0];
  var scores={}, reasons=[], warnings=[];

  function add(id, v, why, src){
    if(!TONE_BY_ID[id]) return;
    scores[id]=(scores[id]||0)+v;
    if(why) reasons.push({tone:id, v:v, why:why, src:src});
  }

  Object.keys(stage.tones).forEach(function(id){
    add(id, stage.tones[id], null, 'stage');
  });
  reasons.push({tone:null, v:0, src:'stage',
    why:'Stage — <b>'+stage.n+'</b>. '+stage.hint+' That sets the starting distribution before anything you typed is considered.'});

  var fired=[];
  if(line){
    TRIGGERS.forEach(function(t){
      if(t.short && tokenise(line).length>7) return;
      if(t.re.test(line)){
        fired.push(t);
        Object.keys(t.w).forEach(function(id){ add(id, t.w[id], null, 'phrase'); });
        reasons.push({tone:Object.keys(t.w)[0], v:0, src:'phrase', why:t.why});
      }
    });
  }

  var form = analyseForm(line);
  if(line){
    if(form.isWh){ add('nq_curious',1.4,null,'form'); add('neutral',1.2,null,'form'); }
    if(form.isYesNo){ add('invite',1.4,null,'form'); add('nq_soft',1,null,'form'); }
    if(form.isImperative){ add('command',2,null,'form'); }
    if(!form.isQuestion && form.words>22){ add('b_teach',1.4,null,'form'); add('b_narrate',1,null,'form'); }
    if(!form.isQuestion && form.words<=5){ add('sl_close',0.8,null,'form'); add('probe',0.8,null,'form'); }
  }

  mods.forEach(function(mid){
    var m=MODS.filter(function(x){return x.id===mid;})[0];
    if(!m) return;
    Object.keys(m.up||{}).forEach(function(id){ add(id, m.up[id], null, 'mod'); });
    Object.keys(m.down||{}).forEach(function(id){ add(id, m.down[id], null, 'mod'); });
    reasons.push({tone:null, v:0, src:'mod', why:'<b>'+m.n+'.</b> '+m.why});
    Object.keys(m.down||{}).forEach(function(id){
      if(m.down[id]<=-2.5 && TONE_BY_ID[id]) warnings.push({tone:id, why:m.n});
    });
  });

  // locked out entirely
  var locked=[];
  Object.keys(scores).forEach(function(id){
    if(scores[id]<0){ locked.push(id); delete scores[id]; }
  });

  var ranked=Object.keys(scores)
    .filter(function(id){ return TONE_BY_ID[id] && S.tierUnlocked(TONE_BY_ID[id].tier); })
    .map(function(id){ return {id:id, tone:TONE_BY_ID[id], score:scores[id]}; })
    .sort(function(a,b){ return b.score-a.score; });

  if(!ranked.length) ranked=[{id:'neutral', tone:TONE_BY_ID.neutral, score:1}];

  var top=ranked[0].score, total=ranked.reduce(function(s,r){ return s+Math.max(0,r.score); },0)||1;
  ranked.forEach(function(r){ r.pct=Math.round(r.score/total*100); });

  var confidence = ranked.length>1 ? Math.min(99, Math.round(40 + (ranked[0].score-ranked[1].score)/Math.max(1,top)*55 + (fired.length?12:0))) : 70;

  return {
    stage:stage, ranked:ranked.slice(0,4), reasons:reasons, warnings:warnings,
    locked:locked.map(function(id){ return TONE_BY_ID[id]; }).filter(Boolean),
    form:form, nucleus: line? findNucleus(line, form) : null,
    fired:fired.length, confidence:confidence, line:line
  };
}

/* ---------- delivery instruction for a specific line ---------- */
function deliveryNotes(res){
  if(!res.line) return [];
  var t=res.ranked[0].tone, f=res.form, out=[];

  var lo=t.target.term[0], hi=t.target.term[1];
  var wantRise = lo > 0, wantFall = hi < 0, spans = lo<=0 && hi>=0;
  out.push({
    k:'Terminal',
    v: wantRise ? 'Lift the last word — up '+lo+' to '+hi+' semitones'
       : wantFall ? 'Land the last word down — '+Math.abs(hi)+' to '+Math.abs(lo)+' semitones below the peak'
       : 'Gentle fall or held level — anywhere from '+Math.abs(lo)+' down to '+hi+' up',
    d: spans
        ? 'This tone tolerates either. A soft fall closes the thought; holding it level leaves it suspended so they keep imagining. On a future-pace question the level tone is usually stronger — it signals there is more to come and stops them treating it as answered.'
        : (f.isQuestion && wantFall
        ? 'It is written as a question but this tone wants a falling terminal. That is correct and deliberate: a wh-question delivered with a rise sounds uncertain, and in this position the fall is what makes it land as genuine curiosity rather than an interrogation.'
        : (!f.isQuestion && wantRise
        ? 'It is a statement but this tone lifts. Use it only on setup material — never on a claim, a price, a commitment or a close, where a rise hollows the content out.'
        : t.recipe.terminal))
  });

  if(res.nucleus){
    out.push({k:'Emphasis', v:'Hit “'+String(res.nucleus.word).replace(/[.,!?;:]+$/,'')+'”', d:res.nucleus.why});
  }

  var pauseWhere = f.isQuestion
    ? 'Two full seconds after the question mark. Longer than feels survivable — anything under about 1.5 seconds and you will answer it yourself, which is the most common self-inflicted wound in selling.'
    : (res.ranked[0].id==='consequence' || res.ranked[0].id==='c_grave' || res.ranked[0].id==='gravity')
    ? 'A full second before you start, and a longer one after you finish. The silence carries the weight the words deliberately do not.'
    : (res.ranked[0].id==='sl_close')
    ? 'Nothing before it. Then absolute silence after. Whoever speaks first loses, and ten seconds feels like sixty from the inside — count it.'
    : 'A short beat before the emphasised word. A pause promotes whatever precedes it, so you get emphasis for free without raising your voice.';
  out.push({k:'Pause', v:'Where the silence goes', d:pauseWhere});

  out.push({k:'Pace', v:t.target.wpm[0]+'–'+t.target.wpm[1]+' wpm', d:t.recipe.pace});

  if(f.hedges.length){
    out.push({k:'Cut these', v:f.hedges.join(', '),
      d:'Every hedge is a small withdrawal from your own credibility. Delete them and say the identical sentence with a falling terminal — nothing else changes, and listen to what happens to the claim.'});
  }
  if(f.contrast){
    out.push({k:'Contrastive scoop', v:'"'+f.contrast.from+'" → "'+f.contrast.to+'"',
      d:'Dip below your baseline immediately before the peak on the correction, and let the peak arrive about a tenth of a second later than it would in ordinary emphasis. That low onglide is what makes a contrast audible, and it is exactly what most people leave out.'});
  }
  if(f.words>28 && !f.isQuestion){
    out.push({k:'Too long', v:f.words+' words in one breath',
      d:'Skilled English speakers phrase at around five and a half syllables. Break this into two or three intonation phrases with real pauses between them, or the emphasis has nowhere to sit.'});
  }
  return out;
}

/* ---------- shared state for the Custom Prompt view ----------
   Global on purpose: both the view and the custom drill mode read it,
   and they live in separate closures.                              */
var CP = {stage:'discovery', line:'', mods:[], res:null};

/* renders the line with the nucleus marked and post-focus material dimmed */
function markLine(r){
  if(!r || !r.line) return '';
  function esc2(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  var toks=r.line.trim().split(/\s+/);
  var n=r.nucleus?r.nucleus.i:-1;
  return toks.map(function(w,i){
    if(i===n) return '<span class="em">'+esc2(w)+'</span>';
    if(n>=0 && i>n) return '<span class="soft">'+esc2(w)+'</span>';
    return esc2(w);
  }).join(' ') + (r.form && r.form.isQuestion ? ' <span class="pz">⟨ 2s ⟩</span>' : '');
}
</script>

<script>
/* ============================================================
   THE CODEX — the theory. Read once, reference forever.
   ============================================================ */
'use strict';

var CODEX = [
{id:'why', title:'Why tonality outranks the words', sub:'The case for spending a year on this',
 body:`Everyone accepts, in the abstract, that *how* you say something matters. Almost nobody trains it, because it feels like a personality trait rather than a skill. It is not. It is a set of about eight measurable, independently controllable acoustic parameters, and every one of them responds to practice the same way a golf swing does.

Here is the practical case.

**The same sentence has between five and eight distinct meanings depending on where the stress falls.** Not shades — different propositions. "I never said she stole my money" accuses seven different people of seven different things depending only on which of the seven words carries the accent. If you are not choosing that consciously, you are choosing it randomly, several times a minute, all day.

**Terminal direction changes how confident you are perceived to be, measurably.** In controlled experiments where only the pitch of the *final word* was digitally altered — around four percent of the total speech — listeners rated the falling version as substantially more confident than the rising one. Nothing else changed. Same speaker, same words, same everything.

**And the effect is about frequency, not depth.** Manipulating seventy-five percent of sentences produced a far bigger effect than manipulating twenty-five percent, while listeners could not reliably tell a moderate manipulation from a strong one. Which means the trainable thing is *consistency* — hitting the right terminal most of the time — rather than any dramatic single gesture. That is good news, because consistency is exactly what drilling produces.

**There is one finding that reverses most people's intuition, and it is the single most useful thing in this app.** Confident speech has a **low mean pitch** and a **wide pitch range**. Unconfident speech has a high mean and a narrow range. Most people, trying to sound authoritative, flatten their voice — which lowers the range and produces something that reads as dead rather than certain. And most people, trying to sound animated, raise their whole register — which reads as anxious.

Mean pitch and pitch range are independent parameters. You can drop one and widen the other simultaneously, and doing so is the fastest single improvement available to almost any speaker. The Monotone Killer drill exists specifically for this.

**Persuasion is not the same as agreement, and tone affects them differently.** Falling terminals increased the amount of *thinking* listeners did about the message — the proportion of on-topic thoughts went from roughly two-thirds to three-quarters. Which means confident delivery amplified whatever was already there: it made strong arguments more persuasive and weak arguments *less* persuasive. Sounding certain about something thin is worse than sounding uncertain about it.

That last point is the ethical core of this whole app. Tonality is an amplifier. It does not manufacture a case. Have a real one, then learn to deliver it.`},

{id:'params', title:'The eight parameters', sub:'Everything you control, and what each one does',
 body:`Every tone in this app is a specific setting of these eight dials. Learn to move them independently and you can produce any tone on command, including ones nobody has named.

**1 · Mean pitch (register).** Where your voice sits. Adult male speaking fundamental sits around 115 Hz, adult female around 200 Hz — but the absolute number is irrelevant. What matters is where you are relative to *your own* comfortable middle. Low register reads as authoritative, calm, serious. High register reads as energetic, anxious, young, or deferential.

**2 · Pitch range (span).** How far you move within a phrase. Measured in semitones so it is comparable across voices. Under **4 semitones** reads as monotone. **6–10** is engaged, normal, credible. Over **14** is theatrical. This is independent of register and it is the dial most people never touch.

**3 · Terminal inflection.** What the pitch does in the last few hundred milliseconds. A **falling** terminal signals completion and certainty; a **rising** one signals a question or uncertainty; a **level** one signals suspension. A confident declarative drops **4 to 7 semitones** from the nuclear peak to the end. Below about 3 semitones it is not reliably heard as a fall at all.

**4 · Rate.** Persuasive and presentational speech sits between roughly **148 and 174 words per minute**. Under 120 reads as laboured. Over about 200 starts to cost comprehension, and over 250 costs intelligibility. But the more important variable is *variation* — rate that never changes is as flat as pitch that never changes.

**5 · Pause.** The most under-used parameter by a wide margin. Below **200 ms** no pause is perceived at all. Clause pauses run **200–400 ms**, sentence pauses **400–700 ms**, rhetorical pauses **500–1000 ms**, and after asking a genuine question you need **1500 ms or more** or you will answer it yourself. The confidence signature is **fewer, longer** pauses. The anxiety signature is more, shorter ones.

**6 · Loudness and dynamic range.** Conversational speech runs 60–68 dB at a metre with about 17 dB of available range. Most untrained speakers use under 4 dB of it. Target **8–12 dB** between your quietest and loudest phrase. And the emphasis word only needs about **3 dB** — the rest is pitch and duration.

**7 · Voice quality.** Modal (normal), breathy (intimate, warm), creaky or fry (low energy, phrase-final), tense (strained), falsetto. Occasional phrase-final creak is normal English; above about forty percent of phrases it starts costing you.

**8 · Articulation.** Precision of consonant release. This is the dial that produces "expertise" without volume — crisp consonants at normal loudness read as competent, whereas raised volume reads as selling. It is also the only parameter that is purely mechanical, which is why the tongue-twister gym exists.`},

{id:'emph', title:'When to emphasise what', sub:'The complete ruleset',
 body:`This is the question the whole app is named after. Here is the actual answer.

**The default: the last content word.** With no special context, English puts the primary accent on the final noun, verb, adjective or adverb of the phrase. "I bought a car at the *dealership*." Everything else is a deliberate departure from this resting state, and departures carry meaning precisely because there is a default to depart from.

**Rule one: one nuclear accent per thought group.** A single intonation phrase gets exactly one primary stress. Two is shouting. Three is a machine. Skilled English speakers produce phrases averaging around **five and a half syllables** — if you feel four words deserve emphasis, you have three phrases and you should break them.

**Rule two: new information takes the accent, given information loses it.** The moment a word has been said, it stops being accent-worthy. "We tested three *options*. The *second* one won" — not "the second *option* won." Re-accenting a word you already said is the single most common cause of speech that sounds patronising, and virtually nobody notices they are doing it.

**Rule three: contrast overrides everything.** When correcting or distinguishing, the contrasted word takes the accent regardless of position — even a function word. "It's not *a* problem, it's *the* problem." This is the one context where stressing "the" is correct.

There is a specific acoustic signature to contrastive accent that most people leave out: the pitch **dips below baseline immediately before the peak**, and the peak arrives about **100 to 125 milliseconds later** than it would in ordinary emphasis. That low onglide is what makes contrast audible. Without it, you have produced ordinary emphasis and the correction does not land. The Contrastive Scoop drill trains exactly this.

**Rule four: compress everything after the nucleus.** Once the primary accent lands, drop both pitch range and volume for the rest of the phrase — by at least **2 semitones and 2 dB**. This is called post-focus compression. It improves the listener's ability to identify what you emphasised by **twenty-five to thirty percentage points**, it is trivially easy to do, and it is almost never taught. If you learn one thing from this page, learn this one.

**Rule five: function words reduce.** Articles, prepositions, auxiliaries and pronouns collapse to schwa unless contrasted. A speaker who gives every "to" and "for" a full vowel sounds like they are reading, because they are.

**Rule six: never accent a hedge.** "I *think* it works" foregrounds your uncertainty. "I think it *works*" foregrounds the claim. Identical words.

**Rule seven: the word before a pause gets weight for free.** A pause promotes whatever preceded it. You can create emphasis with silence alone and zero vocal effort, and it is the cheapest technique available.

**Rule eight: emphasise *less* as the stakes go up.** Counter-intuitive and reliably true. High-stakes content delivered flat reads as fact; the same content delivered with heavy emphasis reads as sales. The more important the sentence, the more you should underplay it.

**Rule nine: move the accent between repetitions.** Identical melody on consecutive sentences is what produces the sing-song, template-reading sound. Say a similar thing twice, put the accent somewhere new.`},

{id:'term', title:'The terminal map', sub:'What the last half-second means',
 body:`More listener judgement rides on the final few hundred milliseconds of your sentence than on anything else you do. Here is the complete inventory.

**Low fall.** Down to your baseline. Signals finality, assertion, a closed proposition. Perceived as authoritative and decisive. Needs to exceed **3 semitones** to register as a fall at all; **4 to 7** is the working range for a confident declarative. Correct for statements, wh-questions, commands, closings, the last item in a list. Wrong when used on literally every phrase — that reads as sermonising.

**High fall.** Same endpoint, higher starting point, bigger excursion. Signals involvement and strong assertion. The difference from low fall is entirely in the onset height, not the landing.

**High rise.** Up to 40% higher by the end of the phrase, roughly 5–6 semitones. A genuine question — you are asking the listener to supply something. Correct for yes-no questions, checking, incredulity. Wrong on declaratives.

**Uptalk (rise on a statement).** Not identical to a question rise — it differs in onset and slope, though the two overlap enough that they are frequently confused. Worth knowing: uptalk is not rare or pathological. It has real discourse functions — floor-holding, checking shared ground, inviting continuation. The problem is not its existence; the problem is using it on claims, prices, commitments and closes, where it hollows out the content. Target: **under 20%** of your declaratives.

**Low rise.** Small rise from a low nucleus. Non-finality, politeness, encouraging continuation. Lower stakes than a high rise, and the correct terminal for a soft permission ask.

**Fall-rise.** Down, then back up to mid. Signals implication and reservation — "yes, but". It is how English marks a contrastive topic and it is how you concede a point before pivoting. Wrong on the closing sentence of an argument, where it audibly leaves the door open. Also a very common unconscious habit in people who are afraid of being definitive, and if that is you, you will hear it immediately in the Terminal Trainer.

**Rise-fall.** Up above the nuclear peak, then down. Being impressed, strongly involved, or — in the wrong context — arch and sarcastic. High-arousal. Overused it reads as theatrical.

**Level / sustained.** A plateau. Suspension, floor-holding, "there is more coming". The most frequent floor-holding device in English. Wrong as a default, where it becomes the sound of reading a list you do not care about.

**A note on trailing off.** "Trailing off" and a correct falling terminal are acoustically adjacent and are constantly confused. The difference is **not pitch** — both fall. The difference is that a correct fall keeps its **intensity and its voicing** all the way to the final consonant, and trailing off loses both. Target: the final syllable within **4 dB** of the sentence average. That is what the Volume Floor drill measures.`},

{id:'pause', title:'The pause', sub:'The most under-used instrument you own',
 body:`Silence is a positive act. It has a taxonomy, it has durations, and it is the only parameter where doing more of it is almost always correct.

**Below 200 milliseconds, no pause is perceived.** That is the floor. Anything shorter is a juncture, not a pause.

**200–400 ms** — clause boundary. Where a comma would go. In careful reading, about 79% of within-sentence punctuation marks get one.

**400–700 ms** — sentence boundary. News-reading median is around 400 ms, mean around 490. Essentially 100% of sentence boundaries get one in professional reading.

**500–1000 ms** — rhetorical pause. This is emphasis by silence. Place it *before* the word you want promoted and you get emphasis without vocal effort.

**800–1500 ms** — topic transition. The paragraph break of speech. Almost nobody leaves enough space here, which is why so many presentations feel like one undifferentiated block.

**1000–2500 ms** — dramatic pause. Real weight. Earn it or it is embarrassing.

**1500 ms minimum after asking a question.** This is the number to memorise. It has to exceed the listener's own turn-taking latency or you will answer your own question — which is the most common self-inflicted wound in selling, coaching and interviewing alike.

**Under 1000 ms before answering one.** The asymmetry is important. Long pauses *before* your own answers reduce perceived sincerity measurably; over about 2000 ms it is clearly detrimental. So: long silences after your questions, short ones before your answers.

**The confidence signature is fewer and longer.** Anxious speakers produce *more* pauses that are *shorter*. Confident speakers produce fewer, longer ones. This ratio is directly measurable and it is what the Pause Discipline drill scores.

**Target pause fraction: 15–25% of total speaking time.** If you are under 10% you are rushing regardless of your word rate.

One more thing. Breath placement should align with syntactic boundaries. Fewer than **15%** of your inhalations should land mid-constituent — breathing in the middle of a phrase is one of the loudest available signals that you have not planned the sentence.`},

{id:'defects', title:'The defect catalogue', sub:'Every named delivery problem, how to detect it, how to fix it',
 body:`Each of these has a deliberate-production drill in the Defect Lab, because you cannot reliably avoid a habit you cannot reproduce on purpose.

**Uptalk on statements.** *Detect:* rising terminal on more than 20% of declaratives. *Fix:* pick one sentence, say it rising, then say it falling, back to back, ten times. The internal difference is enormous and completely invisible until you do this.

**Monotone.** *Detect:* under 4 semitones of 80th-percentile pitch span. *Fix:* the Monotone Killer. Note the actual instruction — widen the range while **lowering** the mean. Most people do the opposite and produce anxiety.

**Mumbling.** *Detect:* reduced high-frequency energy, unreleased final consonants. *Fix:* the plosive rack and DDK drills. Purely mechanical, responds fast.

**Rushing.** *Detect:* over 6.5 syllables per second combined with a pause fraction under 10%. *Fix:* pause work, not rate work. Rushing is almost always a pause problem wearing a rate costume.

**Trailing off.** *Detect:* final-syllable intensity more than 4 dB below the utterance mean. *Fix:* Volume Floor drill. Also breathe earlier — this is a breath-planning failure most of the time.

**Filler words.** *Detect:* over 1 per 100 words is above a trained target; conversational baseline is about 2.6 per 100. *Fix:* replace the filler with silence. You cannot delete a habit, only substitute one, and silence is the substitution.

**Over-emphasis.** *Detect:* more than one prominence per intonation phrase. *Fix:* the post-focus compression drill. Hit one word, then compress everything after it.

**Sing-song.** *Detect:* identical pitch contour on consecutive sentences. *Fix:* deliberately move the nuclear accent between repetitions.

**Fake enthusiasm.** *Detect:* raised mean pitch with narrow range — the acoustic signature of effort rather than feeling. *Fix:* lower the mean, widen the range. Same paragraph, completely different reception.

**Hedging.** *Detect:* qualifiers stacked before the claim, rising terminals. *Fix:* say the identical sentence with every qualifier deleted and a falling terminal. Change nothing else and listen to what happens to the claim.

**Phrase-final fry.** *Detect:* pitch dropping below 60% of your modal F0 with irregular periodicity, on more than 40% of phrases. *Fix:* breathe at the previous clause boundary. Fry at phrase ends is a breath-management problem, not a voice problem.`},

{id:'practice', title:'How to actually practise', sub:'The protocol that produces change',
 body:`Reading this app does nothing. Here is what works.

**Deliberate over volume.** Twelve focused minutes beats an hour of reps you are not listening to. The mechanism is attention, not repetition — you have to be *comparing* each rep against a target, which is exactly what the scoring is for.

**One parameter at a time.** Do not try to fix pace and terminals and range in the same session. Pick the dial with the worst score, work only on it for a week, and let the others stay wrong. Trying to fix everything is how people fix nothing.

**Record everything, and listen to it later.** Real-time self-perception is unreliable — you hear your voice through bone conduction, which is a completely different signal from what anyone else receives. The playback is the coaching.

**Do the deliberate-defect drills.** Producing uptalk on purpose is the fastest way to stop producing it by accident. This is counter-intuitive enough that most people skip it, and it is the highest-yield thing in the app.

**Warm up first, always.** Straw phonation, lip trills, hum, then the articulator roll-call. Six minutes. It is the difference between practising your voice and practising your tired voice.

**Practise at the edge, perform in the middle.** Drill at exaggerated settings — bigger falls, wider range, longer pauses than you would ever use. Real performance will land at about sixty percent of your practice extremity, which is exactly where you want it.

**Space it out.** Four fifteen-minute sessions across a week beats one hour. This is one of the most robust findings in all of skill acquisition and it is why this app has a spaced-repetition queue rather than a course.

**Practise in the mouth you will perform with.** If you present on video calls, drill on a headset. If you present in rooms, drill standing up at volume. Motor skills are context-bound to an annoying degree.

**A note on plateaus.** They are normal and they last about two to three weeks. The usual cause is that you have automated the thing you were training and have not picked a new target. When a score stops moving, change the dial you are working on.`},

{id:'phone', title:'The channel changes the physics', sub:'Phone, video, room and stage are four different instruments',
 body:`Everything in this app is correct for a conversation across a table. Every other channel bends the rules.

**Phone.** You have lost the entire visual channel, so every signal has to be carried acoustically. Compress your dynamic range — a whisper that works in person disappears into a phone codec. Slow down by roughly ten percent. Increase your verbal acknowledgements, because your listener has no visual confirmation that you are still there. And crucially: phone codecs cut low frequencies, which strips out exactly the chest resonance that carries authority. Compensate with articulation precision rather than with volume.

**Video call.** Latency destroys the pause. A two-second silence over a laggy connection is indistinguishable from a dropped call, and both parties will start talking simultaneously. Shorten dramatic pauses to about 1200 ms and use a visual cue — a small nod, a hand — to signal that the silence is deliberate. Also: eye-line beats everything. Camera at eye height, and look at the lens on the important sentence.

**Room, unamplified.** Now you need real projection, which is a breath-support question rather than a volume question. Widen the dynamic range — you can use the full 12 dB. Lengthen pauses; a room absorbs silence in a way a headset does not. And the back row needs about fifteen percent more articulation than you think.

**Stage with a microphone.** The microphone gives back the intimacy you lose in a room, which means you can whisper again — and a whisper on a stage with good amplification is one of the most powerful things available. But the mic also amplifies every breath, every lip smack and every sibilant. Articulation has to get *cleaner*, not louder.

**Recorded and asynchronous.** No feedback loop at all, so nothing self-corrects. Slow to 110–130 words per minute. Vary at the *sentence* level rather than the word level — long-form listening needs macro variation. And pause harder than feels natural, because your listener may be doing something else.`},

{id:'ethics', title:'The line', sub:'Where technique becomes something else',
 body:`This app teaches a set of tools that work on people. It is worth being explicit about where the boundary sits, because the tools do not come with one.

**The test is whether the thing is true.** Every technique here has an honest use and a dishonest one, and the mechanics are identical in both. A scarcity tone on a real constraint is information. The same tone on a manufactured deadline is a lie delivered well. Nothing in the delivery distinguishes them — only the fact does.

**Emotional intensity is a resource you are spending on their behalf.** Consequence work, identity questions and confrontation all produce real discomfort. That is legitimate when it surfaces something they already knew and were avoiding. It is not legitimate as a lever to be pulled repeatedly because it produces compliance. The practical marker: once is diagnostic, twice is technique, three times is coercion — and it is on the recording.

**A person under distress cannot consent to anything.** If someone becomes genuinely upset, the correct move is to stop, not to press the advantage. This is not only ethics; it is also the commercial answer, because decisions made in that state reverse.

**Sounding certain about something you are not certain about is the core failure mode.** And the research is unusually clear here: confident delivery makes *weak* arguments less persuasive, not more. It amplifies whatever is actually there. So the tonality work has a prerequisite, and the prerequisite is having something true to say.

**The counter-moves matter more than the moves.** The most valuable thing in the Power section is not the ability to run these patterns. It is the ability to feel one running on you in real time and to name it silently. That skill costs nothing and it protects you for the rest of your life.`}
];
</script>

<script>
/* ============================================================
   POWER & PSYCHOLOGY
   Original curriculum written for this app. Draws on the
   established persuasion-science literature (Cialdini,
   Kahneman & Tversky, negotiation research, status theory)
   and on the classical strategy tradition, organised into an
   original taxonomy. Every principle is paired with the tone
   that actually delivers it, the way it fails, and the
   counter-move for when it is used on you.
   ============================================================ */
'use strict';

var POWER_INTRO = {
title:'Read this before the rest of it',
body:'Three things, and then the material.\n\n**Most of this is defensive.** These are patterns that reliably move human behaviour. Learning them lets you use some of them. It lets you *notice* all of them. The counter-move at the end of each entry is the more valuable half of the entry, and if you only ever read those you will still come out ahead.\n\n**Every principle here has an honest version and a dishonest one, and the technique is identical in both.** The difference is whether the thing you are saying is true. A takeaway you mean is the strongest move in selling. A takeaway you do not mean is the cheapest trick in it — and people detect the difference in about two seconds, almost always from tone rather than content. That is why this section lives inside a tonality app instead of next to one.\n\n**Strategy decides what you say. Tone decides what it means.** Run any of these with the wrong tone and it inverts: conviction becomes arrogance, candour becomes weakness, scarcity becomes desperation, warmth becomes ingratiation. That is why every entry names a tone and links straight to the mic. Reading this section without drilling it is how people end up with a vocabulary for power and no ability to produce it.'
};

var POWER_CHAPTERS = {
status:  {name:'Status & Position',  c:'var(--vi)', blurb:'Status is not a personality trait. It is a set of behaviours — how fast you respond, how much you explain, who moves first, what you do with silence — and every one of them is trainable. Most people leak status through their voice before they open their mouth about anything substantive.'},
frame:   {name:'Frame Control',      c:'var(--acc)',blurb:'A frame is the unstated agreement about what kind of conversation this is. Whoever sets it controls what counts as a reasonable request, a fair price, and a good outcome. Frames are almost never argued about openly, which is exactly why they decide everything.'},
influence:{name:'The Influence Engine',c:'var(--cy)', blurb:'The reliably-replicated findings on why people say yes. This is the part with the strongest evidence base and the most abuse. Learn the mechanisms so you can build with them — and so you can feel them operating on you in real time.'},
bias:    {name:'How Decisions Break',c:'var(--pk)', blurb:'People do not evaluate options; they evaluate whichever framing arrived first, against whatever reference point they happened to be carrying. Understanding the systematic ways judgement fails is what separates persuasion from luck.'},
reading: {name:'Reading the Room',   c:'var(--ok)', blurb:'Almost all useful information in a conversation arrives in the channel nobody is monitoring — the pause before an answer, which question gets a shorter response, who goes quiet. This chapter is about noticing.'},
self:    {name:'Self-Command',       c:'var(--no)', blurb:'The hardest chapter and the one that decides the others. Every technique in this app fails under emotional dysregulation. Composure is not a temperament; it is a set of specific, drillable behaviours performed under pressure.'}
};

var PRINCIPLES = [
/* ---------------- STATUS ---------------- */
{ch:'status', n:'Status is a behaviour set, not a trait',
 idea:'Watch a room and you can rank it in ninety seconds without hearing a word of content. High status behaviours: slower movement, less explanation, comfort with silence, willingness to be still. Low status behaviours: rapid nodding, rising terminals, over-explaining, filling gaps, apologising for taking time. None of these are personality. All of them are trainable, and voice carries most of them.',
 sales:'The rep who explains their own question ("I was just wondering, and feel free not to answer, but I was curious whether…") has lost the frame before the prospect has said anything. Ask the question. Stop. Wait.',
 tone:'unbothered', toneWhy:'Unbothered. Same pitch, same volume, same pace as your previous line. The absence of change under pressure is what reads as status.',
 fails:'Performed high status. Deliberate slowness with nothing behind it reads as smugness, and it invites someone to test you.',
 counter:'When someone is running high-status behaviours hard, check whether they have the substance to back it. Status behaviours are cheap; the knowledge underneath them is not.'},

{ch:'status', n:'Never outrank the person who has to approve you',
 idea:'Demonstrated competence is an asset right up until it becomes a threat. The moment someone with authority over an outcome suspects you want their position, your ability stops being useful to them and starts being a thing they manage. The skill is being visibly excellent at the work and visibly uninterested in the chair.',
 sales:'The buyer is the authority on their own business; you are the authority on your domain. Confusing the two is the most common way a smart salesperson loses a deal — by winning an argument in front of the person who signs.',
 tone:'sincerity', toneWhy:'Utter Sincerity keeps expertise from reading as superiority. The drop in energy after a confident claim is what makes the competence safe to be near.',
 fails:'Performed modesty. False humility is more insulting than arrogance, because it assumes they cannot detect it.',
 counter:'When someone defers to you conspicuously, ask what they want. Genuine respect does not have to be demonstrated that hard.'},

{ch:'status', n:'Availability sets your price',
 idea:'Unlimited supply of anything drives its perceived value toward zero, and attention is not an exception. Continuous instant availability recalibrates people downward, not because they are calculating but because scarcity is one of the inputs to how value is estimated.',
 sales:'Response time is a signal whether you intend it as one or not. The rep who replies in nine seconds at eleven at night has communicated something about their pipeline.',
 tone:'scarce', toneWhy:'Quiet Scarcity. Voiced, not whispered — keep the fold vibration or you lose every ounce of authority in the line.',
 fails:'Artificial unavailability. Being hard to reach when you demonstrably have nothing on is theatre, and it plays as theatre.',
 counter:'Judge people on responsiveness when it matters, not responsiveness in general. Some of the best are slow at small things.'},

{ch:'status', n:'Whoever chases, concedes',
 idea:'Initiating is not weakness — but *chasing* is, because repeated unreciprocated pursuit prices your own time in public. The dynamic is structural rather than psychological: each additional follow-up transmits that the alternatives are worse than they were the day before.',
 sales:'Two passes at an objection, then a booked follow-up and genuine release. A third pass produces a refund, not a sale. The math on this is unambiguous and every experienced closer knows it.',
 tone:'takeaway', toneWhy:'The Takeaway. Flat, unemotional, low. Only run it when the disqualification is real — a fake one teaches them everything else was technique too.',
 fails:'Passivity dressed as strategy. Waiting is not a plan; it is what you do when you do not have one.',
 counter:'Notice when you are chasing and name it to yourself. Then decide, deliberately, whether the thing is worth the frame cost. Sometimes it is.'},

{ch:'status', n:'Be load-bearing rather than liked',
 idea:'Being liked is pleasant and structurally fragile. Being necessary is uncomfortable to build and extremely durable. The test is whether your absence would register as a change in mood or as a hole in the operation.',
 sales:'The strongest commercial position is not cheapest or best. It is embedded. Once you are inside a workflow, price stops being the conversation.',
 tone:'absolute', toneWhy:'Absolute Certainty — once per conversation, on the single load-bearing claim. Low, narrow, hard-stopped.',
 fails:'Manufacturing dependency by hoarding knowledge. It works for about a year and it is why people eventually leave.',
 counter:'Ask what happens if this person or supplier disappears on Monday. If nobody can answer, you have a concentration risk rather than a partnership.'},

{ch:'status', n:'Say less than you want to',
 idea:'Past a low threshold, volume of speech and perceived authority move in opposite directions. One sentence and a stop reads as settled. Four sentences reads as building a case — which implies the case needed building.',
 sales:'Every additional sentence after a close is a new surface for a new objection. The most expensive habit in selling is answering the question and then continuing past the answer.',
 tone:'sl_close', toneWhy:'No Big Deal, then silence. The flat delivery plus the full stop is the entire mechanism. Neither works without the other.',
 fails:'Brevity without warmth reads as contempt. Short and cold is a different thing from short and settled.',
 counter:'When someone is conspicuously brief, resist filling it. Match their brevity and see who moves first.'},

/* ---------------- FRAME ---------------- */
{ch:'frame', n:'Set the time frame first',
 idea:'Whoever states the duration owns the shape of the interaction. Announcing a limit at the start is the cheapest authority move available, and — counter-intuitively — it is received as respect rather than as control.',
 sales:'"I have got you for about thirty minutes, let us use them properly" does four things at once: sets authority, signals respect, creates mild urgency, and licenses you to redirect later without it being rude.',
 tone:'certainty', toneWhy:'Certainty / Transition. Low mean pitch, wide range, clean falling terminal. Calm, not brisk.',
 fails:'Announcing a limit and then blowing through it. You have now demonstrated that your stated commitments are soft.',
 counter:'When someone sets a tight frame, ask what happens if you need longer. The answer tells you whether it was real or positioning.'},

{ch:'frame', n:'Ask for the licence before you use it',
 idea:'Directness without permission reads as an attack. The identical sentence, after "can I be completely straight with you?", reads as courage. The permission costs four seconds and changes the entire reception of everything afterwards.',
 sales:'Every blunt thing you say at minute forty cashes a cheque written in the first two minutes. Reps who skip the licence and then get direct are heard as aggressive; reps who set it are heard as honest.',
 tone:'invite', toneWhy:'The Reasonable Ask. Rising terminal, light, quick, slightly softened. One rise, then return to falls.',
 fails:'Asking for the licence and then not using it. You have set up a confrontation and delivered a compliment; they notice.',
 counter:'When asked for permission to be blunt, say yes and then hold them to it. Most people flinch.'},

{ch:'frame', n:'Disqualify openly and early',
 idea:'Stating that not everyone is a fit inverts the direction of pursuit. It also makes every subsequent positive claim more credible, because you have already demonstrated a willingness to say no.',
 sales:'"There are people we cannot help, and I would rather find that out in the first ten minutes than the last." This single sentence does more for a conversation than any amount of rapport-building.',
 tone:'takeaway', toneWhy:'The Takeaway, in its honest use. Flat, matter-of-fact, no emotional colour at all.',
 fails:'Disqualification as a move. If you never actually disqualify anyone, the frame is decorative and experienced buyers spot it.',
 counter:'Ask them to describe someone they turned away recently. A real answer arrives immediately and with specifics.'},

{ch:'frame', n:'A reason they give you outranks a reason you give them',
 idea:'A conclusion you supply is a claim they can argue with. A conclusion they supply is a position they now have to defend — to you, and more importantly to themselves. This is the single highest-leverage idea in the entire discipline.',
 sales:'"And why do you feel that way?" is the most valuable question in a close, because whatever comes out of their mouth is the sentence you use for the rest of the conversation. Ask it, then say nothing — adding "because for me the biggest thing is…" contaminates the answer permanently.',
 tone:'probe', toneWhy:'The Gentle Probe. Four words, then silence. The shorter the probe, the more they fill.',
 fails:'Extracting a reason and then arguing with it. You asked; you have to accept the answer or the question was fake.',
 counter:'When you notice you are being asked to build someone else\'s argument, give the honest answer anyway. The technique works because honesty is useful to you too.'},

{ch:'frame', n:'Name inaction as a choice',
 idea:'Most people experience doing nothing as neutral — as the absence of a decision rather than one of the options. Pricing it is what makes the comparison honest, and it is usually the only comparison that matters.',
 sales:'"There is no version of this where you do not decide. Waiting is a decision, it just does not feel like one." Then stop and let the arithmetic happen in their head, not yours.',
 tone:'consequence', toneWhy:'Consequence / Emotional Drop. The lowest, slowest, quietest tone in the system. Underplay it — the content is heavy enough on its own.',
 fails:'Manufacturing consequences that will not occur. It works once and is remembered for years.',
 counter:'Check whether the stated cost of waiting is real or rhetorical. Ask for the number.'},

{ch:'frame', n:'Hold one frame per conversation',
 idea:'Frames are almost never argued about openly — they are established and then either maintained or abandoned. Switching mid-conversation is what people notice, and what they read as either confusion or manipulation.',
 sales:'If you opened as a peer working something out together, you cannot close as a vendor asking for the order. The gear change is audible and it undoes everything the first frame bought you.',
 tone:'nq_neutral', toneWhy:'Detached Neutral is the most sustainable frame because it costs nothing to hold. High-energy frames are expensive and they slip.',
 fails:'Rigidity. Holding a frame that has stopped fitting the situation is worse than switching.',
 counter:'Notice the moment a frame changes. That moment is almost always where the real conversation starts.'},

{ch:'frame', n:'Two yeses beat one whether',
 idea:'A choice presented inside a frame is accepted far more readily than a choice about the frame. "Which of these two" is a materially easier question than "whether at all" — and both produce a decision.',
 sales:'"Paid in full or a plan — which is easier for you?" The most reliable structural move in closing, and it works only after a genuine yes. Before one, it is transparent and it costs you the deal.',
 tone:'sl_presup', toneWhy:'Presupposing. Even, calm, flat-to-falling, unhurried. Any energy at all and it reveals itself as a technique.',
 fails:'The false choice. Two options that are obviously the same insults them.',
 counter:'When you find yourself choosing between options, step back one level and check whether you agreed to the category.'},

/* ---------------- INFLUENCE ---------------- */
{ch:'influence', n:'Reciprocity',
 idea:'People feel a real obligation to return a favour, and it is disproportionate to the favour\'s size. The effect is strongest when the gift is unexpected, personalised and given before anything is asked for. Personalisation matters most of the three.',
 sales:'Give something genuinely useful before any ask — a specific piece of advice they can act on today, not a brochure. The obligation is a side effect; the usefulness has to be real or it inverts.',
 tone:'warm', toneWhy:'Genuine Warmth. Wide melodic range rather than raised register — raising your whole pitch sounds anxious, widening your movement sounds glad.',
 fails:'Manufacturing obligation with something worthless. People price a gift accurately and resent being invoiced for a cheap one.',
 counter:'Accept the gift and make the decision separately. Noticing the obligation is most of the way to neutralising it.'},

{ch:'influence', n:'Commitment and consistency',
 idea:'Once a person states a position they defend it — to others and, more powerfully, to themselves. Commitments that are voluntary, effortful and stated aloud are dramatically stickier than ones that are private or coerced.',
 sales:'The double-confirm — a yes, then "are you sure?" — exists for exactly this reason. It converts a polite agreement into a defended position, which is what survives the drive home and the conversation with a partner.',
 tone:'nq_challenge', toneWhy:'Respectful Pressure. Slow, low, firm, no increase in volume. The tone of someone on their side who is not letting them off the hook.',
 fails:'Trapping someone on a technicality of something they said forty minutes ago. It produces compliance and resentment in the same instant.',
 counter:'Give yourself explicit permission to change your mind. "I said that before I knew X" is a complete and sufficient sentence.'},

{ch:'influence', n:'Social proof',
 idea:'Under uncertainty people look sideways rather than forward. The effect is strongest when the referenced others are *similar* — a peer\'s behaviour outweighs an expert\'s recommendation for most everyday decisions.',
 sales:'Specific and similar beats impressive and distant. Someone in their exact position, three months ago, with a name and a number, beats a wall of enterprise logos.',
 tone:'c_clinical', toneWhy:'Clinical. Level, even, no colour. Proof delivered enthusiastically reads as marketing; delivered flatly it reads as fact.',
 fails:'Fabricated or unrepresentative proof. One phone call destroys it permanently.',
 counter:'Ask about the ones that did not work. A real answer arrives with detail; an absent answer is the answer.'},

{ch:'influence', n:'Liking',
 idea:'We say yes to people we like, and liking is driven by similarity, genuine specific compliments, and cooperation toward a shared goal — roughly in that order of strength.',
 sales:'Find the real similarity rather than the manufactured one, and give one specific compliment about something they *chose* rather than something they were given. Complimenting a decision is flattery that survives scrutiny.',
 tone:'nq_playful', toneWhy:'Playful. Light, quick, slightly raised, usually rising. Use it early and retire it — playfulness in the consequence section is disqualifying.',
 fails:'Mirroring so obviously it becomes mimicry. Prosodic entrainment works because it is unconscious; performed, it reads as mockery.',
 counter:'Notice when you like someone very quickly. It is not necessarily wrong, but it is worth knowing it happened.'},

{ch:'influence', n:'Authority',
 idea:'Credentials, confident delivery and the visual trappings of expertise all shift compliance — and they work largely independently of actual competence. Which is exactly why the counter-move here matters more than the technique.',
 sales:'Establish authority through specificity, not assertion. Someone who knows the precise failure rate, the actual timeline and the real constraint does not have to claim expertise; the numbers do it.',
 tone:'absolute', toneWhy:'Absolute Certainty. Low mean pitch, wide range, hard falling terminals. Most people flatten to sound authoritative, which just sounds dead — range and register are independent.',
 fails:'Borrowed authority. Name-dropping has no load-bearing capacity and collapses under a single follow-up question.',
 counter:'Ask a specific technical question inside their claimed domain. Real expertise answers immediately or says "I do not know" immediately. Only the fake version hedges.'},

{ch:'influence', n:'Scarcity',
 idea:'Losses loom roughly twice as large as equivalent gains. Framing something as about to be lost is measurably more motivating than framing the identical thing as available to be gained.',
 sales:'Only ever state limits you could prove. If you would not put it in writing, do not put it in your voice — buyers now default to assuming deadlines are fake, so a real one has to be delivered flatly enough to be believed.',
 tone:'scarce', toneWhy:'Quiet Scarcity. Dropped, slowed, quiet but fully voiced. Sotto voce, never actual whisper — a true whisper has no pitch and loses all authority.',
 fails:'The manufactured deadline. The single most trust-destroying pattern in commercial communication.',
 counter:'Ask what happens if you miss it. The answer is usually "nothing much", and asking costs nothing.'},

{ch:'influence', n:'Unity',
 idea:'The strongest form of liking. Not "this person is similar to me" but "this person is one of us" — shared identity rather than shared preference. Family, place, having done the same difficult thing.',
 sales:'Find the genuinely shared category and then let it sit there without commenting on it. Naming it out loud converts it into a technique.',
 tone:'c_conspir', toneWhy:'Conspiratorial. Dropped, close, quick, quiet. Only ever share things that reflect well on the absent party — conspiratorial criticism makes them wonder what you say about them.',
 fails:'Claiming an in-group you are not in. Detected immediately by anyone actually in it, and unrecoverable.',
 counter:'Shared identity is real and it is not an argument. You can feel the kinship and still evaluate the offer.'},

{ch:'influence', n:'Concede one real thing',
 idea:'Voluntarily naming a genuine weakness does something no amount of advocacy achieves: it makes everything else more credible. Listeners calibrate on candour — someone who admits one real flaw is assumed to have told the truth about the rest.',
 sales:'Say the bad thing first and plainly. "This is not passive and it does not run itself. If you are not going to do the work, do not join." That sentence sells, precisely because it proves you are willing to lose the deal.',
 tone:'sincerity', toneWhy:'Utter Sincerity. Slower and quieter than the line before it. The drop in energy is what makes it read as true rather than as a move.',
 fails:'The fake flaw. "My weakness is that I care too much" is worse than silence — it demonstrates that you think they are stupid.',
 counter:'Check whether the admitted flaw costs them anything. A concession with no cost is an advertisement.'},

/* ---------------- BIAS ---------------- */
{ch:'bias', n:'Anchoring',
 idea:'The first number mentioned distorts every subsequent judgement — including in people who know about anchoring and are actively trying to resist it. The effect is unusually robust and survives being explained.',
 sales:'Anchor against the cost of the problem rather than against competitors. Comparing your price to another wasted year is a different negotiation from comparing it to another vendor\'s quote.',
 tone:'c_clinical', toneWhy:'Clinical. Numbers delivered as weather. Any emphasis on the figure and you have signalled that you expect a reaction to it.',
 fails:'Absurd anchors, which destroy credibility and reset the negotiation on worse terms than not anchoring at all.',
 counter:'Before entering a negotiation, write your own number down. An anchor you brought with you is much harder to move.'},

{ch:'bias', n:'Loss aversion',
 idea:'The same outcome framed as a loss produces roughly double the behavioural response as framed as a gain. This is the mechanism underneath almost everything called "consequence" work.',
 sales:'Concrete losses only. Not "you could be earning more" but "another twelve months of exactly this, and then this same conversation." The specificity is what makes it land.',
 tone:'consequence', toneWhy:'Consequence / Emotional Drop. Lowest pitch, slowest pace, quietest volume, deep fall into silence.',
 fails:'Fear about things that will not happen. Detected eventually, and it retroactively contaminates everything true you said.',
 counter:'Restate the loss frame as a gain frame and see whether you still care. If the answer changes, the framing was doing the work.'},

{ch:'bias', n:'Framing',
 idea:'Logically identical information produces different decisions depending on presentation. Ninety percent success and ten percent failure are the same fact and are not the same message.',
 sales:'Choose the frame deliberately and then hold it. Frame-switching mid-conversation is the thing people notice, and it costs more than either frame would have.',
 tone:'sl_obvious', toneWhy:'Implied Obviousness. Deaccent the given clause, re-energise on the pivot. Only ever deaccent things they have already accepted.',
 fails:'Framing that conceals a material fact. That is not framing, it is misrepresentation with better vocabulary.',
 counter:'Restate any claim in the opposite frame before deciding. It takes five seconds and it is remarkably clarifying.'},

{ch:'bias', n:'The endowment effect',
 idea:'People value a thing more once they possess it — or even once they merely imagine possessing it. Ownership is largely psychological and it begins well before any transaction.',
 sales:'Get them handling it, describing it, planning around it. "When you are running this in six weeks, the thing you will notice first is…" installs ownership before purchase, and it is not dishonest as long as the six weeks is real.',
 tone:'sl_presup', toneWhy:'Presupposing. Calm, even, unhurried, falling. Never before a genuine yes — presupposition ahead of agreement is the leading cause of late-stage collapse.',
 fails:'Trials engineered to create sunk cost rather than demonstrate value. Buyers can tell the difference and they remember.',
 counter:'Ask what you would pay for it today if you did not already have it. That is the actual number.'},

{ch:'bias', n:'The open loop',
 idea:'Unfinished tasks occupy memory more than completed ones. An open question is uncomfortable and the mind works to close it — which is why unfinished stories are remembered and resolved ones are not.',
 sales:'Open a loop early and close it late. "I will tell you the one variable that actually mattered, but first I have to show you why every obvious answer is wrong." Then deliver — within a couple of minutes, or it becomes irritation.',
 tone:'intrigue', toneWhy:'Mystery & Intrigue. Dropped pitch, slowed pace, elongation on one sonorant in the key word.',
 fails:'Opening loops you never close. This is the mechanism of clickbait and it burns the audience permanently.',
 counter:'Notice when you are still listening only because something was promised. Ask for it directly.'},

{ch:'bias', n:'The concrete beats the abstract',
 idea:'The mind does not act on categories; it acts on images. A statistic is an argument, a scene is an experience, and only one of them survives the drive home.',
 sales:'"Financial freedom" moves nobody. A specific person in a specific house moves everybody. Build a desired future as an inventory of objects and scenes, never as adjectives.',
 tone:'vision', toneWhy:'Vision / Future Pace. Slow, spacious, wide movement, generous silence. Ask, then stop — the picture forms in the gap, not in your description.',
 fails:'Vividness in place of substance. Once it works; twice they check the numbers.',
 counter:'Convert every vivid claim back into a figure and see whether it survives the translation.'},

{ch:'bias', n:'Sunk cost',
 idea:'Money and time already spent are irrelevant to the next decision and are treated as decisive anyway. The pull is strong enough that people will knowingly continue projects they have already concluded will fail.',
 sales:'Never use this against a buyer — it is the most reliably regretted purchase driver there is, and regret becomes refunds. Do use it on yourself, in reverse, to kill your own dying deals faster.',
 tone:'measured', toneWhy:'Measured Correction. Even, unhurried, no emphasis spike. Deaccent the correction and it lands as information rather than as a rebuke.',
 fails:'"You have already invested so much" is the sentence. It closes deals and produces chargebacks.',
 counter:'Ask what you would do if you were arriving at this situation today, fresh, with the same information. Then do that.'},

/* ---------------- READING ---------------- */
{ch:'reading', n:'The pause before the answer',
 idea:'Latency carries more information than content. A question answered instantly was pre-loaded. A question answered after a long gap touched something. A question answered *faster than the others* is the one they had a script for.',
 sales:'Track which questions get short answers. The short answer is almost always the important one, and it is short precisely because it is defended.',
 tone:'probe', toneWhy:'The Gentle Probe. Two to four words, quiet, flat terminal, then wait. "Say more about that" costs nothing and opens everything.',
 fails:'Over-reading. Sometimes a pause is a phone notification.',
 counter:'When you notice yourself pausing before answering, that is worth your own attention too.'},

{ch:'reading', n:'Read the person before choosing the move',
 idea:'The same technique produces opposite outcomes on different people. Direct challenge builds respect with one type and permanently ends the relationship with another. Failing to identify which one is in front of you is the most expensive unforced error available.',
 sales:'The highest-leverage thirty seconds of any conversation is the part where you work out whether this person wants warmth or wants efficiency. Give the wrong one and everything afterwards is uphill.',
 tone:'reflect', toneWhy:'The Mirror. Match their register, then hand their own words back one beat slower. Matching before leading is how you find out who you are speaking to.',
 fails:'Typecasting. People are not four categories, and treating them as such is its own failure of reading.',
 counter:'Watch how someone treats a person who cannot help them. That is the read that matters.'},

{ch:'reading', n:'Silence in a group is a position',
 idea:'Group resistance almost always has a single origin, and it is rarely the person doing the talking. The quiet one in a multi-stakeholder decision is usually holding the actual objection and declining to spend social capital on it publicly.',
 sales:'Find them and give them a private route to state the objection where they do not have to defend it in front of colleagues. That conversation is the deal.',
 tone:'confront', toneWhy:'Direct Confrontation — with permission first. Ask for the licence, then be completely direct. Low, level, no increase in volume.',
 fails:'Targeting the wrong person, which manufactures the opposition you were trying to prevent.',
 counter:'In any group decision, ask explicitly who has not spoken yet. It costs nothing and it changes outcomes.'},

{ch:'reading', n:'Agreement is not engagement',
 idea:'A person who agrees with everything is not close to buying; they are close to leaving. Agreement is free and tells you almost nothing. Disagreement costs something to produce, which is precisely what makes it a signal.',
 sales:'The conversation with no friction is the conversation that ghosts. If nobody has pushed back on anything by the halfway mark, ask something they can disagree with.',
 tone:'skeptic', toneWhy:'Skeptical Disbelief, gently. Rise-fall-rise, unresolved, quiet. Skepticism at volume is contempt; skepticism at low volume is curiosity.',
 fails:'Manufacturing conflict to test engagement. It works, and it costs you the relationship you were testing.',
 counter:'When you notice yourself agreeing with everything, work out whether you actually agree or have simply stopped participating.'},

{ch:'reading', n:'Find the one thing they actually care about',
 idea:'Everyone has a single dominant motivation in any given decision, and it is rarely the one they lead with. Finding it is worth more than every other piece of information combined, because everything else negotiates around it.',
 sales:'"Of everything I have shown you, what is the one piece that actually changes things for you?" That answer tells you which value proposition to defend for the rest of the conversation, and it makes a generic offer specific.',
 tone:'probe', toneWhy:'The Gentle Probe. Short, quiet, flat. Then nothing, for as long as it takes.',
 fails:'Weaponising a vulnerability. There is a bright line between understanding what someone needs and exploiting what they fear, and it is not a subtle one.',
 counter:'Notice when a conversation keeps returning to the same theme. That is usually someone locating your lever.'},

/* ---------------- SELF ---------------- */
{ch:'self', n:'Composure is leverage',
 idea:'In any exchange, whoever reacts has transferred both information and control. Provocation is a test, and the only winning response is a boring one. This is not about suppressing emotion; it is about delaying its expression by one breath.',
 sales:'When an objection arrives with heat, drop your own energy rather than matching it. Prosodic entrainment means they will follow you down within two or three exchanges — you do not have to ask them to calm down, and asking makes it worse.',
 tone:'c_soothe', toneWhy:'Soothing. Slower and quieter than them, with absolutely zero acceleration. Never name their emotion as a problem.',
 fails:'Composure as coldness. Unbothered with a warm face is authority; unbothered with a flat face is contempt.',
 counter:'When you feel a reaction rising, delay it by one full breath. That delay is the entire skill and it is trainable.'},

{ch:'self', n:'Do not join a fight that is not yours',
 idea:'Being pulled into someone else\'s conflict costs the neutrality that made you useful to both parties. Independence has an option value that is hard to see until you have spent it.',
 sales:'Never criticise a competitor. The moment you do, the buyer stops seeing an advisor and starts seeing a combatant with an interest.',
 tone:'measured', toneWhy:'Measured Correction. Even, unhurried, no spike. Deaccent the corrected item so it lands as clarification instead of a swipe.',
 fails:'Neutrality on things that genuinely matter. Refusing to take a position on basic decency is a position, and it is read as one.',
 counter:'Ask what happens to the person recruiting you if you decline. If the answer is "nothing", it was never your fight.'},

{ch:'self', n:'Concentrate the force',
 idea:'Diffuse effort produces diffuse results. Almost every underperformance problem at every scale is a concentration problem rather than an effort problem, and it is consistently misdiagnosed as the second.',
 sales:'One drill per week, not ten. A person changes one behaviour at a time. A coaching session that produces fifteen findings produces zero changes.',
 tone:'command', toneWhy:'Command. Short, complete, no hedges, steepest fall in the system. One per hour gets obeyed; one every four minutes gets ignored.',
 fails:'Concentration on the wrong thing, which is intensified error.',
 counter:'Ask what has been deprioritised. If nothing has, then nothing is concentrated.'},

{ch:'self', n:'Half-commitment is worse than none',
 idea:'Tentative action produces the costs of acting and the results of not acting, and leaves a live problem with a grievance attached. Observers read hesitation as information about the quality of the idea — and they are usually right.',
 sales:'A close delivered apologetically has already failed. The ask should be the most ordinary sentence in the conversation, delivered flat, followed by silence.',
 tone:'sl_close', toneWhy:'No Big Deal. Casual, slightly quick, no emphasis spike, then a complete stop.',
 fails:'Boldness without preparation, which is recklessness with better branding.',
 counter:'Separate confidence about the decision from confidence about the outcome. Only the first is required to act.'},

{ch:'self', n:'You are allowed to rebuild the instrument',
 idea:'Most adults are running an identity assembled by accident before twenty-five, including how they sound. The deliberate revision of that — voice, pace, terminal habits, default tone — is the single most under-used freedom available, and it is the entire premise of this app.',
 sales:'Nobody in the room has a natural gift for this. They learned a skill you have not learned yet. That is the whole difference, and it is the truest and safest sentence in selling.',
 tone:'certainty', toneWhy:'Certainty / Transition. Calm, low, wide, clean fall. Delivered with any hype at all it becomes a motivational poster.',
 fails:'Reinvention as avoidance. Changing the presentation while leaving the behaviour intact fools nobody for long.',
 counter:'Judge a new version on six months of behaviour, not on the announcement of it.'},

{ch:'self', n:'Have no fixed style',
 idea:'The last principle undoes the others. A recognisable pattern is a predictable one, and a predictable one gets defended against. The point of acquiring a set of tools is to stop needing any particular one.',
 sales:'This app contains two contradictory tonal systems — one loud and outcome-attached, one quiet and detached. Both work. Neither works always. The skill is not choosing a philosophy; it is holding both and reading which one the room needs.',
 tone:'neutral', toneWhy:'Neutral / Curious. The tone with no colour is the one you return to between all the others. Having a resting position is what makes range possible.',

<script>
/* ============================================================
   THE BRAIN — authored knowledge spine
   Every node is real: a mechanism, a figure from the literature,

   t = what it is · h = how it helps you · v = headline figure
   The 72 tones, 230 twisters, 39 principles, codex chapters,

   ============================================================ */
'use strict';

/* ROOT + THE TEN DOMAINS ------------------------------------------------ */
{id:"root",n:"How this works",k:"root",
 t:"Everything this app measures, every number it scores you against, and every rule it uses to decide what you should sound like. None of it is invented. This map is the whole engine, opened up.",
 h:"You are being graded by a machine. You should be able to see exactly what it believes and why, so you can argue with it — and so you can trust it when it says you got better."},

{id:"voice",p:"root",n:"Sound & the voice",k:"domain",hemi:-1,
 t:"How a human being physically produces a sound, from the air in your lungs to the pressure wave that leaves your mouth. Three stages: a power supply, a vibrating source, and a filter that shapes it.",
 h:"Almost every voice problem is one of these three stages failing. Knowing which stage is broken tells you which drill fixes it, instead of guessing."},

{id:"pros",p:"root",n:"Prosody",k:"domain",hemi:-1,
 t:"The music of speech — the parts that ride on top of the words. Four independent dials: pitch, timing, loudness and voice quality. Change the dials and the same sentence means something different.",
 h:"This is the entire subject of this app. Every drill here moves one of these four dials on purpose, so you stop being at the mercy of whichever one your mood happens to move."},

{id:"artic",p:"root",n:"Articulation",k:"domain",hemi:-1,
 t:"How the tongue, lips, jaw and soft palate carve airflow into distinguishable speech sounds. Roughly 44 phonemes in English, each a specific geometry held for a few tens of milliseconds.",
 h:"Tonality can be perfect and still fail if the words arrive smeared. Articulation is the cheapest fix in the whole app — it is mechanical, it responds fast, and progress is obvious within days."},

{id:"eng",p:"root",n:"The measurement engine",k:"domain",hemi:-1,
 t:"What actually happens between your microphone and your score. Sampling, windowing, pitch detection, voice-activity gating, segmentation, and the derived statistics. All of it runs inside your browser.",
 h:"When a score surprises you, this is where the answer is. It also shows you exactly what is never captured — no audio leaves the machine, and this is the proof of it."},

{id:"score",p:"root",n:"Scoring & fairness",k:"domain",hemi:-1,
 t:"How a set of acoustic numbers becomes a grade out of 100 — which bands, taken from which findings, weighted how, and what the app does about the fact that no two voices start in the same place.",

{id:"perc",p:"root",n:"How listeners decode you",k:"domain",hemi:1,

{id:"tone",p:"root",n:"The tone system",k:"domain",hemi:1,

{id:"psych",p:"root",n:"Influence & psychology",k:"domain",hemi:1,

{id:"learn",p:"root",n:"Learning & practice",k:"domain",hemi:1,

/* ===================================================================== */
{id:"v.pow",p:"voice",n:"The power supply",k:"concept",
 t:"Air pressure below the vocal folds — subglottal pressure — driven by the diaphragm, intercostals and abdominal wall. Typically 5 to 10 cm of water for conversational speech, rising to 30 or more for a shout.",
 h:"Almost everything people call confidence in a voice is really pressure stability. If the support fails, pitch wobbles, the ends of sentences die, and no amount of intention fixes it."},

{id:"v.pow.dia",p:"v.pow",n:"The diaphragm",k:"concept",
 t:"A dome of muscle under the lungs. It contracts downward to inhale, and then — critically — releases slowly against the abdominal wall during speech rather than collapsing.",
 h:"The controlled release is the skill. That eccentric control is what lets you spend a breath evenly across a long sentence instead of dumping most of it into the first four words."},

{id:"v.pow.sup",p:"v.pow",n:"Breath support, precisely",k:"concept",
 t:"Not taking a big breath. It is the balance between the elastic recoil of the ribcage wanting to collapse and the abdominal muscles resisting it, held steady so pressure stays constant while lung volume falls.",
 h:"This is why the count-to-twenty drill exists. Losing more than about 4 dB from the first number to the last means the balance is failing, and that is a measurable, trainable thing."},

{id:"v.pow.mpt",p:"v.pow",n:"Maximum phonation time",k:"number",v:"15-25 s",
 t:"How long you can sustain a comfortable vowel on one breath. Around 15 to 20 seconds indicates adequate support in most adults; above 25 is strong; under 10 usually points to inefficient fold closure rather than small lungs.",
 h:"It is the cheapest weekly benchmark you have. One number, thirty seconds, and it moves in response to training — the app records it during calibration."},

{id:"v.pow.clav",p:"v.pow",n:"Clavicular breathing",k:"defect",
 t:"Breathing high into the chest with visible shoulder rise. Recruits accessory neck muscles, raises the larynx, and gives you a small volume of air held under unstable pressure.",
 h:"It is the default under stress, which is exactly when you need the opposite. Catching it is easy — if your shoulders move on the inhale, that is it."},

{id:"v.src",p:"voice",n:"The source: vocal folds",k:"concept",
 t:"Two layered folds of tissue in the larynx, roughly 17 to 25 mm long in adult men and 12 to 17 mm in adult women. Air forced between them sets up a self-sustaining oscillation.",
 h:"Fold length is the only reason male and female voices sit in different registers. It is also why raw pitch in Hz is useless for comparing two people — and why this app converts everything to semitones."},

{id:"v.src.ber",p:"v.src",n:"Why folds vibrate at all",k:"concept",
 t:"Not muscle twitching — they oscillate passively. Airflow between the folds drops the pressure there, they get sucked together, pressure builds beneath, they blow apart, and the cycle repeats. Around 100 times a second for a typical male voice.",
 h:"Once you know it is aerodynamic rather than muscular, the fix for a strained voice stops being 'push harder' and becomes 'change the airflow' — which is exactly what straw phonation does."},

{id:"v.src.f0",p:"v.src",n:"Fundamental frequency (F0)",k:"number",v:"85-180 / 165-255 Hz",

{id:"v.src.reg",p:"v.src",n:"Registers",k:"concept",
 t:"Distinct modes of fold vibration. Modal is the everyday speaking mode with full closure. Falsetto has thin, stretched folds and incomplete closure. Vocal fry is a slow, irregular flutter at the very bottom, often under 70 Hz.",
 h:"Each register has a characteristic effect on a listener, and each has a drill here. Fry in particular reads as boredom or exhaustion and is worth learning to hear in yourself."},

{id:"v.src.fry",p:"v.src.reg",n:"Vocal fry",k:"defect",v:"<70 Hz",
