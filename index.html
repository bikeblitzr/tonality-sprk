<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="The Tonality Gym — an endless training system for voice, tone, emphasis, articulation and the psychology of influence.">
<meta name="theme-color" content="#0a0a0b">
<title>The Tonality Gym</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230a0a0b'/%3E%3Cg fill='%23e8b04b'%3E%3Crect x='5' y='13' width='2.6' height='6' rx='1.3'/%3E%3Crect x='10' y='9' width='2.6' height='14' rx='1.3'/%3E%3Crect x='15' y='5' width='2.6' height='22' rx='1.3'/%3E%3Crect x='20' y='10' width='2.6' height='12' rx='1.3'/%3E%3Crect x='25' y='14' width='2.6' height='4' rx='1.3'/%3E%3C/g%3E%3C/svg%3E">
<style>
/* ============================================================
   THE TONALITY GYM — stylesheet
   ============================================================ */
:root{
  color-scheme:dark;
  --bg:#08080a; --plane:#0e0e11; --panel:#151518; --raise:#1d1d21; --hi:#26262b;
  --ink:#f4f3f0; --ink2:#a8a6a0; --muted:#726f69; --faint:#4a4844;
  --line:rgba(255,255,255,.075); --line2:rgba(255,255,255,.14);
  --acc:#e8b04b; --acc-d:#ffca6b; --acc-wash:rgba(232,176,75,.11); --acc-line:rgba(232,176,75,.32);
  --cy:#5ecdf0;  --cy-wash:rgba(94,205,240,.12);
  --ok:#4ec97e;  --ok-wash:rgba(78,201,126,.12);
  --no:#ef5f52;  --no-wash:rgba(239,95,82,.12);
  --vi:#a98bf0;  --vi-wash:rgba(169,139,240,.13);
  --pk:#f07fb4;  --pk-wash:rgba(240,127,180,.12);
  --shadow:0 1px 2px rgba(0,0,0,.5),0 8px 30px rgba(0,0,0,.35);
  --shadow-lg:0 2px 6px rgba(0,0,0,.5),0 24px 70px rgba(0,0,0,.5);
  --r:13px; --r2:9px;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Inter,Roboto,sans-serif;
  --rail:236px;
}
html[data-theme="light"]{
  color-scheme:light;
  --bg:#f6f5f2; --plane:#fbfaf8; --panel:#ffffff; --raise:#f4f2ee; --hi:#eae7e0;
  --ink:#101012; --ink2:#4e4c48; --muted:#83807a; --faint:#a8a49c;
  --line:rgba(10,10,12,.10); --line2:rgba(10,10,12,.17);
  --acc:#b07c12; --acc-d:#8c6108; --acc-wash:rgba(176,124,18,.10); --acc-line:rgba(176,124,18,.30);
  --cy:#1d7fa8; --cy-wash:rgba(29,127,168,.10);
  --ok:#1d8a4a; --ok-wash:rgba(29,138,74,.10);
  --no:#c33a2c; --no-wash:rgba(195,58,44,.09);
  --vi:#6a4bc4; --vi-wash:rgba(106,75,196,.10);
  --pk:#c2417c; --pk-wash:rgba(194,65,124,.10);
  --shadow:0 1px 2px rgba(16,16,18,.06),0 6px 22px rgba(16,16,18,.07);
  --shadow-lg:0 2px 6px rgba(16,16,18,.07),0 20px 56px rgba(16,16,18,.12);
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);
  font-size:15.5px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;color:inherit}
a{color:var(--acc);text-decoration:none}
a:hover{text-decoration:underline}
::selection{background:var(--acc-wash);color:var(--ink)}
h1,h2,h3,h4{margin:0;font-weight:660;letter-spacing:-.015em;line-height:1.22}
p{margin:0 0 .85em}
p:last-child{margin-bottom:0}
code,kbd{font-family:var(--mono);font-size:.88em;background:var(--raise);border:1px solid var(--line);
  border-radius:5px;padding:1px 5px}
kbd{border-bottom-width:2px}
.btn kbd{background:rgba(0,0,0,.16);border-color:rgba(0,0,0,.2);color:inherit;font-size:.76em;
  padding:1px 5px;border-bottom-width:1px;opacity:.72}
.btn.sec kbd,.btn.gh kbd{background:var(--plane);border-color:var(--line);opacity:.85}

/* scrollbars */
*::-webkit-scrollbar{width:11px;height:11px}
*::-webkit-scrollbar-track{background:transparent}
*::-webkit-scrollbar-thumb{background:var(--hi);border-radius:8px;border:3px solid transparent;background-clip:content-box}
*::-webkit-scrollbar-thumb:hover{background:var(--line2);background-clip:content-box;border:3px solid transparent}

/* ---------- shell ---------- */
#shell{display:grid;grid-template-columns:var(--rail) 1fr;height:100dvh;overflow:hidden}

#rail{background:var(--plane);border-right:1px solid var(--line);display:flex;flex-direction:column;
  overflow:hidden;position:relative;z-index:20}
.brand{display:flex;align-items:center;gap:10px;padding:17px 18px 13px;flex:none}
.brandmark{width:30px;height:30px;border-radius:8px;background:var(--panel);border:1px solid var(--line2);
  display:grid;place-items:center;flex:none}
.brandmark svg{display:block}
.brandtxt b{display:block;font-size:14px;font-weight:680;letter-spacing:-.01em;line-height:1.15}
.brandtxt span{display:block;font-size:10.5px;color:var(--muted);letter-spacing:.09em;text-transform:uppercase;font-weight:600}

/* hud */
.hud{margin:0 12px 12px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r2);
  padding:11px 12px 12px;flex:none;cursor:pointer;transition:border-color .15s}
.hud:hover{border-color:var(--line2)}
.hudtop{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:0 0 7px}
.hudlvl{font-size:13.5px;font-weight:700;letter-spacing:-.01em}
.hudlvl i{font-style:normal;color:var(--acc)}
.hudrank{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:650;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:104px;text-align:right}
.xpbar{height:5px;border-radius:3px;background:var(--hi);overflow:hidden}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc-d));
  border-radius:3px;transition:width .5s cubic-bezier(.22,1,.36,1)}
.hudsub{display:flex;justify-content:space-between;gap:10px;margin:7px 0 0;font-size:10px;color:var(--muted);
  font-family:var(--mono);letter-spacing:.01em;white-space:nowrap}
.hudsub span{overflow:hidden;text-overflow:ellipsis}
.hudsub b{color:var(--ink2);font-weight:600}

nav{flex:1;overflow-y:auto;padding:0 10px 14px}
.navgrp{font-size:9.5px;font-weight:750;letter-spacing:.13em;text-transform:uppercase;color:var(--faint);
  padding:15px 10px 6px;user-select:none}
.nb{display:flex;align-items:center;gap:9px;width:100%;text-align:left;padding:7.5px 10px;border-radius:8px;
  font-size:13.5px;color:var(--ink2);font-weight:520;transition:background .12s,color .12s;position:relative}
.nb:hover{background:var(--raise);color:var(--ink)}
.nb.on{background:var(--acc-wash);color:var(--ink);font-weight:620}
.nb.on::before{content:"";position:absolute;left:-10px;top:50%;transform:translateY(-50%);
  width:3px;height:17px;border-radius:0 3px 3px 0;background:var(--acc)}
.nb .ic{width:17px;flex:none;text-align:center;font-size:14px;opacity:.85}
.nb.on .ic{opacity:1}
.nb .tag{margin-left:auto;font-size:9.5px;font-family:var(--mono);color:var(--muted);
  background:var(--raise);border-radius:20px;padding:1px 6px;font-weight:600}
.nb.on .tag{background:rgba(255,255,255,.09);color:var(--ink2)}
.nb.lock{opacity:.42;cursor:not-allowed}
.nb.lock:hover{background:none;color:var(--ink2)}

.railfoot{flex:none;padding:10px 14px 12px;border-top:1px solid var(--line);display:flex;gap:6px;align-items:center}
.iconbtn{width:29px;height:29px;border-radius:7px;display:grid;place-items:center;color:var(--muted);
  border:1px solid transparent;font-size:14px;transition:.12s}
.iconbtn:hover{background:var(--raise);color:var(--ink);border-color:var(--line)}
.micdot{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:10.5px;color:var(--muted);
  font-family:var(--mono);letter-spacing:.03em}
.micdot i{width:7px;height:7px;border-radius:50%;background:var(--faint);display:block;flex:none}
.micdot.live i{background:var(--ok);box-shadow:0 0 0 3px var(--ok-wash);animation:pulse 1.6s infinite}
.micdot.err i{background:var(--no)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}

/* ---------- main ---------- */
#main{overflow-y:auto;overflow-x:hidden;position:relative;scroll-behavior:smooth}
.page{max-width:1120px;margin:0 auto;padding:32px 34px 120px}
.page.wide{max-width:1360px}

.phead{margin:0 0 26px}
.kick{font-size:10.5px;font-weight:750;letter-spacing:.15em;text-transform:uppercase;color:var(--acc);margin:0 0 9px}
.phead h1{font-size:31px;letter-spacing:-.025em;margin:0 0 9px}
.phead .lede{font-size:16px;color:var(--ink2);max-width:74ch;margin:0}

.sect{margin:38px 0 0}
.sect:first-child{margin-top:0}
.shead{display:flex;align-items:baseline;gap:12px;margin:0 0 4px;flex-wrap:wrap}
.shead h2{font-size:19.5px;letter-spacing:-.018em}
.shead .n{font-size:11px;font-family:var(--mono);color:var(--muted);margin-left:auto}
.sdesc{font-size:14.5px;color:var(--ink2);margin:0 0 16px;max-width:78ch}

hr{border:0;border-top:1px solid var(--line);margin:34px 0}

/* ---------- generic bits ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:19px 21px;box-shadow:var(--shadow)}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
.gauto{grid-template-columns:repeat(auto-fill,minmax(255px,1fr))}
.gauto-s{grid-template-columns:repeat(auto-fill,minmax(184px,1fr))}
.gauto-l{grid-template-columns:repeat(auto-fill,minmax(330px,1fr))}
.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}

.btn{background:var(--acc);color:#12100a;border-radius:9px;padding:9.5px 17px;font-size:14px;font-weight:660;
  letter-spacing:-.005em;transition:.13s;border:1px solid transparent;white-space:nowrap}
.btn:hover{background:var(--acc-d)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btn.sec{background:var(--raise);color:var(--ink);border-color:var(--line)}
.btn.sec:hover{background:var(--hi);border-color:var(--line2)}
.btn.gh{background:transparent;color:var(--ink2);border-color:var(--line)}
.btn.gh:hover{color:var(--ink);background:var(--raise)}
.btn.dgr{background:var(--no-wash);color:var(--no);border-color:rgba(239,95,82,.3)}
.btn.dgr:hover{background:rgba(239,95,82,.2)}
.btn.sm{padding:6px 12px;font-size:12.5px;border-radius:7px}
.btn.big{padding:13px 26px;font-size:15.5px;border-radius:11px}
.btn.blk{width:100%;justify-content:center;text-align:center}

.chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:640;letter-spacing:.03em;
  border-radius:20px;padding:2.5px 9px;background:var(--raise);color:var(--ink2);border:1px solid var(--line);
  white-space:nowrap}
.chip.acc{background:var(--acc-wash);color:var(--acc);border-color:var(--acc-line)}
.chip.cy{background:var(--cy-wash);color:var(--cy);border-color:rgba(94,205,240,.28)}
.chip.ok{background:var(--ok-wash);color:var(--ok);border-color:rgba(78,201,126,.28)}
.chip.no{background:var(--no-wash);color:var(--no);border-color:rgba(239,95,82,.28)}
.chip.vi{background:var(--vi-wash);color:var(--vi);border-color:rgba(169,139,240,.3)}
.chip.pk{background:var(--pk-wash);color:var(--pk);border-color:rgba(240,127,180,.28)}
.chip.tiny{font-size:9.5px;padding:1.5px 7px;letter-spacing:.06em;text-transform:uppercase}

.lbl{font-size:10px;font-weight:750;letter-spacing:.13em;text-transform:uppercase;color:var(--muted)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.dim{color:var(--muted)}
.dim2{color:var(--ink2)}
.tiny{font-size:12.5px}
.tinier{font-size:11.5px}

input[type=text],input[type=number],input[type=search],input[type=password],
input[type=email],input[type=tel],select,textarea{
  background:var(--plane);border:1px solid var(--line);border-radius:8px;padding:8px 11px;font-size:14px;width:100%}
/* labelled field: the label always sits above its control */
.f .lbl{display:block;margin-bottom:5px}

/* ---------- the brain map ---------- */
.brainwrap{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:0;height:100dvh;min-height:0}
.braincanvas{position:relative;overflow:hidden;background:
  radial-gradient(ellipse at 50% 45%, rgba(232,176,75,.055), transparent 62%), var(--bg)}
.braincanvas canvas{display:block;touch-action:none;cursor:grab}
.brainhud{position:absolute;left:20px;top:18px;pointer-events:none}
.brainttl{font-size:19px;font-weight:700;letter-spacing:-.01em}
.braincnt{font-size:11.5px;color:var(--muted);margin-top:3px}
.braincnt b{color:var(--acc)}
.brainsearch{position:absolute;right:18px;top:16px;display:flex;align-items:center;gap:7px;
  background:var(--plane);border:1px solid var(--line);border-radius:8px;padding:5px 10px;min-width:220px}
.brainsearch .si{color:var(--muted);font-size:13px}
.brainsearch input{background:transparent!important;border:0!important;padding:0!important;width:100%;font-size:13px;outline:0}
.brainsearch input:focus{outline:0!important}
.brainsearch .qn{font-size:10.5px;color:var(--acc);white-space:nowrap;font-variant-numeric:tabular-nums}
.brainlegend{position:absolute;left:20px;bottom:56px;display:flex;flex-wrap:wrap;gap:5px 13px;max-width:62%;pointer-events:none}
.brainlegend span{font-size:10px;color:var(--muted);display:flex;align-items:center;gap:5px;letter-spacing:.02em}
.brainlegend i{width:7px;height:7px;border-radius:50%;display:block}
.brainlegend b{color:var(--ink2);font-variant-numeric:tabular-nums}
.brainctl{position:absolute;left:20px;bottom:16px;display:flex;gap:7px}
.braintip{position:absolute;display:none;pointer-events:none;background:var(--plane);
  border:1px solid var(--line);border-radius:7px;padding:6px 9px;max-width:250px;z-index:4;
  box-shadow:0 6px 22px rgba(0,0,0,.35)}
.braintip b{display:block;font-size:12.5px;line-height:1.3}
.braintip span{display:block;font-size:10.5px;color:var(--muted);margin-top:2px}

.brainpanel{border-left:1px solid var(--line);background:var(--panel);overflow-y:auto;padding:20px 20px 40px}
.bcrumb{display:flex;flex-wrap:wrap;align-items:center;gap:3px;margin-bottom:12px}
.bcrumb button{background:0;border:0;padding:1px 3px;font-size:11px;color:var(--muted);cursor:pointer;border-radius:4px}
.bcrumb button:hover{color:var(--ink);background:var(--hi)}
.bcrumb button.on{color:var(--acc)}
.bcrumb .sep{color:var(--line);font-size:10px}
.bkind{font-size:10px;font-weight:750;letter-spacing:.13em;text-transform:uppercase}
.btitle{font-size:23px;line-height:1.2;margin:5px 0 15px;letter-spacing:-.015em}
.bsect{margin-bottom:16px}
.bsect .l{display:block;font-size:9.5px;font-weight:750;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
.bsect p{font-size:13.5px;line-height:1.62;color:var(--ink2);margin:0}
.bsect.help{border-left:2px solid var(--acc);padding-left:12px}
.bsect.help .l{color:var(--acc)}
.bsect.help p{color:var(--ink)}
.bkids{display:flex;flex-direction:column;gap:6px}
.bkids button{text-align:left;background:var(--plane);border:1px solid var(--line);border-left-width:2px;
  border-radius:7px;padding:8px 10px;cursor:pointer;transition:background .12s,transform .12s}
.bkids button:hover{background:var(--hi);transform:translateX(2px)}
.bkids b{display:block;font-size:12.5px;line-height:1.35;margin-bottom:2px}
.bkids span{display:block;font-size:11px;line-height:1.45;color:var(--muted)}
.blink{background:0;border:0;color:var(--acc);cursor:pointer;font-size:13.5px;padding:0;text-decoration:underline}
@media (max-width:1100px){
  .brainwrap{grid-template-columns:1fr;grid-template-rows:minmax(340px,52vh) auto;height:auto}
  .brainpanel{border-left:0;border-top:1px solid var(--line);max-height:none}
  .brainlegend{display:none}
}
input:focus,select:focus,textarea:focus{outline:2px solid var(--acc);outline-offset:-1px;border-color:transparent}
textarea{resize:vertical;line-height:1.55;min-height:80px}
select{cursor:pointer;-webkit-appearance:none;appearance:none;padding-right:30px;
  background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 15px) 51%,calc(100% - 10px) 51%;background-size:5px 5px,5px 5px;background-repeat:no-repeat}
input[type=range]{-webkit-appearance:none;appearance:none;background:transparent;width:100%;height:18px;cursor:pointer;padding:0}
input[type=range]::-webkit-slider-runnable-track{height:4px;background:var(--hi);border-radius:2px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;border-radius:50%;
  background:var(--acc);margin-top:-5.5px;border:0;box-shadow:0 1px 4px rgba(0,0,0,.4)}
input[type=range]::-moz-range-track{height:4px;background:var(--hi);border-radius:2px}
input[type=range]::-moz-range-thumb{width:15px;height:15px;border-radius:50%;background:var(--acc);border:0}
label.ck{display:flex;gap:9px;align-items:flex-start;cursor:pointer;font-size:13.5px;color:var(--ink2)}
label.ck input{width:15px;height:15px;margin:3px 0 0;flex:none;accent-color:var(--acc);cursor:pointer}

/* segmented */
.seg{display:inline-flex;background:var(--plane);border:1px solid var(--line);border-radius:9px;padding:2.5px;gap:2px;flex-wrap:wrap}
.seg button{padding:5.5px 12px;border-radius:7px;font-size:12.5px;font-weight:600;color:var(--muted);transition:.12s;white-space:nowrap}
.seg button:hover{color:var(--ink)}
.seg button.on{background:var(--raise);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.25)}

/* stat tiles */
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--r2);padding:13px 15px}
.stat .k{font-size:9.5px;font-weight:750;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 5px}
.stat .v{font-size:24px;font-weight:700;letter-spacing:-.03em;font-family:var(--mono);line-height:1.05}
.stat .s{font-size:11.5px;color:var(--muted);margin:4px 0 0}
.stat.ok .v{color:var(--ok)} .stat.no .v{color:var(--no)} .stat.acc .v{color:var(--acc)} .stat.cy .v{color:var(--cy)}

/* meter */
.meter{height:6px;border-radius:4px;background:var(--hi);overflow:hidden;position:relative}
.meter i{display:block;height:100%;border-radius:4px;background:var(--acc);transition:width .35s cubic-bezier(.22,1,.36,1)}
.meter.ok i{background:var(--ok)} .meter.no i{background:var(--no)} .meter.cy i{background:var(--cy)} .meter.vi i{background:var(--vi)}

/* callouts */
.note{border-left:3px solid var(--line2);background:var(--plane);border-radius:0 var(--r2) var(--r2) 0;
  padding:12px 15px;margin:0 0 14px;font-size:14px;color:var(--ink2)}
.note b{color:var(--ink)}
.note.acc{border-left-color:var(--acc);background:var(--acc-wash)}
.note.no{border-left-color:var(--no);background:var(--no-wash)}
.note.ok{border-left-color:var(--ok);background:var(--ok-wash)}
.note.cy{border-left-color:var(--cy);background:var(--cy-wash)}
.note.vi{border-left-color:var(--vi);background:var(--vi-wash)}
.note .l{display:block;font-size:9.5px;font-weight:750;letter-spacing:.13em;text-transform:uppercase;margin:0 0 4px}
.note.acc .l{color:var(--acc)} .note.no .l{color:var(--no)} .note.ok .l{color:var(--ok)}
.note.cy .l{color:var(--cy)} .note.vi .l{color:var(--vi)}

/* prose */
.prose{max-width:76ch;font-size:15.5px;color:var(--ink2)}
.prose h3{font-size:18px;color:var(--ink);margin:30px 0 9px;letter-spacing:-.018em}
.prose h4{font-size:14.5px;color:var(--ink);margin:22px 0 6px;font-weight:660}
.prose h3:first-child,.prose h4:first-child{margin-top:0}
.prose p{margin:0 0 13px}
.prose ul,.prose ol{margin:0 0 14px;padding-left:20px}
.prose li{margin:0 0 6px}
.prose b,.prose strong{color:var(--ink);font-weight:640}
.prose em{color:var(--ink);font-style:italic}
.prose table{width:100%;border-collapse:collapse;margin:0 0 16px;font-size:13.5px}
.prose th{text-align:left;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);
  padding:0 12px 7px 0;border-bottom:1px solid var(--line);font-weight:750}
.prose td{padding:8px 12px 8px 0;border-bottom:1px solid var(--line);vertical-align:top}
.prose td:first-child{color:var(--ink);font-weight:600;white-space:nowrap}
.prose blockquote{margin:0 0 14px;padding:2px 0 2px 15px;border-left:2px solid var(--acc-line);color:var(--ink2);font-style:italic}

/* ---------- STAGE (drill runner) ---------- */
#stage{position:fixed;inset:0;background:var(--bg);z-index:200;display:none;flex-direction:column}
#stage.on{display:flex}
.stop{flex:none;display:flex;align-items:center;gap:14px;padding:14px 22px;border-bottom:1px solid var(--line);
  background:var(--plane)}
.stop .nm{font-size:12.5px;font-weight:680;letter-spacing:.03em}
.stop .pg{font-size:11.5px;color:var(--muted);font-family:var(--mono)}
.stprog{flex:1;height:4px;border-radius:2px;background:var(--hi);overflow:hidden;max-width:340px;margin:0 6px}
.stprog i{display:block;height:100%;background:var(--acc);border-radius:2px;transition:width .3s}
.stbody{flex:1;overflow-y:auto;display:flex;flex-direction:column}
.stinner{width:100%;max-width:1000px;margin:0 auto;padding:26px 26px 20px;flex:1;display:flex;flex-direction:column}
.stfoot{flex:none;border-top:1px solid var(--line);background:var(--plane);padding:13px 22px;
  display:flex;gap:12px;align-items:center}
.sthint{font-size:13px;color:var(--ink2);flex:1;min-width:0}
.sthint b{color:var(--acc)}

.cue{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 14px}
.cue .tone{font-size:11px;font-weight:750;letter-spacing:.13em;text-transform:uppercase;
  background:var(--acc-wash);color:var(--acc);border:1px solid var(--acc-line);border-radius:20px;padding:4px 12px}

.utter{font-size:30px;line-height:1.42;font-weight:520;letter-spacing:-.018em;margin:0 0 18px;max-width:24ch}
.utter.sm{font-size:23px;max-width:34ch}
.utter.xs{font-size:19px;max-width:46ch;line-height:1.5}
.utter .em{color:var(--acc);font-weight:750;position:relative}
.utter .em::after{content:"";position:absolute;left:0;right:0;bottom:-3px;height:2px;background:var(--acc);border-radius:2px;opacity:.5}
.utter .pz{display:inline-block;color:var(--cy);font-weight:400;opacity:.75;padding:0 2px;font-size:.78em;vertical-align:middle}
.utter .up{color:var(--cy)} .utter .dn{color:var(--vi)}
.utter .soft{opacity:.5}

/* live canvas */
.scope{position:relative;background:var(--plane);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.scope canvas{display:block;width:100%;height:100%}
.scope .ov{position:absolute;inset:0;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;padding:10px 13px}
.scope .ovtop{display:flex;justify-content:space-between;gap:12px;font-size:10px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--muted);font-weight:700}
.scope .big{font-family:var(--mono);font-size:34px;font-weight:700;letter-spacing:-.035em;line-height:1}
.scope .lvl{display:flex;gap:2.5px;align-items:flex-end;height:22px}
.scope .lvl i{width:3px;background:var(--acc);border-radius:1px;display:block;transition:height .06s linear;min-height:2px}

.readout{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:9px;margin:14px 0 0}
.ro{background:var(--panel);border:1px solid var(--line);border-radius:var(--r2);padding:10px 12px;position:relative;overflow:hidden}
.ro .k{font-size:9px;font-weight:750;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 4px}
.ro .v{font-family:var(--mono);font-size:20px;font-weight:700;letter-spacing:-.03em;line-height:1.05}
.ro .u{font-size:11px;color:var(--muted);font-weight:500;margin-left:2px}
.ro .t{font-size:10.5px;color:var(--faint);margin:3px 0 0;font-family:var(--mono)}
.ro.good{border-color:rgba(78,201,126,.35);background:var(--ok-wash)} .ro.good .v{color:var(--ok)}
.ro.bad{border-color:rgba(239,95,82,.35);background:var(--no-wash)} .ro.bad .v{color:var(--no)}
.ro.warn{border-color:rgba(232,176,75,.35);background:var(--acc-wash)} .ro.warn .v{color:var(--acc)}

/* score */
.scorewrap{display:flex;gap:22px;align-items:center;flex-wrap:wrap;margin:0 0 18px}
.ring{position:relative;width:112px;height:112px;flex:none}
.ring svg{transform:rotate(-90deg);display:block}
.ring .txt{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .txt b{font-family:var(--mono);font-size:31px;font-weight:700;letter-spacing:-.04em;line-height:1}
.ring .txt span{display:block;font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-top:3px;font-weight:700}

.verdict{flex:1;min-width:250px}
.verdict h3{font-size:22px;margin:0 0 6px;letter-spacing:-.02em}
.verdict p{font-size:14.5px;color:var(--ink2);margin:0}

.faults{display:grid;gap:8px;margin:16px 0 0}
.fault{display:flex;gap:11px;align-items:flex-start;background:var(--panel);border:1px solid var(--line);
  border-left:3px solid var(--no);border-radius:0 var(--r2) var(--r2) 0;padding:11px 14px;font-size:13.5px}
.fault.ok{border-left-color:var(--ok)}
.fault.warn{border-left-color:var(--acc)}
.fault .fi{font-size:15px;flex:none;line-height:1.35}
.fault b{display:block;font-size:13px;margin:0 0 2px;color:var(--ink)}
.fault span{color:var(--ink2)}

/* playback */
.playbar{display:flex;align-items:center;gap:11px;background:var(--panel);border:1px solid var(--line);
  border-radius:var(--r2);padding:9px 13px;margin:14px 0 0}
.playbtn{width:34px;height:34px;border-radius:50%;background:var(--acc);color:#12100a;display:grid;place-items:center;
  font-size:13px;flex:none;transition:.13s}
.playbtn:hover{background:var(--acc-d)}
.wavewrap{flex:1;height:36px;position:relative;min-width:0}
.wavewrap canvas{display:block;width:100%;height:100%}
.wavewrap .ph{position:absolute;top:0;bottom:0;width:1.5px;background:var(--acc);opacity:0;pointer-events:none}

/* module cards */
.mods{display:grid;grid-template-columns:repeat(auto-fill,minmax(292px,1fr));gap:13px}
.mod{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:17px 18px;
  text-align:left;transition:.15s;display:flex;flex-direction:column;position:relative;overflow:hidden}
.mod:hover{border-color:var(--line2);transform:translateY(-2px);box-shadow:var(--shadow-lg)}
.mod::before{content:"";position:absolute;inset:0 0 auto 0;height:2px;background:var(--mc,var(--acc));opacity:.75}
.mod .mh{display:flex;align-items:center;gap:9px;margin:0 0 8px}
.mod .mi{width:31px;height:31px;border-radius:8px;display:grid;place-items:center;font-size:15px;flex:none;
  background:var(--mcw,var(--acc-wash));color:var(--mc,var(--acc))}
.mod h3{font-size:15.5px;letter-spacing:-.015em;flex:1;min-width:0}
.mod .md{font-size:13px;color:var(--ink2);margin:0 0 12px;flex:1;line-height:1.5}
.mod .mf{display:flex;align-items:center;gap:7px;flex-wrap:wrap;font-size:10.5px;color:var(--muted);font-family:var(--mono)}
.mod.locked{opacity:.5}
.mod.locked:hover{transform:none;box-shadow:var(--shadow);border-color:var(--line)}
.lockbadge{position:absolute;top:12px;right:13px;font-size:10px;color:var(--muted);
  background:var(--raise);border:1px solid var(--line);border-radius:20px;padding:2px 8px;font-weight:650}

/* tone cards */
.tonecard{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:0;overflow:hidden;
  transition:.15s;text-align:left;display:block;width:100%}
.tonecard:hover{border-color:var(--line2);box-shadow:var(--shadow-lg)}
.tcbar{height:3px;background:var(--tc,var(--acc))}
.tcin{padding:14px 16px 15px}
.tch{display:flex;align-items:baseline;gap:8px;margin:0 0 5px}
.tch h3{font-size:15.5px;letter-spacing:-.015em}
.tch .fam{font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-left:auto}
.tcv{font-size:13px;color:var(--ink2);margin:0 0 11px;line-height:1.48}
.tcm{display:flex;gap:5px;flex-wrap:wrap;margin:0 0 10px}
.pill{font-size:10px;font-family:var(--mono);background:var(--raise);border:1px solid var(--line);
  border-radius:5px;padding:2px 6px;color:var(--ink2);letter-spacing:.01em}
.mastery{display:flex;align-items:center;gap:8px}
.mastery .meter{flex:1}
.mastery .pc{font-size:10.5px;font-family:var(--mono);color:var(--muted);min-width:30px;text-align:right}

/* twister rows */
.tw{display:flex;gap:13px;align-items:flex-start;padding:12px 15px;border:1px solid var(--line);
  border-radius:var(--r2);background:var(--panel);transition:.13s}
.tw:hover{border-color:var(--line2)}
.twdiff{display:flex;gap:2px;flex:none;padding-top:5px}
.twdiff i{width:4px;height:12px;border-radius:1px;background:var(--hi);display:block}
.twdiff i.f{background:var(--acc)}
.tw .txt{flex:1;min-width:0}
.tw .txt p{font-size:14.5px;margin:0 0 4px;line-height:1.45}
.tw .txt .meta{font-size:11.5px;color:var(--muted);display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.ipa{font-family:var(--mono);color:var(--cy);font-size:11px;background:var(--cy-wash);border-radius:4px;padding:1px 5px}

/* law cards */
.law{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;transition:.15s}
.law:hover{border-color:var(--line2)}
.lawh{display:flex;gap:13px;align-items:flex-start;padding:15px 17px;cursor:pointer;width:100%;text-align:left}
.lawn{font-family:var(--mono);font-size:11px;font-weight:700;color:var(--vi);background:var(--vi-wash);
  border:1px solid rgba(169,139,240,.28);border-radius:6px;padding:3px 7px;flex:none;margin-top:1px}
.lawh h3{font-size:15.5px;letter-spacing:-.015em;flex:1;min-width:0;line-height:1.35}
.lawh .cv{font-size:14px;color:var(--muted);flex:none;transition:transform .2s;margin-top:2px}
.law.open .lawh .cv{transform:rotate(90deg)}
.lawb{display:none;padding:0 17px 17px;border-top:1px solid var(--line);margin-top:-1px;padding-top:15px}
.law.open .lawb{display:block}

/* achievements */
.ach{display:flex;gap:11px;align-items:center;background:var(--panel);border:1px solid var(--line);
  border-radius:var(--r2);padding:12px 14px}
.ach.got{border-color:var(--acc-line);background:var(--acc-wash)}
.achi{width:33px;height:33px;border-radius:9px;background:var(--raise);display:grid;place-items:center;
  font-size:16px;flex:none;filter:grayscale(1) opacity(.45)}
.ach.got .achi{filter:none;background:rgba(232,176,75,.18)}
.ach b{display:block;font-size:13.5px;margin:0 0 1px}
.ach span{font-size:11.5px;color:var(--muted);display:block;line-height:1.4}

/* day plan */
.day{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:var(--r2);
  border:1px solid var(--line);background:var(--panel);transition:.13s}
.day.done{opacity:.55}
.day.today{border-color:var(--acc-line);background:var(--acc-wash);box-shadow:var(--shadow)}
.daynum{width:36px;flex:none;text-align:center}
.daynum b{display:block;font-family:var(--mono);font-size:17px;font-weight:700;letter-spacing:-.03em;line-height:1}
.daynum span{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}

/* modal */
#modal{position:fixed;inset:0;z-index:400;display:none;align-items:center;justify-content:center;padding:22px;
  background:rgba(0,0,0,.66);backdrop-filter:blur(5px)}
#modal.on{display:flex}
.mbox{background:var(--panel);border:1px solid var(--line2);border-radius:var(--r);max-width:640px;width:100%;
  max-height:86dvh;overflow-y:auto;box-shadow:var(--shadow-lg);padding:24px 26px}
.mbox h2{font-size:21px;margin:0 0 5px;letter-spacing:-.02em}
.mclose{position:sticky;top:0;float:right;margin:-6px -8px 0 0;width:28px;height:28px;border-radius:7px;
  display:grid;place-items:center;color:var(--muted);font-size:15px}
.mclose:hover{background:var(--raise);color:var(--ink)}

/* toast */
#toasts{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:500;display:flex;
  flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:var(--raise);border:1px solid var(--line2);border-radius:11px;padding:10px 17px;font-size:13.5px;
  box-shadow:var(--shadow-lg);display:flex;gap:9px;align-items:center;animation:tin .3s cubic-bezier(.22,1,.36,1);max-width:min(92vw,440px)}
.toast b{color:var(--acc)}
.toast.xp{border-color:var(--acc-line)}
@keyframes tin{from{opacity:0;transform:translateY(14px) scale(.96)}to{opacity:1;transform:none}}

/* pace bar */
.pacer{height:34px;border-radius:var(--r2);background:var(--plane);border:1px solid var(--line);
  position:relative;overflow:hidden;margin:0 0 14px}
.pacer .zone{position:absolute;top:0;bottom:0;background:var(--ok-wash);border-left:1px solid rgba(78,201,126,.35);
  border-right:1px solid rgba(78,201,126,.35)}
.pacer .nd{position:absolute;top:0;bottom:0;width:2px;background:var(--acc);transition:left .12s linear;border-radius:2px}
.pacer .tk{position:absolute;top:0;bottom:0;width:1px;background:var(--line)}
.pacer .lb{position:absolute;bottom:3px;font-size:9px;color:var(--muted);font-family:var(--mono);transform:translateX(-50%)}

/* teleprompter */
.tele{font-size:26px;line-height:1.66;font-weight:480;letter-spacing:-.012em;padding:20px 0}
.tele .ln{opacity:.28;transition:opacity .3s;margin:0 0 14px;position:relative;padding-left:16px}
.tele .ln.cur{opacity:1}
.tele .ln.past{opacity:.15}
.tele .ln.cur::before{content:"";position:absolute;left:0;top:.36em;width:4px;height:1.05em;background:var(--acc);border-radius:2px}
.tele .tn{display:inline-block;font-size:10px;letter-spacing:.11em;text-transform:uppercase;font-weight:750;
  vertical-align:middle;background:var(--raise);border:1px solid var(--line);border-radius:20px;
  padding:2px 8px;margin-right:9px;color:var(--ink2)}

/* contour tracer */
.tracer{position:relative;background:var(--plane);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.tracer canvas{display:block;width:100%}

/* misc */
.empty{text-align:center;padding:48px 20px;color:var(--muted)}
.empty .ei{font-size:34px;margin:0 0 10px;opacity:.5}
.srch{position:relative}
.srch input{padding-left:32px}
.srch .si{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:13px;pointer-events:none}

.kbd-hint{display:inline-flex;gap:4px;align-items:center;font-size:11px;color:var(--muted)}
.kbd-hint kbd{font-size:10px;padding:1px 5px}

.split{display:grid;grid-template-columns:1fr 300px;gap:22px;align-items:start}
@media (max-width:1080px){.split{grid-template-columns:1fr}}

/* mobile */
#railToggle{display:none;position:fixed;left:12px;top:12px;z-index:60;width:38px;height:38px;border-radius:10px;
  background:var(--panel);border:1px solid var(--line2);color:var(--ink);place-items:center;font-size:16px;box-shadow:var(--shadow)}
#scrim{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:19}
#scrim.on{display:block}

@media (max-width:860px){
  #shell{grid-template-columns:1fr}
  #rail{position:fixed;left:0;top:0;bottom:0;width:250px;transform:translateX(-100%);transition:transform .24s cubic-bezier(.22,1,.36,1);box-shadow:var(--shadow-lg)}
  #rail.open{transform:none}
  #railToggle{display:grid}
  .page{padding:60px 17px 110px}
  .phead h1{font-size:25px}
  .utter{font-size:23px}
  .utter.sm{font-size:19px}
  .g2,.g3,.g4{grid-template-columns:1fr}
  .stinner{padding:18px 16px}
  .stop{padding:11px 14px}
  .stfoot{padding:11px 14px;flex-wrap:wrap}
  .sthint{width:100%;order:2}
  .tele{font-size:20px}
  .mods{grid-template-columns:1fr}
}
@media (max-width:520px){
  .readout{grid-template-columns:repeat(2,1fr)}
  .scorewrap{gap:14px}
  .ring{width:88px;height:88px}
}

@media print{
  #rail,#railToggle,#stage,.btn,.seg{display:none!important}
  body{overflow:visible;background:#fff;color:#000}
  #shell{display:block;height:auto}
  #main{overflow:visible}
  .card,.tonecard,.law{break-inside:avoid;box-shadow:none}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>

<button id="railToggle" aria-label="Menu">☰</button>
<div id="scrim"></div>

<div id="shell">
  <aside id="rail">
    <div class="brand">
      <div class="brandmark">
        <svg width="17" height="17" viewBox="0 0 32 32" aria-hidden="true">
          <g fill="currentColor" style="color:var(--acc)">
            <rect x="2" y="13" width="3" height="6" rx="1.5"/>
            <rect x="8" y="8" width="3" height="16" rx="1.5"/>
            <rect x="14.5" y="3" width="3" height="26" rx="1.5"/>
            <rect x="21" y="9.5" width="3" height="13" rx="1.5"/>
            <rect x="27" y="14" width="3" height="4" rx="1.5"/>
          </g>
        </svg>
      </div>
      <div class="brandtxt"><b>Tonality Gym</b><span>Voice · Tone · Power</span></div>
    </div>

    <div class="hud" id="hud" role="button" tabindex="0"></div>

    <nav id="nav"></nav>

    <div class="railfoot">
      <button class="iconbtn" id="themeBtn" title="Toggle theme">◐</button>
      <button class="iconbtn" id="fbBtn" title="Send feedback">✎</button>
      <button class="iconbtn" id="settingsBtn" title="Settings">⚙</button>
      <button class="iconbtn" id="helpBtn" title="Keyboard shortcuts">?</button>
      <div class="micdot" id="micdot"><i></i><span>mic</span></div>
    </div>
  </aside>

  <main id="main"><div id="view"></div></main>
</div>

<div id="stage">
  <div class="stop">
    <span class="nm" id="stName"></span>
    <span class="pg mono" id="stPos"></span>
    <div class="stprog"><i id="stProg" style="width:0%"></i></div>
    <span class="pg mono" id="stClock">0:00</span>
    <div class="spacer"></div>
    <button class="btn gh sm" id="stRestart">Restart</button>
    <button class="btn sec sm" id="stExit">Exit <kbd>esc</kbd></button>
  </div>
  <div class="stbody"><div class="stinner" id="stBody"></div></div>
  <div class="stfoot">
    <div class="sthint" id="stHint"></div>
    <button class="btn gh sm" id="stPrev">← Back</button>
    <button class="btn" id="stNext">Next →</button>
  </div>
</div>

<div id="modal"><div class="mbox" id="mbox"></div></div>
<div id="toasts"></div>

<script>
/* ============================================================
   TONE TAXONOMY
   Every tone carries a *measurable* acoustic target so the mic
   engine can grade it, plus a mental cue so the human can hit it.

   target fields (all speaker-normalised):
     wpm   [lo,hi]  words per minute
     span  [lo,hi]  80th-percentile F0 span in SEMITONES
     term  [lo,hi]  terminal pitch move in semitones (negative = fall)
     dyn   [lo,hi]  phrase-level RMS dynamic range in dB
     pause [lo,hi]  target pause-fraction as % of speaking time
   ============================================================ */
'use strict';

var FAMILIES = {
  core:      {name:'The Seven Core',   c:'var(--acc)', wash:'var(--acc-wash)', blurb:'The foundation set. Seven emotional intents that cover the entire arc of a serious conversation — open, uncover, confront, doubt, dream, drop, decide. Learn these seven and you can run a whole call. Everything else in this app is refinement.'},
  authority: {name:'Authority & Weight',c:'var(--vi)',  wash:'var(--vi-wash)',  blurb:'Tones that make a room stop moving. All of them share one mechanic — low mean pitch, wide range, hard falling terminals. The single most misunderstood family, because most people flatten their voice to sound serious and end up sounding dead.'},
  warmth:    {name:'Warmth & Repair',  c:'var(--ok)',  wash:'var(--ok-wash)',  blurb:'Tones that lower a listener\'s guard. Breathy phonation, reduced volume, slowed rate, gentle falls. These are the hardest tones to fake and the easiest to overdo into condescension.'},
  pressure:  {name:'Pressure & Edge',  c:'var(--no)',  wash:'var(--no-wash)',  blurb:'Tones that create discomfort on purpose. Every one of them is only safe after trust exists. Deployed cold they detonate the conversation — which is exactly why they need to be drilled rather than improvised.'},
  curiosity: {name:'Curiosity & Doubt',c:'var(--cy)',  wash:'var(--cy-wash)',  blurb:'Tones that make the other person do the talking. The family with the most counter-intuitive mechanics — curiosity lives in the *middle* of a sentence, not at the end, and genuine doubt uses an unresolved contour most speakers never learn to produce on command.'},
  straight:  {name:'Straight Line',    c:'var(--acc)', wash:'var(--acc-wash)', blurb:'The Belfort tonal system, reconstructed as measurable patterns. Built for monologue — these are tones you apply to *your* talking. High-energy, high-variation, terminal-manipulating. Powerful, and easy to overdo into a caricature.'},
  nepq:      {name:'The Quiet Model',  c:'var(--cy)',  wash:'var(--cy-wash)',  blurb:'The Miner / NEPQ tonal system. Built for questioning — these are tones you apply to *their* talking. Low-energy, detached, unattached to outcome. The opposite philosophy to Straight Line, and both work. Learn both, then choose.'},
  colour:    {name:'The Colour Wheel', c:'var(--pk)',  wash:'var(--pk-wash)',  blurb:'Pure emotional range, domain-free. This is the acting gym. Being able to produce thirty distinct emotional colours on command is what separates someone with "a good voice" from someone with an instrument.'},
  broadcast: {name:'Broadcast & Stage',c:'var(--vi)',  wash:'var(--vi-wash)',  blurb:'Tones built for one-to-many. Different physics: more projection, wider dynamic range, longer pauses, and a much higher tolerance for what would sound theatrical across a table.'},
  defect:    {name:'The Defect Lab',   c:'var(--no)',  wash:'var(--no-wash)',  blurb:'Deliberately producing the mistakes. You cannot reliably avoid a habit you cannot reproduce on purpose — this family makes uptalk, monotone, trailing-off and fry into voluntary skills so they stop being involuntary ones.'}
};

var TONES = [
/* ---------------- CORE SEVEN ---------------- */
{id:'neutral', fam:'core', name:'Neutral / Curious', tier:1,
 conveys:'I am trying to understand you, and I have no stake in what the answer is.',
 useWhen:'Opening the conversation. Gathering facts. Any moment where a hint of agenda would make them start managing you instead of telling you the truth.',
 cue:'You are a doctor taking a history. You have no opinion yet because you do not have enough information to have one.',
 recipe:{pitch:'Mid, resting. Small lift on the question word or the key noun, then settle back down.',pace:'Unhurried. Slightly slower than your social speaking rate.',volume:'Conversational, a touch under.',terminal:'Flat or gently falling — the curiosity lives in the middle of the sentence, not the end.',resonance:'Modal, relaxed. No push.'},
 target:{wpm:[125,155],span:[4,8],term:[-4,-0.5],dyn:[5,11],pause:[14,24]},
 overdone:'Bored. Or worse, an interrogation — the exact same words at a faster rate become a police interview.',
 antidote:'Slow the back half of every question. If the last three words are not slower than the first three, you are interviewing, not asking.',
 lines:['What made you actually reach out about this?','Walk me through how it works right now.','So what does a normal week look like for you?','And how long have you been doing it that way?','Tell me about the setup you\'ve got at the moment.','What were you doing before this?','Who else is involved in that decision?','What does the process look like end to end?','How did you land on that approach?','What happens after that step?']},

{id:'concern', fam:'core', name:'Slight Concern', tier:1,
 conveys:'That sounds heavier than you are admitting.',
 useWhen:'The moment they reveal something that costs them. Immediately after a disclosure, never before one.',
 cue:'Lean in physically. The lean does the work — your larynx drops, your volume falls, and the tone arrives without you acting it.',
 recipe:{pitch:'Lowered, narrowed. Slight downward drift across the phrase.',pace:'Notably slowed. Insert a pause mid-sentence, not just at the end.',volume:'Softened. Two or three dB under your baseline.',terminal:'Falling, gently. Never a hard stop — that reads as judgement.',resonance:'Breathy. Let a little air through the fold closure.'},
 target:{wpm:[100,135],span:[3,7],term:[-6,-2],dyn:[4,10],pause:[20,32]},
 overdone:'Funeral director. Or pity, which is the fastest way to make someone defend a situation they were about to admit was bad.',
 antidote:'Concern is *for* them, not *about* them. Aim it at the situation, not at the person.',
 lines:['And how long has that been going on?','So you\'ve been carrying that for a while now.','How\'s that actually affecting you day to day?','That sounds like it takes something out of you.','And nobody\'s been able to help with it?','What does that do to everything else?','How are you holding up with all that?','That\'s a long time to be stuck on the same thing.','And you\'ve been dealing with that on your own?','What\'s the hardest part of it?']},

{id:'challenge', fam:'core', name:'Accountability / Challenge', tier:1,
 conveys:'Let us stop hiding behind the surface answer.',
 useWhen:'Ownership. Patterns. The moment a comfortable story needs to be interrupted. Only after trust exists — this tone deployed cold ends conversations.',
 cue:'The tone of a friend who is tired of watching you do this to yourself. Not angry. Tired, and honest.',
 recipe:{pitch:'Low and narrow. Intensity comes from articulation, not from raising your voice.',pace:'Slow and deliberate. Space between the words.',volume:'Firm, steady, not raised. If you get louder you have lost it.',terminal:'Hard fall. Full stop. No trailing, no fry, no drift upward.',resonance:'Chest. Supported from the belly, not pushed from the throat.'},
 target:{wpm:[95,130],span:[4,9],term:[-8,-3],dyn:[6,13],pause:[22,34]},
 overdone:'Aggressive. Accusatory. The line between challenge and attack is volume — cross it and you have made yourself the problem.',
 antidote:'Never raise the volume. Add weight instead: slow down, drop the pitch, and put a full second of silence after it.',
 lines:['So what\'s really been stopping you?','Who\'s responsible for that not changing?','Why hasn\'t anything changed up until now?','What have you actually done about it?','And whose decision was that?','You said that eighteen months ago. What happened?','So what\'s different about today?','Is that the reason, or is that the excuse?','What would have to be true for you to move on this?','How much longer are you giving it?']},

{id:'skeptic', fam:'core', name:'Skeptical Disbelief', tier:1,
 conveys:'I am not fully buying that yet. Help me understand why I should.',
 useWhen:'Vague optimism. Untested certainty. Any answer that arrived too fast and too tidy.',
 cue:'The face you make when someone tells you they are definitely going to the gym at five tomorrow.',
 recipe:{pitch:'Rise, fall, then a small unresolved rise. This is the classic English doubt contour and most people cannot produce it on command.',pace:'Slow. The hesitation is the message.',volume:'Soft. Skepticism at volume is contempt.',terminal:'Unresolved — ends slightly up, hanging.',resonance:'Modal with a touch of breath.'},
 target:{wpm:[95,130],span:[5,11],term:[0.5,4],dyn:[4,10],pause:[20,32]},
 overdone:'You have just called them a liar. Adversarial, and the conversation hardens permanently.',
 antidote:'Keep the volume down and the eyebrows up. Skepticism delivered quietly reads as curiosity; delivered firmly it reads as an accusation.',
 lines:['And what makes you think this time will be different?','Why now, and not six months from now?','Why this over everything else you could do?','Really — you\'d actually go through with it?','What makes you so sure?','Hmm. And that\'s worked before?','You think so?','So what changed?','And you believe that\'ll hold?','How confident are you in that, honestly?']},

{id:'vision', fam:'core', name:'Vision / Future Pace', tier:1,
 conveys:'Step into that version of your life for a second.',
 useWhen:'Desired outcomes. Identity shifts. Anywhere you need them to feel a future rather than evaluate a claim.',
 cue:'You are opening a door and standing aside. You are not dragging them through it.',
 recipe:{pitch:'Slightly raised baseline, wider melodic movement. Room in the voice.',pace:'Slow and spacious. Long pauses — this is the one tone where a two-second silence is correct.',volume:'Soft to conversational. Never pushed.',terminal:'Gentle fall or a suspended level tone — leave it open so they can keep imagining.',resonance:'Warm, forward, relaxed.'},
 target:{wpm:[95,130],span:[6,12],term:[-4,1],dyn:[5,12],pause:[24,38]},
 overdone:'Hypnotist voice. The moment it sounds like a guided meditation they snap out of it and remember they are being sold to.',
 antidote:'Ask, then stop. The silence is where the picture actually forms. If you keep talking you are describing your vision, not building theirs.',
 lines:['Let\'s say twelve months from now it worked. What\'s different?','How would that actually change things day to day?','What\'s the first thing you\'d do?','Who would notice first?','And what does that do for the people around you?','Picture the version of this where it went right. What does that look like?','What would you stop having to worry about?','Where would you be sitting a year from now?','What\'s the thing you\'d finally be able to say yes to?','And how does that feel, when you picture it?']},

{id:'consequence', fam:'core', name:'Consequence / Emotional Drop', tier:1,
 conveys:'Let us be honest about where this leads if nothing changes.',
 useWhen:'Cost of delay. Settling. The future they are currently choosing by default.',
 cue:'Drop everything — pitch, volume, pace. Say it like it costs you something to say. Then stop and let the silence finish the sentence.',
 recipe:{pitch:'Lowest of any tone in the system. Bottom of your comfortable range.',pace:'Slowest. Deliberate. Almost heavy.',volume:'Quietest. Just above intimate.',terminal:'Deep fall into silence.',resonance:'Chest, but relaxed — not pushed. Pushing here sounds like drama.'},
 target:{wpm:[80,115],span:[3,8],term:[-9,-4],dyn:[5,12],pause:[26,42]},
 overdone:'Melodrama. Or manipulation — if the drop is bigger than the actual stakes, they hear technique.',
 antidote:'Underplay it. The content is heavy enough. The moment you add weight on top of heavy content it becomes theatre.',
 lines:['And if nothing changes?','What does next year look like if this keeps going?','Is that honestly something you\'re willing to settle for?','So where does that leave you in three years?','And who pays for that?','What happens if you\'re still here this time next year?','That\'s the version where nothing changes. Is that alright with you?','And you\'d be okay having this exact conversation again?','What\'s the cost of waiting another twelve months?','So that\'s the default. Is that the one you want?']},

{id:'certainty', fam:'core', name:'Certainty / Transition', tier:1,
 conveys:'We both already know where this is going.',
 useWhen:'Summarising the truth. Closing discovery. Moving into the pitch. Any moment where hesitation would undo everything you just built.',
 cue:'Calm, not hyped. You are stating a fact about a decision that has effectively already been made.',
 recipe:{pitch:'Low mean, but wide range. This is the counter-intuitive one — confident speech is *low and varied*, not flat.',pace:'Measured. Slightly quicker than concern, much slower than enthusiasm.',volume:'Full and supported. Clean articulation.',terminal:'Clean fall to baseline, held to the end. No fade, no fry.',resonance:'Chest, supported, present.'},
 target:{wpm:[130,165],span:[6,11],term:[-7,-3],dyn:[7,14],pause:[15,26]},
 overdone:'Pitchy. Or smug. Certainty with a raised volume becomes a sales close, and they hear the gear change.',
 antidote:'Lower the mean pitch and widen the range at the same time. Most people do the opposite — they flatten to sound serious, which just sounds dead.',
 lines:['So it sounds like something has to change.','Sounds like you already know what needs to happen.','Let\'s look at what that would actually take.','Alright. Then here\'s where I think we go.','That\'s the whole thing, really.','So we agree on the problem. Let\'s talk about the fix.','Right. So that\'s settled.','Then the only question left is how.','Good. Let\'s get into it.','That tells me everything I need to know.']},

/* ---------------- AUTHORITY & WEIGHT ---------------- */
{id:'absolute', fam:'authority', name:'Absolute Certainty', tier:2,
 conveys:'This is not an opinion and I will not be negotiating it.',
 useWhen:'The single load-bearing claim of your argument. Used once, it is devastating. Used constantly, it is noise.',
 cue:'Anchor it physically — a palm to the table, a fist into the other hand. The body produces the tone more reliably than intention does.',
 recipe:{pitch:'Dropped to the floor of your comfortable range. Narrow variation within the phrase.',pace:'Clipped and crisp. Every consonant released. No fillers, no hedges.',volume:'Firm, supported from the solar plexus. Pressure held, not exploded.',terminal:'Hard stop. A four to seven semitone drop, landing and staying.',resonance:'Full chest.'},
 target:{wpm:[115,150],span:[5,10],term:[-9,-4],dyn:[7,15],pause:[16,28]},
 overdone:'Arrogance. Reads as pressure, and pressure creates resistance in exactly the moment you need agreement.',
 antidote:'One per conversation. Follow it immediately with Utter Sincerity — the softening is what stops certainty tipping into dominance.',
 lines:['This works. I\'ve watched it work a hundred times.','That is not going to be a problem.','I know exactly what I\'m looking at here.','You will not find that anywhere else.','That\'s the part I\'m certain about.','I\'ve never seen it fail for someone who actually did the work.','This is the right call.','I can tell you exactly what happens next.','That number is not negotiable.','I would stake my reputation on that.']},

{id:'sincerity', fam:'authority', name:'Utter Sincerity', tier:2,
 conveys:'I would say this to you even if it cost me.',
 useWhen:'Directly after certainty, to soften it. Personal assurances. Admitting a limitation. Any moment where they doubt your motive rather than your competence.',
 cue:'Say it as though the sale is already lost and you are telling them anyway.',
 recipe:{pitch:'Lowered, smooth, minimal wobble. Velvet rather than steel.',pace:'Slow, even, entirely unhurried.',volume:'Softened. Noticeably under the line before it.',terminal:'Gentle fall. Not the hard stop of certainty — a landing, not a slam.',resonance:'Warm chest, relaxed throat.'},
 target:{wpm:[100,135],span:[4,9],term:[-6,-2],dyn:[4,10],pause:[20,32]},
 overdone:'Sanctimonious. Or sedated — over-slowed sincerity sounds rehearsed, which is the exact opposite of sincere.',
 antidote:'Sincerity is a *drop* in energy from whatever came before. If the line before it was already soft, sincerity has nowhere to land.',
 lines:['I\'m going to be straight with you about this.','Honestly, I don\'t think this is right for you.','I\'d rather tell you that now than take your money.','That part is genuinely difficult and I won\'t pretend otherwise.','I care how this goes for you.','If I were in your position I\'d be asking the same thing.','I don\'t have a good answer for that one.','Look — I could sell you on this, but I don\'t think I should.','That\'s the truth of it.','I want this to work for you, not just work out for me.']},

{id:'command', fam:'authority', name:'Command', tier:3,
 conveys:'Do this. Now. Without discussion.',
 useWhen:'Emergencies. Instructions that must be executed rather than debated. Extremely rare in persuasion, essential in leadership.',
 cue:'Short. Complete. No conditional language, no hedges, no rising anything.',
 recipe:{pitch:'Low onset, steep fall. The whole phrase in the bottom third of your range.',pace:'Fast onset, immediate stop. Compressed.',volume:'Elevated but not shouted. Projection, not strain.',terminal:'Steepest fall in the entire system.',resonance:'Chest, forward, hard consonants.'},
 target:{wpm:[130,180],span:[5,12],term:[-11,-5],dyn:[8,17],pause:[10,20]},
 overdone:'Barking. Instant resentment in anyone who is not already in a hierarchy that licenses it.',
 antidote:'Reserve it. A command tone that appears once in an hour is obeyed. One that appears every four minutes is ignored.',
 lines:['Stop. Look at me.','Send it now.','Everybody out.','Put it down.','Not today.','Get me the number.','We\'re leaving.','No.','Sit down and listen.','Do it exactly the way I showed you.']},

{id:'gravity', fam:'authority', name:'Gravity', tier:3,
 conveys:'What I am about to say matters more than everything I have said so far.',
 useWhen:'Delivering hard news. The turn in a keynote. The one sentence you want them to remember in a week.',
 cue:'Stop completely for a full second before you start. The silence is half of the tone.',
 recipe:{pitch:'Low, deliberate, wide movement across a short phrase.',pace:'Very slow. Words separated by real space.',volume:'Moderate, supported, unhurried.',terminal:'Deep fall into another full silence.',resonance:'Deep chest, open throat.'},
 target:{wpm:[75,110],span:[5,11],term:[-9,-4],dyn:[7,15],pause:[30,48]},
 overdone:'Pompous. Portentous. Sounds like a film trailer, which makes the content feel manufactured.',
 antidote:'Gravity is created by the pause before, not by the voice during. Extend the silence and underplay the delivery.',
 lines:['There\'s something you need to hear.','This is the part that changes everything.','I need you to understand what we\'re actually deciding here.','We got this wrong.','One thing. If you remember nothing else from today, remember this.','It didn\'t work.','This is not a small decision.','I want to be very clear about what happens next.','We are not going to get another chance at this.','Here is what is actually at stake.']},

{id:'unbothered', fam:'authority', name:'Unbothered', tier:2,
 conveys:'This does not move me, and I do not need anything from you.',
 useWhen:'Under attack. Handling an aggressive objection. Any moment where reacting would hand over the frame.',
 cue:'The energy of someone reading a menu. Whatever they just said is roughly as urgent as the specials.',
 recipe:{pitch:'Mid-low, narrow, flat.',pace:'Slow, even, no acceleration under pressure.',volume:'Exactly the same as your previous line. The lack of change is the message.',terminal:'Flat or gently down.',resonance:'Relaxed modal. No tension anywhere.'},
 target:{wpm:[105,145],span:[3,7],term:[-5,-1],dyn:[3,9],pause:[16,28]},
 overdone:'Dismissive. Contemptuous. Reads as "I do not care about you" rather than "I do not care about that".',
 antidote:'Keep warmth in the face. Unbothered with a friendly face is composure; unbothered with a flat face is contempt.',
 lines:['Sure. That happens.','Okay.','That\'s fine.','I hear you.','Right, that\'s one way to look at it.','Fair enough.','Doesn\'t change my answer.','I understand. And?','Alright.','That\'s not really the point though, is it.']},

{id:'measured', fam:'authority', name:'Measured Correction', tier:3,
 conveys:'That is not right, and I am going to fix it without embarrassing you.',
 useWhen:'Correcting a factual error, a bad assumption, or a misquote of your own position — without making it a confrontation.',
 cue:'You are handing back something they dropped. Same energy.',
 recipe:{pitch:'Level through the correction, small fall at the end.',pace:'Even. Do not speed up — speeding up sounds defensive.',volume:'Steady, unchanged from your previous line.',terminal:'Gentle fall, no emphasis spike.',resonance:'Modal, unstrained.'},
 target:{wpm:[115,150],span:[4,8],term:[-5,-2],dyn:[4,10],pause:[16,28]},
 overdone:'Condescending. The moment you add emphasis to the corrected word you have made it a lesson.',
 antidote:'Deaccent the correction. Say the right version at *lower* prominence than the wrong version — it lands as a clarification instead of a rebuke.',
 lines:['It\'s actually the other way round.','Close — it\'s twelve, not twenty.','That was the old version. The current one works differently.','I think we\'re talking about two different things.','Not quite. Let me put it another way.','That\'s a reasonable read, but it\'s not what happened.','I said something slightly different.','Let me correct one thing there.','That number\'s from last year.','It\'s a common assumption. Here\'s the actual mechanism.']},

/* ---------------- WARMTH & REPAIR ---------------- */
{id:'warm', fam:'warmth', name:'Genuine Warmth', tier:1,
 conveys:'I am glad this is you.',
 useWhen:'Greetings. Reconnections. Any opening where the first four seconds decide whether they relax or brace.',
 cue:'Smile before you speak, not while you speak. The smile changes your vocal tract shape and it is audible on the phone.',
 recipe:{pitch:'Raised baseline, wide melodic movement.',pace:'Brisk but unhurried.',volume:'Slightly elevated, open.',terminal:'Often rising — warmth is one of the few places a lift is correct.',resonance:'Forward, bright, open throat.'},
 target:{wpm:[135,175],span:[7,13],term:[-2,4],dyn:[6,13],pause:[12,22]},
 overdone:'Chirpy. Performative. The receptionist voice — instantly recognisable as a script.',
 antidote:'Warmth is in the *range*, not the pitch. Raising your whole register sounds anxious; widening your movement sounds delighted.',
 lines:['Hey — good to hear from you.','There you are.','I was hoping you\'d call.','How are you, really?','Ah, that\'s great news.','Good to see you again.','I\'ve been looking forward to this one.','Right, tell me everything.','Well look at that.','Glad you made it.']},

{id:'reassure', fam:'warmth', name:'Reassurance', tier:1,
 conveys:'This is survivable, and you are not the first.',
 useWhen:'Right after someone admits a fear, a failure, or an embarrassment. The beat where they are deciding whether to keep being honest.',
 cue:'Normalise before you solve. The fix comes second; the "that is normal" comes first.',
 recipe:{pitch:'Mid-low, smooth, gently descending.',pace:'Slowed, steady.',volume:'Soft to conversational.',terminal:'Gentle, definite fall. Certainty carried in a soft package.',resonance:'Warm chest, breathy edge.'},
 target:{wpm:[105,140],span:[4,9],term:[-6,-2],dyn:[4,10],pause:[18,30]},
 overdone:'Patronising. "There there." Instantly makes them regret telling you.',
 antidote:'Reassure with a fact, not with a feeling. "That happens to about half of them" beats "don\'t worry" every time.',
 lines:['That happens to nearly everyone at this stage.','You\'re not behind. That\'s just what month two looks like.','I\'ve seen this exact thing a dozen times.','Nothing you\'ve said is unusual.','That\'s a normal problem with a known fix.','Okay — that\'s completely fine.','You\'re further along than you think.','This is fixable.','That doesn\'t worry me at all.','Everyone hits that wall. It\'s not a sign of anything.']},

{id:'gratitude', fam:'warmth', name:'Real Gratitude', tier:2,
 conveys:'That cost you something and I noticed.',
 useWhen:'After a difficult disclosure, a favour, a referral, or a piece of hard feedback.',
 cue:'Name the specific thing. Generic thanks sounds like punctuation; specific thanks sounds like attention.',
 recipe:{pitch:'Mid, warm, a small rise-fall on the key word.',pace:'Slowed slightly. Do not rush past it.',volume:'Soft, sincere.',terminal:'Clean gentle fall.',resonance:'Warm, forward.'},
 target:{wpm:[105,145],span:[5,10],term:[-6,-2],dyn:[5,11],pause:[16,28]},
 overdone:'Gushing. Thanks delivered at volume becomes about you, not them.',
 antidote:'One sentence. Say what it cost them and stop.',
 lines:['Thank you for telling me that. I know it wasn\'t easy.','That was a real favour and I won\'t forget it.','I appreciate you being straight with me.','That took something to say.','You didn\'t have to do that.','That\'s genuinely helpful, thank you.','I know what that cost you.','Thanks for trusting me with it.','That\'s the most useful thing anyone\'s told me this week.','I owe you one.']},

{id:'apology', fam:'warmth', name:'Clean Apology', tier:2,
 conveys:'I was wrong. No conditions attached.',
 useWhen:'You got it wrong. The rarest tone in business because almost nobody produces it without contaminating it.',
 cue:'No "but". No "if". No explanation until they ask for one. The apology ends where the excuse would start.',
 recipe:{pitch:'Low, level, unadorned.',pace:'Slow, plain, no performance.',volume:'Normal, unhidden. Do not go quiet — quiet apologies read as evasive.',terminal:'Definite fall, full stop.',resonance:'Modal, unpushed.'},
 target:{wpm:[100,140],span:[3,8],term:[-7,-3],dyn:[4,10],pause:[18,30]},
 overdone:'Grovelling. Over-apology transfers your discomfort onto them and makes them manage your feelings.',
 antidote:'One apology, one sentence of what you will do differently, then move. Repetition undoes it.',
 lines:['That was my mistake.','I got that wrong and it cost you time.','I should have told you sooner.','You were right and I wasn\'t listening.','I dropped this. It won\'t happen again.','That\'s on me.','I owe you an apology for how that was handled.','I misjudged it.','No excuse. Here\'s what I\'m doing about it.','I\'m sorry. Genuinely.']},

{id:'nurture', fam:'warmth', name:'Coaching Softness', tier:2,
 conveys:'You can do this, and I am not going anywhere while you learn.',
 useWhen:'Teaching. Onboarding. Any moment where someone is at the edge of their competence and about to quit.',
 cue:'The tone of someone teaching a kid to ride a bike who is not in a hurry.',
 recipe:{pitch:'Mid, gently varied, no spikes.',pace:'Slow, patient, room after each instruction.',volume:'Even, soft, close.',terminal:'Gentle falls with the occasional soft rise on a check-in.',resonance:'Warm, easy.'},
 target:{wpm:[100,140],span:[5,10],term:[-5,0],dyn:[4,10],pause:[22,34]},
 overdone:'Kindergarten teacher. Adults hear it instantly and feel diminished.',
 antidote:'Keep the vocabulary adult and the pace slow. Slowness reads as patience; simplified language reads as condescension.',
 lines:['Take your time with this bit.','Try it once and we\'ll look at what happens.','That\'s exactly the right question.','Nearly. Look at the second line again.','Good — now do the same thing with the next one.','You don\'t have to get this today.','Say it back to me in your own words.','Where did you get stuck?','That\'s the hard part. Everyone slows down there.','You\'ve got the shape of it. Now it\'s just reps.']},

/* ---------------- PRESSURE & EDGE ---------------- */
{id:'confront', fam:'pressure', name:'Direct Confrontation', tier:4,
 conveys:'I am naming the thing nobody in this conversation has named.',
 useWhen:'The unspoken issue is now costing more than the discomfort of raising it. Requires a licence you asked for earlier.',
 cue:'Ask permission first, then be completely direct. The permission is what makes the directness land as honesty rather than attack.',
 recipe:{pitch:'Low, level, unwavering.',pace:'Slow. No rush, no retreat.',volume:'Steady. Absolutely no increase.',terminal:'Flat fall, then silence.',resonance:'Grounded chest.'},
 target:{wpm:[95,130],span:[3,8],term:[-8,-3],dyn:[5,12],pause:[24,38]},
 overdone:'Assault. Once it feels like an attack, everything you say afterwards is evidence for the prosecution.',
 antidote:'Confront the behaviour, never the character. "This is the third time" is confrontation. "You are unreliable" is an insult.',
 lines:['Can I be completely honest with you about something?','This is the third time we\'ve had this conversation.','I don\'t think you actually want this.','You keep saying yes and then nothing happens.','Something\'s off and I\'d rather name it.','I think you\'re avoiding the real question.','We both know that\'s not the reason.','You\'re asking me to pretend that\'s fine. I\'m not going to.','What\'s actually going on here?','I\'m going to say the uncomfortable thing.']},

{id:'urgent', fam:'pressure', name:'Controlled Urgency', tier:3,
 conveys:'This matters right now, and I am still in control.',
 useWhen:'Real time pressure. Genuine deadlines. Never manufactured ones — the tone is identical and the difference is whether it survives scrutiny.',
 cue:'Speed up the pace but keep the pitch low. Urgency without panic is *fast and low*; panic is *fast and high*.',
 recipe:{pitch:'Low mean, wide movement, no upward drift.',pace:'Quick, clipped, forward-leaning.',volume:'Elevated, supported.',terminal:'Sharp falls.',resonance:'Forward chest, crisp consonants.'},
 target:{wpm:[160,205],span:[6,12],term:[-8,-3],dyn:[7,15],pause:[8,17]},
 overdone:'Panic. Which is contagious, and the moment they catch it they stop deciding and start defending.',
 antidote:'Keep the pitch floor. If your voice rises with your rate, you have produced anxiety, not urgency.',
 lines:['We need to move on this today.','If we don\'t decide by Friday it\'s gone.','This window closes and it doesn\'t reopen.','I need an answer, not a maybe.','Every week we wait costs us the same amount again.','Right now. Not next quarter.','There isn\'t a version of this where we wait.','That\'s the deadline and it isn\'t mine.','We have about an hour to fix this.','This is the moment.']},

{id:'takeaway', fam:'pressure', name:'The Takeaway', tier:3,
 conveys:'I am genuinely not sure this is for you.',
 useWhen:'When someone is being casual about something serious. The most powerful frame-restoring move that exists, and the easiest to fake badly.',
 cue:'Mean it. If you do not actually mean it, they hear it, and it becomes the cheapest trick in the book.',
 recipe:{pitch:'Low, flat, unemotional.',pace:'Slow, matter-of-fact.',volume:'Slightly reduced — you are withdrawing, so withdraw.',terminal:'Flat fall, complete stop.',resonance:'Neutral modal. No colour at all.'},
 target:{wpm:[100,140],span:[3,7],term:[-7,-3],dyn:[4,10],pause:[22,36]},
 overdone:'Obvious manipulation. A fake takeaway is worse than no takeaway — it teaches them everything else was technique too.',
 antidote:'Only run it when the disqualification is real. Say the specific reason it might not fit.',
 lines:['I\'m not sure this is a fit, honestly.','There are people we can\'t help, and I think you might be one of them.','Maybe this isn\'t the right time for you.','I\'d rather we didn\'t do this than do it badly.','Let\'s be honest — I don\'t think you\'re ready.','I don\'t want to sell you something you won\'t use.','I think you should probably keep looking.','This might be the wrong conversation.','I\'m going to be the one to say no here.','I don\'t think we should do this today.']},

{id:'scarce', fam:'pressure', name:'Quiet Scarcity', tier:3,
 conveys:'There is a real limit here, and I do not control it.',
 useWhen:'Actual constraints. Real inventory, real capacity, real windows.',
 cue:'Drop to just above a whisper — but keep the voice *on*. A true whisper has no pitch and loses all authority.',
 recipe:{pitch:'Dropped low.',pace:'Slowed.',volume:'Down to intimate. Quiet, not weak — keep the fold vibration.',terminal:'Definite fall.',resonance:'Breathy but voiced. Sotto voce, not whisper.'},
 target:{wpm:[95,135],span:[4,9],term:[-8,-3],dyn:[5,12],pause:[22,36]},
 overdone:'Sleazy. Manufactured urgency is the single most trust-destroying pattern in sales.',
 antidote:'Only ever state a limit you could prove. If you would not put it in writing, do not put it in your voice.',
 lines:['There\'s two left.','I\'ve got one slot in October and that\'s it until the new year.','After Friday the price goes back up. That\'s not my call.','We cap this at twelve for a reason.','I can hold it until end of day. Not longer.','That was the last one at that rate.','We\'re not taking anyone else on this quarter.','Honestly — I probably shouldn\'t be telling you this yet.','There\'s a waiting list.','I can\'t promise it\'ll be there next week.']},

{id:'disappoint', fam:'pressure', name:'Disappointment', tier:4,
 conveys:'I expected more, and we both know it.',
 useWhen:'Leadership. Someone capable underperformed. Far more effective than anger and considerably more dangerous.',
 cue:'Quiet. Slow. No anger at all — disappointment is anger that has been allowed to cool, and it lands ten times harder.',
 recipe:{pitch:'Low, narrow, slightly falling throughout.',pace:'Slow. Long pauses.',volume:'Reduced.',terminal:'Falling into extended silence.',resonance:'Relaxed chest, slight breath.'},
 target:{wpm:[85,120],span:[3,7],term:[-8,-3],dyn:[4,10],pause:[28,44]},
 overdone:'Emotional manipulation. Sustained disappointment becomes a permanent guilt frame and people leave.',
 antidote:'Say it once, say what happens next, then return to normal energy immediately. Holding the tone is punishment, not feedback.',
 lines:['I thought we were past this.','That\'s not the standard and you know it.','I expected better from you specifically.','You told me it was handled.','I\'m not angry. I\'m just surprised.','This isn\'t like you.','I gave you the room to do it your way.','And nobody thought to tell me.','That\'s twice now.','I don\'t want to have this conversation again.']},

/* ---------------- CURIOSITY & DOUBT ---------------- */
{id:'confused', fam:'curiosity', name:'Genuine Confusion', tier:2,
 conveys:'I did not follow that — say it again, better.',
 useWhen:'A vague, contradictory, or suspiciously tidy answer. Forces them to re-explain, and in re-explaining they persuade themselves.',
 cue:'Actually lose the thread for a second. Head tilt, brow down. Manufactured confusion is audible.',
 recipe:{pitch:'Rise-fall-rise. Unresolved, hanging in the air.',pace:'Slow, hesitant, a small stumble built in.',volume:'Soft.',terminal:'Rising and unfinished — the only tone in this family that must not land.',resonance:'Light modal.'},
 target:{wpm:[85,125],span:[5,11],term:[1,5],dyn:[3,9],pause:[24,38]},
 overdone:'You look incompetent, or they realise you are pretending. Twice in a conversation is the ceiling.',
 antidote:'Echo their exact word back. "Complicated — what do you mean by complicated?" is confusion with a job to do.',
 lines:['Wait — say that again?','Hm. I\'m not following the last part.','Sorry, what does "soon" mean here?','I might be missing something.','How does that connect to the first thing you said?','Complicated how?','I thought you said the opposite earlier.','Help me understand that.','Hang on. Which one is it?','I don\'t think I got that.']},

{id:'intrigue', fam:'curiosity', name:'Mystery & Intrigue', tier:2,
 conveys:'There is something here worth leaning in for.',
 useWhen:'Immediately before a reveal. The bridge line. The setup for the thing you actually want them to hear.',
 cue:'Stretch one sonorant sound in the key word — the r in "reason", the m in "something". The lengthening creates the suspension.',
 recipe:{pitch:'Dropped, chest-resonant.',pace:'Slowed, with deliberate elongation on the key word.',volume:'Reduced toward confidential.',terminal:'Suspended or trailing — deliberately unresolved.',resonance:'Chest, close, warm.'},
 target:{wpm:[90,130],span:[5,11],term:[-4,2],dyn:[5,12],pause:[24,38]},
 overdone:'Theatrical. Faintly sinister. Sounds like a podcast advert.',
 antidote:'Deliver on it immediately. Intrigue that is not paid off within two sentences becomes irritation.',
 lines:['So the reeeason I\'m calling.','There\'s something I want to show you.','Can I tell you what actually happens next?','Most people never find this part out.','Here\'s the bit nobody mentions.','I\'ll tell you what changed my mind.','There\'s a reason this works and it isn\'t the obvious one.','Let me show you something.','You\'re going to want to hear this bit.','And then something interesting happened.']},

{id:'invite', fam:'curiosity', name:'The Reasonable Ask', tier:1,
 conveys:'This is a small, fair thing to ask, and you can say no.',
 useWhen:'Permission. Small requests. The first beat of handling an objection. Transitions.',
 cue:'Palms up. Almost apologetic. The lowest-pressure sound you can make.',
 recipe:{pitch:'Rises on the final word.',pace:'Light and quick.',volume:'Slightly softened.',terminal:'Rising — this is one of the few places a rise is correct and powerful.',resonance:'Light, forward.'},
 target:{wpm:[130,170],span:[5,11],term:[1,5],dyn:[4,10],pause:[12,22]},
 overdone:'Needy. Supplicating. Three of these in a row and you have given away the frame entirely.',
 antidote:'One rise, then return to falls. The rise only works as a contrast against a floor of falling terminals.',
 lines:['Is that fair?','Can I ask you something?','Would it be alright if I pushed back on that?','Does that seem reasonable?','Mind if I take that a step further?','Can I be blunt for a second?','Is that cool with you?','Would you be open to a different way of looking at it?','Can I ask what you meant by that?','Fair enough?']},

{id:'probe', fam:'curiosity', name:'The Gentle Probe', tier:2,
 conveys:'There is more to that and I would like the rest of it.',
 useWhen:'A short answer to an important question. The follow-up that gets the actual information.',
 cue:'Say four words and stop. The shorter the probe, the more they fill.',
 recipe:{pitch:'Low, minimal movement.',pace:'Slow, very short utterance.',volume:'Quiet.',terminal:'Flat or slightly falling — never rising, or it becomes an interrogation.',resonance:'Soft modal.'},
 target:{wpm:[80,120],span:[3,8],term:[-4,0],dyn:[3,9],pause:[30,50]},
 overdone:'Interrogation. Three probes in a row without a statement in between and they lawyer up.',
 antidote:'Alternate: probe, then reflect back what they said, then probe again. The reflection is what keeps it a conversation.',
 lines:['Say more about that.','Meaning?','Like what?','And?','Such as?','What specifically?','Go on.','How so?','Which part?','In what way?']},

{id:'reflect', fam:'curiosity', name:'The Mirror', tier:1,
 conveys:'I heard exactly what you said, and I am handing it back so you can hear it too.',
 useWhen:'After any emotionally loaded statement. The single highest-value low-effort move in listening.',
 cue:'Repeat their last three to five words. Exactly their words, in their register.',
 recipe:{pitch:'Match theirs, then fall slightly.',pace:'Slow. Space before and after.',volume:'Slightly under theirs.',terminal:'Falling — a mirror that rises becomes a challenge.',resonance:'Neutral.'},
 target:{wpm:[85,125],span:[3,8],term:[-5,-1],dyn:[3,9],pause:[28,44]},
 overdone:'Parrot. Obvious technique. Mirror everything and it becomes a joke.',
 antidote:'Mirror only the emotionally loaded phrase, and only about once every few minutes.',
 lines:['"Stuck."','"Back to square one."','"Every single month."','"Nothing changes."','"You had enough."','"It\'s not the money."','"Just tired of it."','"Same conversation."','"Can\'t keep doing it."','"For them, not you."']},

/* ---------------- STRAIGHT LINE ---------------- */
{id:'sl_care', fam:'straight', name:'I Really Want to Know', tier:2,
 conveys:'I am genuinely, non-transactionally interested in you.',
 useWhen:'The greeting and the first real question. Also anywhere you need to re-engage after a stretch of your own talking.',
 cue:'You are calling someone you are actually pleased to be speaking to.',
 recipe:{pitch:'Raised baseline, wide melodic range, clear peak on the emphasised word.',pace:'Brisk, energetic.',volume:'Normal to slightly elevated.',terminal:'Rising — a genuine lift, even on the greeting.',resonance:'Bright, forward.'},
 target:{wpm:[140,180],span:[7,13],term:[1,6],dyn:[6,13],pause:[10,20]},
 overdone:'Chirpy telemarketer. Performative friendliness reads as a script within two seconds.',
 antidote:'Ask a specific question, not a generic one. Specificity is what makes energy read as interest rather than performance.',
 lines:['Hey — how have you been?','So what\'s been going on with you?','How\'s it all going over there?','Good, and how did the thing on Thursday go?','Talk to me — what\'s new?','How are you doing, honestly?','And how did that end up?','Tell me what happened.','So what\'s the latest?','Right — catch me up.']},

{id:'sl_pain', fam:'straight', name:'I Feel Your Pain', tier:2,
 conveys:'I have heard this before and it genuinely hurts.',
 useWhen:'While uncovering pain. Immediately after a disclosure, never as an opener.',
