 h:"It is the honest case for patient follow-up, and the reason the irritating version of follow-up actively destroys value rather than being neutral."},

{id:"i.self",p:"psych",n:"Self-command",k:"concept",
 t:"The capacity to not react — to let a silence run, to not answer the first question asked, to leave an insult unaddressed. Almost entirely a function of physiological arousal rather than character.",
 h:"It is trainable through the body, not through resolve. Slower breathing and a lower speaking register measurably lower arousal, and both are things you can do mid-sentence."},

{id:"i.read",p:"psych",n:"Reading the room",k:"concept",
 t:"Attending to what changed rather than what is there. A shift in someone's rate, a pause that got longer, a backchannel that stopped — deltas carry the information, not absolute states.",
 h:"It gives you something concrete to listen for instead of vague intuition, and the changes are usually audible several seconds before anything is said."},

/* --- learning: deeper --------------------------------------------------- */
{id:"l.mental",p:"learn",n:"Mental practice",k:"method",
 t:"Rehearsing a movement in imagination activates much of the same motor circuitry as performing it, and produces real if smaller gains. Most effective combined with physical practice, not instead of it.",
 h:"It means the ten minutes before a call are usable. Running the opening silently, hearing the tone you intend, is not nothing."},

{id:"l.self",p:"learn",n:"Self-modelling",k:"method",
 t:"Reviewing recordings of your own best attempts outperforms watching an expert, because the target stays inside your own range and the motor plan is already partly yours.",
 h:"It is why the app plays your own recordings back rather than showing you a professional. Your best rep is a more useful model than someone else's."},

{id:"l.sleep",p:"learn",n:"Consolidation",k:"concept",
 t:"Motor skills continue to improve for hours after practice stops, with sleep playing a substantial role. Performance the next day is often better than at the end of the session that produced it.",
 h:"It means ending a session while it is still going well is not quitting early. It also means one daily session beats one weekly marathon for reasons beyond willpower."},

{id:"l.block",p:"learn",n:"Blocked practice has a place",k:"rule",
 t:"Repeating one thing is better for acquiring a brand-new pattern; varied practice is better for retaining and transferring one you already roughly have. The correct order is blocked first, then varied.",
 h:"It tells you when to drill one tone repeatedly and when to switch to Roulette. Doing them in the wrong order wastes both."},

{id:"l.ceil",p:"learn",n:"Where the ceiling actually is",k:"concept",
 t:"Fold length, tract length and resonance capacity are fixed. Range, control, consistency, articulation and timing are not, and they account for the overwhelming majority of the difference between speakers.",
 h:"Almost nobody is near their ceiling. The limit people run into is nearly always practice structure, not anatomy."},

{id:"l.noticing",p:"learn",n:"Noticing is the bottleneck",k:"concept",
 t:"You cannot correct what you cannot perceive. In prosody the perceptual skill usually lags the productive one — people produce a correct terminal before they can reliably hear whether they did.",
 h:"It is the whole reason for measurement and for Ear Training. The numbers are a prosthetic for a perception you have not built yet."}
];
</script>

<script>
/* ============================================================
   AUDIO ENGINE
   Mic capture · pitch tracking (McLeod/NSDF) · RMS envelope
   VAD & pause detection · rate estimation · terminal inflection
   dynamic range · recording & playback · scoring
   ============================================================ */
'use strict';

var Audio = (function(){

var ctx=null, stream=null, source=null, analyser=null, proc=null, gain=null;
var SR=48000, BUF=2048;
var running=false, capturing=false;
var listeners=[];

/* rolling capture */
var frames=[];         // {t, f0, rms, db, voiced}
var chunks=[];         // Float32 audio for playback
var specFrames=[];     // {t, db, mags:Float32Array}  — only while grabSpectra
var grabSpectra=false;
var t0=0;
var lastErr=null;
var micState='idle';   // idle | live | denied | error

/* ---------- speaker profile ----------
   Set from calibration. Narrows the pitch-tracker search window (the
   single biggest source of octave errors), gives the VAD a real room
   noise floor, and supplies personal stretch bands.                */
var PROFILE=null;
function setProfile(p){ PROFILE = (p && p.done) ? p : null; }
function getProfile(){ return PROFILE; }

/* search bounds — wide by default, narrow once we know the speaker */
function bounds(){
  if(!PROFILE || !PROFILE.lowHz || !PROFILE.highHz) return {lo:60, hi:900};
  return {
    lo: Math.max(50,  Math.min(160, PROFILE.lowHz  * 0.72)),
    hi: Math.max(240, Math.min(900, PROFILE.highHz * 1.55))
  };
}

/* ---------- helpers ---------- */
function hzToSt(hz, ref){ return 12*Math.log2(hz/ref); }
function median(a){ if(!a.length) return 0; var b=a.slice().sort(function(x,y){return x-y;}); var m=b.length>>1;
  return b.length%2 ? b[m] : (b[m-1]+b[m])/2; }
function pct(a,p){ if(!a.length) return 0; var b=a.slice().sort(function(x,y){return x-y;});
  var i=(b.length-1)*p; var lo=Math.floor(i), hi=Math.ceil(i);
  return lo===hi ? b[lo] : b[lo]+(b[hi]-b[lo])*(i-lo); }
function mean(a){ return a.length ? a.reduce(function(s,x){return s+x;},0)/a.length : 0; }
function clamp(v,a,b){ return v<a?a:v>b?b:v; }

/* ---------- pitch: McLeod Pitch Method (normalised square difference) ---------- */
function detectPitch(buf, sr){
  var n=buf.length, i, j;
  // quick energy gate
  var rms=0; for(i=0;i<n;i++) rms+=buf[i]*buf[i];
  rms=Math.sqrt(rms/n);
  if(rms<0.006) return -1;

  var B=bounds();
  var maxLag=Math.floor(sr/B.lo);
  var minLag=Math.floor(sr/B.hi);
  if(maxLag>n-1) maxLag=n-1;

  var nsdf=new Float32Array(maxLag+1);
  for(var lag=minLag; lag<=maxLag; lag++){
    var ac=0, m=0;
    var lim=n-lag;
    for(i=0;i<lim;i++){
      var a=buf[i], b=buf[i+lag];
      ac += a*b;
      m  += a*a + b*b;
    }
    nsdf[lag] = m>0 ? (2*ac/m) : 0;
  }

  // pick peaks after first negative zero crossing
  var start=minLag;
  while(start<=maxLag && nsdf[start]>0) start++;
  var peaks=[], maxVal=-1;
  for(i=start+1;i<maxLag;i++){
    if(nsdf[i]>nsdf[i-1] && nsdf[i]>=nsdf[i+1]){
      // parabolic refine
      var a2=nsdf[i-1], b2=nsdf[i], c2=nsdf[i+1];
      var d=(a2-2*b2+c2);
      var shift = d!==0 ? 0.5*(a2-c2)/d : 0;
      var val = d!==0 ? b2 - 0.25*(a2-c2)*shift : b2;
      peaks.push({lag:i+shift, val:val});
      if(val>maxVal) maxVal=val;
    }
  }
  if(!peaks.length || maxVal<0.4) return -1;

  var thresh=maxVal*0.87;
  for(j=0;j<peaks.length;j++){
    if(peaks[j].val>=thresh){
      var f=sr/peaks[j].lag;
      if(f>=B.lo && f<=B.hi) return f;
      return -1;
    }
  }
  return -1;
}

/* ---------- octave-error smoothing ---------- */
function smoothF0(arr){
  var out=arr.slice();
  var vals=arr.filter(function(v){return v>0;});
  if(vals.length<6) return out;
  // anchor on the speaker's known modal F0 when we have one — a short
  // utterance's own median is a shaky reference, the profile's is not
  var med = median(vals);
  if(PROFILE && PROFILE.modalHz){
    var drift = Math.abs(12*Math.log2(med/PROFILE.modalHz));
    if(drift < 7) med = med*0.4 + PROFILE.modalHz*0.6;
  }
  for(var i=0;i<out.length;i++){
    if(out[i]<=0) continue;
    // fix octave jumps against the reference
    if(out[i] > med*1.7) out[i]/=2;
    else if(out[i] < med*0.58) out[i]*=2;
  }
  // median filter of 5
  var f=out.slice();
  for(i=2;i<out.length-2;i++){
    var w=[out[i-2],out[i-1],out[i],out[i+1],out[i+2]].filter(function(v){return v>0;});
    if(w.length>=3) f[i]=median(w);
  }
  return f;
}

/* ---------- init ---------- */
function ready(){ return micState==='live'; }
function state(){ return micState; }
function error(){ return lastErr; }

function start(){
  if(running) return Promise.resolve(true);
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    micState='error'; lastErr='This browser does not expose microphone access.'; emit(); return Promise.resolve(false);
  }
  return navigator.mediaDevices.getUserMedia({audio:{
      echoCancellation:false, noiseSuppression:false, autoGainControl:false, channelCount:1
    }}).then(function(s){
    stream=s;
    var AC=window.AudioContext||window.webkitAudioContext;
    ctx=new AC();
    SR=ctx.sampleRate;
    source=ctx.createMediaStreamSource(stream);
    analyser=ctx.createAnalyser();
    analyser.fftSize=BUF; analyser.smoothingTimeConstant=0;
    analyser.minDecibels=-95; analyser.maxDecibels=-12;
    gain=ctx.createGain(); gain.gain.value=0;
    proc=ctx.createScriptProcessor(BUF,1,1);
    source.connect(analyser);
    source.connect(proc);
    proc.connect(gain); gain.connect(ctx.destination);
    proc.onaudioprocess=onAudio;
    running=true; micState='live'; lastErr=null; emit();
    return true;
  }).catch(function(e){
    micState = (e && (e.name==='NotAllowedError'||e.name==='PermissionDeniedError')) ? 'denied' : 'error';
    lastErr = (e && e.message) || 'Microphone unavailable.';
    emit();
    return false;
  });
}

function stop(){
  try{ if(proc){proc.disconnect(); proc.onaudioprocess=null;} }catch(e){}
  try{ if(source) source.disconnect(); }catch(e){}
  try{ if(gain) gain.disconnect(); }catch(e){}
  try{ if(stream) stream.getTracks().forEach(function(t){t.stop();}); }catch(e){}
  try{ if(ctx && ctx.close) ctx.close(); }catch(e){}
  ctx=stream=source=analyser=proc=gain=null;
  running=false; capturing=false; micState='idle'; emit();
}

/* ---------- live frame handler ---------- */
var liveF0=-1, liveDb=-90, liveRms=0;
var specBins=new Uint8Array(16);

function onAudio(ev){
  var buf=ev.inputBuffer.getChannelData(0);
  var n=buf.length, i, s=0;
  for(i=0;i<n;i++) s+=buf[i]*buf[i];
  var rms=Math.sqrt(s/n);
  var db=20*Math.log10(Math.max(rms,1e-7));
  liveRms=rms; liveDb=db;
  var f0=detectPitch(buf, SR);
  liveF0=f0;

  if(analyser){
    var fd=new Uint8Array(analyser.frequencyBinCount);
    analyser.getByteFrequencyData(fd);
    var step=Math.floor(fd.length/16);
    for(i=0;i<16;i++){
      var m=0; for(var j=0;j<step;j++){ var v=fd[i*step+j]; if(v>m) m=v; }
      specBins[i]=m;
    }
  }

  if(capturing){
    var t=(performance.now()-t0)/1000;
    frames.push({t:t, f0:f0, rms:rms, db:db, voiced:f0>0 && db>-52});
    var c=new Float32Array(n); c.set(buf); chunks.push(c);
    if(frames.length>24000){ frames.shift(); chunks.shift(); }

    // full-resolution spectrum, only during calibration steps that need it
    if(grabSpectra && analyser && specFrames.length<900){
      var fb=new Uint8Array(analyser.frequencyBinCount);
      analyser.getByteFrequencyData(fb);
      var lin=new Float32Array(fb.length);
      var mn=analyser.minDecibels, mx=analyser.maxDecibels;
      for(i=0;i<fb.length;i++){
        // byte 0..255 maps linearly across [minDecibels, maxDecibels] — undo it
        var dbv = mn + (fb[i]/255)*(mx-mn);
        lin[i] = fb[i]>0 ? Math.pow(10, dbv/20) : 0;
      }
      specFrames.push({t:t, db:db, mags:lin});
    }
  }
}

/* ---------- capture control ---------- */
function beginCapture(opts){
  frames=[]; chunks=[]; specFrames=[];
  grabSpectra = !!(opts && opts.spectra);
  t0=performance.now(); capturing=true;
}
function endCapture(){ capturing=false; grabSpectra=false; return analyse(); }
function isCapturing(){ return capturing; }
function live(){ return {f0:liveF0, db:liveDb, rms:liveRms, spec:specBins, elapsed: capturing?(performance.now()-t0)/1000:0}; }
function liveFrames(){ return frames; }

/* ---------- analysis ---------- */
function analyse(){
  var raw=frames.slice();
  if(raw.length<10) return null;

  var f0raw=raw.map(function(f){return f.f0>0?f.f0:-1;});
  var f0s=smoothF0(f0raw);
  for(var i=0;i<raw.length;i++) raw[i].f0s=f0s[i];

  var voiced=raw.filter(function(f){ return f.f0s>0 && f.db>-52; });
  if(voiced.length<6) return {empty:true, dur:raw.length? raw[raw.length-1].t : 0};

  var hz=voiced.map(function(f){return f.f0s;});
  var baseline=median(hz);

  /* --- pitch span: 80th-percentile in semitones (never min/max) --- */
  var sts=hz.map(function(h){ return hzToSt(h, baseline); });
  var span = pct(sts,0.9) - pct(sts,0.1);

  /* --- pause / VAD segmentation --- */
  var dbs=raw.map(function(f){return f.db;});
  var loud=pct(dbs,0.92);
  var floorDb=pct(dbs,0.08);
  var gate=Math.max(loud-26, floorDb+7, -60);
  var frameDur = raw.length>1 ? (raw[raw.length-1].t-raw[0].t)/(raw.length-1) : BUF/SR;

  var segs=[], cur=null;
  for(i=0;i<raw.length;i++){
    var on = raw[i].db>gate;
    if(on){ if(!cur){cur={s:raw[i].t,e:raw[i].t};} else cur.e=raw[i].t; }
    else { if(cur){ segs.push(cur); cur=null; } }
  }
  if(cur) segs.push(cur);
  // merge segments separated by < 120 ms
  var merged=[];
  segs.forEach(function(s){
    if(merged.length && s.s - merged[merged.length-1].e < 0.12) merged[merged.length-1].e=s.e;
    else merged.push({s:s.s,e:s.e});
  });
  segs=merged.filter(function(s){ return s.e-s.s > 0.05; });

  var pauses=[];
  for(i=1;i<segs.length;i++){
    var g=segs[i].s - segs[i-1].e;
    if(g>=0.2) pauses.push(g);
  }
  var dur = raw[raw.length-1].t - raw[0].t;
  var speechTime = segs.reduce(function(a,s){ return a + (s.e-s.s); }, 0);
  var pauseFrac = dur>0 ? (1 - speechTime/dur)*100 : 0;
  var trailPause = segs.length ? Math.max(0, dur - segs[segs.length-1].e) : 0;

  /* --- terminal inflection: last voiced run --- */
  var term=0, termConf=0;
  var tail=[];
  for(i=raw.length-1;i>=0;i--){
    if(raw[i].f0s>0 && raw[i].db>gate) tail.push(raw[i]);
    else if(tail.length>4) break;
    if(tail.length>40) break;
  }
  tail.reverse();
  if(tail.length>=6){
    var half=Math.max(2,Math.floor(tail.length/2));
    var early=median(tail.slice(0,half).map(function(f){return f.f0s;}));
    var late =median(tail.slice(-half).map(function(f){return f.f0s;}));
    if(early>0 && late>0){ term = hzToSt(late, early); termConf = Math.min(1, tail.length/14); }
  }

  /* --- peak-to-end fall (nuclear peak → final) --- */
  var nucFall=0;
  if(voiced.length>8){
    var lastQ = voiced.slice(Math.floor(voiced.length*0.55));
    var peakHz = pct(voiced.slice(0,Math.floor(voiced.length*0.8)).map(function(f){return f.f0s;}), 0.93);
    var endHz  = median(lastQ.slice(-Math.max(3,Math.floor(lastQ.length*0.28))).map(function(f){return f.f0s;}));
    if(peakHz>0 && endHz>0) nucFall = hzToSt(endHz, peakHz);
  }

  /* --- dynamic range: per-segment RMS in dB --- */
  var segDb=segs.map(function(s){
    var fs=raw.filter(function(f){ return f.t>=s.s && f.t<=s.e; });
    var e=mean(fs.map(function(f){return f.rms*f.rms;}));
    return 20*Math.log10(Math.max(Math.sqrt(e),1e-7));
  }).filter(function(v){return v>-70;});
  var dyn = segDb.length>1 ? (pct(segDb,0.95)-pct(segDb,0.05)) : 0;

  /* --- volume floor: final 18% vs overall --- */
  var voicedAll=raw.filter(function(f){return f.db>gate;});
  var overallDb = 20*Math.log10(Math.max(Math.sqrt(mean(voicedAll.map(function(f){return f.rms*f.rms;}))),1e-7));
  var tailN=Math.max(3, Math.floor(voicedAll.length*0.18));
  var tailDb = 20*Math.log10(Math.max(Math.sqrt(mean(voicedAll.slice(-tailN).map(function(f){return f.rms*f.rms;}))),1e-7));
  var floorDrop = overallDb - tailDb;

  /* --- fry detection: voiced frames well under modal --- */
  var fryFrames=voiced.filter(function(f){ return f.f0s < baseline*0.62; }).length;
  var fryPct = voiced.length ? fryFrames/voiced.length*100 : 0;

  return {
    empty:false,
    dur:dur, speechTime:speechTime,
    baseline:baseline, span:span, meanSt:mean(sts),
    lowSt:pct(sts,0.1), highSt:pct(sts,0.9),
    term:term, termConf:termConf, nucFall:nucFall,
    pauses:pauses, pauseCount:pauses.length,
    pauseFrac:pauseFrac, meanPause:mean(pauses), maxPause:pauses.length?Math.max.apply(null,pauses):0,
    trailPause:trailPause,
    dyn:dyn, floorDrop:floorDrop, overallDb:overallDb,
    segs:segs, segCount:segs.length,
    fryPct:fryPct,
    frames:raw, gate:gate, frameDur:frameDur
  };
}

/* ============================================================
   CALIBRATION ANALYSES
   ============================================================ */

/* --- step 1: room noise floor --- */
function analyseNoise(){
  var raw=frames.slice();
  if(raw.length<8) return null;
  var dbs=raw.map(function(f){return f.db;});
  var floorDb = pct(dbs,0.5);
  var peakDb  = pct(dbs,0.97);
  var verdict, ok;
  if(floorDb < -62){ verdict='Very quiet. Ideal conditions.'; ok=true; }
  else if(floorDb < -54){ verdict='Quiet enough. Nothing to worry about.'; ok=true; }
  else if(floorDb < -46){ verdict='Some background noise. Workable, but the pause measurements will be a little softer than they could be.'; ok=true; }
  else { verdict='Noisy. A fan, air conditioning, traffic or an open room. Pause and pace scores will be unreliable until it is quieter — move rooms or use a headset mic if you can.'; ok=false; }
  return {floorDb:floorDb, peakDb:peakDb, verdict:verdict, ok:ok, spread:peakDb-floorDb};
}

/* --- step 2: sustained vowel — register, breath support, stability --- */
function analyseSustain(){
  var raw=frames.slice();
  if(raw.length<10) return null;
  var f0s=smoothF0(raw.map(function(f){return f.f0>0?f.f0:-1;}));
  for(var i=0;i<raw.length;i++) raw[i].f0s=f0s[i];
  var voiced=raw.filter(function(f){ return f.f0s>0 && f.db>-52; });
  if(voiced.length<8) return {empty:true};

  // longest continuous voiced run = maximum phonation time
  var best=0, run=0, lastT=-1, frameDur = raw.length>1 ? (raw[raw.length-1].t-raw[0].t)/(raw.length-1) : 0.043;
  for(i=0;i<raw.length;i++){
    if(raw[i].f0s>0 && raw[i].db>-52){ run+=frameDur; if(run>best) best=run; }
    else run=0;
  }
  var hz=voiced.map(function(f){return f.f0s;});
  var modal=median(hz);
  // stability: semitone standard deviation across the sustain
  var sts=hz.map(function(h){ return hzToSt(h, modal); });
  var m=mean(sts);
  var sd=Math.sqrt(mean(sts.map(function(s){ return (s-m)*(s-m); })));
  return {modalHz:modal, mpt:best, steadiness:sd, frames:voiced.length};
}

/* --- step 3: pitch glide — usable range --- */
function analyseGlide(){
  var raw=frames.slice();
  if(raw.length<10) return null;
  // glide search must be wide — this is what SETS the bounds, so ignore any profile
  var saved=PROFILE; PROFILE=null;
  var f0s=smoothF0(raw.map(function(f){return f.f0>0?f.f0:-1;}));
  PROFILE=saved;
  for(var i=0;i<raw.length;i++) raw[i].f0s=f0s[i];
  var voiced=raw.filter(function(f){ return f.f0s>0 && f.db>-50; });
  if(voiced.length<10) return {empty:true};
  var hz=voiced.map(function(f){return f.f0s;});
  // 5th/95th percentile, not min/max — endpoints are where tracking is worst
  var lo=pct(hz,0.05), hi=pct(hz,0.95);
  var mid=median(hz);
  return {lowHz:lo, highHz:hi, midHz:mid, semitones: hzToSt(hi, lo), frames:voiced.length};
}

/* --- spectral centre of gravity over a band ---
   A naive magnitude centroid is badly biased: every fricative has broad
   skirts, and whichever side of the measurement band has more room to
   spread drags the answer toward the band's middle. That compresses the
   /s/-to-/ʃ/ ratio, which is exactly the number we care about — so a
   plain centroid would produce false "compressed separation" readings on
   perfectly normal speakers.
   Two corrections: gate to bins near the peak (kills the skirts), and
   weight by power rather than amplitude (sharpens what's left).      */
function cog(mags, sr, loHz, hiHz, gateFrac){
  var nyq=sr/2, n=mags.length, i;
  var i0=Math.max(1, Math.floor(loHz/nyq*n)), i1=Math.min(n-1, Math.ceil(hiHz/nyq*n));
  if(i1<=i0) return 0;
  var peak=0;
  for(i=i0;i<=i1;i++) if(mags[i]>peak) peak=mags[i];
  if(peak<=0) return 0;
  var gate=peak*(gateFrac==null?0.45:gateFrac);
  var num=0, den=0;
  for(i=i0;i<=i1;i++){
    var m=mags[i];
    if(m<gate) continue;
    var p=m*m;
    num += (i/n*nyq)*p; den += p;
  }
  return den>0 ? num/den : 0;
}

/* --- step 4: sibilants.  "sssss … shhhhh" in one capture ---
   Measures the spectral centre of gravity of each fricative and, more
   importantly, the SEPARATION between them. Absolute COG scales with
   vocal-tract length; the ratio does not, so the ratio is the honest
   number and the one we report against.                              */
function analyseSibilants(){
  if(specFrames.length<10) return null;
  var raw=frames.slice();
  if(raw.length<10) return null;

  var dbs=raw.map(function(f){return f.db;});
  var gate=Math.max(pct(dbs,0.92)-22, pct(dbs,0.1)+8, -58);

  // segment into voiced/noisy regions on the same gate the VAD uses
  var segs=[], cur=null;
  for(var i=0;i<raw.length;i++){
    if(raw[i].db>gate){ if(!cur) cur={s:raw[i].t,e:raw[i].t}; else cur.e=raw[i].t; }
    else if(cur){ segs.push(cur); cur=null; }
  }
  if(cur) segs.push(cur);
  var merged=[];
  segs.forEach(function(s){
    if(merged.length && s.s-merged[merged.length-1].e < 0.15) merged[merged.length-1].e=s.e;
    else merged.push({s:s.s,e:s.e});
  });
  segs = merged.filter(function(s){ return s.e-s.s > 0.25; });
  if(segs.length<2) return {tooFew:true, segs:segs.length};

  // take the two longest — trims throat clears and stray noise
  segs.sort(function(a,b){ return (b.e-b.s)-(a.e-a.s); });
  var two=segs.slice(0,2).sort(function(a,b){ return a.s-b.s; });

  function segCog(seg){
    var fs=specFrames.filter(function(f){
      // trim 20% off each end — the transitions in and out aren't the fricative
      var pad=(seg.e-seg.s)*0.2;
      return f.t>=seg.s+pad && f.t<=seg.e-pad;
    });
    if(fs.length<3) return null;
    var n=fs[0].mags.length, acc=new Float32Array(n);
    fs.forEach(function(f){ for(var k=0;k<n;k++) acc[k]+=f.mags[k]; });
    for(var k=0;k<n;k++) acc[k]/=fs.length;
    return { cog: cog(acc, SR, 1500, 11000), frames:fs.length, dur:seg.e-seg.s };
  }

  var A=segCog(two[0]), B=segCog(two[1]);
  if(!A || !B) return {tooFew:true, segs:segs.length};

  // whichever is higher is /s/, the other /ʃ/ — order-independent, so it
  // still works if someone says them the other way round
  var s  = A.cog >= B.cog ? A : B;
  var sh = A.cog >= B.cog ? B : A;
  var ratio = sh.cog>0 ? s.cog/sh.cog : 0;

  var verdict, flag;
  if(ratio >= 1.55){
    verdict='Clear separation between your /s/ and /ʃ/. Nothing to work on here.'; flag='ok';
  } else if(ratio >= 1.3){
    verdict='Slightly compressed separation. Common, usually just a soft /s/ — the sibilant rack in Articulation sharpens it.'; flag='soft';
  } else {
    verdict='Your /s/ and /ʃ/ are sitting very close together. That can mean a soft or fronted /s/, or simply that the two sounds ran into each other in the recording. It is worth re-running this step to check, and if it holds, the sibilant rack is the drill that targets it.'; flag='close';
  }
  return {
    sHz:s.cog, shHz:sh.cog, ratio:ratio, verdict:verdict, flag:flag,
    sDur:s.dur, shDur:sh.dur
  };
}

/* --- step 5: natural speech baseline --- */
function analyseNatural(a, wordCount){
  if(!a || a.empty) return null;
  return {
    wpm: wpm(a, wordCount),
    span: a.span,
    term: a.term,
    dyn: a.dyn,
    pauseFrac: a.pauseFrac,
    floorDrop: a.floorDrop,
    baseHz: a.baseline
  };
}

/* ---------- rate ---------- */
function wpm(a, wordCount){
  if(!a || !a.speechTime || !wordCount) return 0;
  // exclude long pauses (>600ms) so the figure reflects articulation + normal junctures
  var longPause = a.pauses.filter(function(p){return p>0.6;}).reduce(function(s,p){return s+p;},0);
  var t = Math.max(0.3, a.dur - longPause);
  return wordCount/(t/60);
}

/* ---------- scoring ---------- */
function inBand(v, band){ return v>=band[0] && v<=band[1]; }
function bandScore(v, band, tolerance){
  if(inBand(v,band)) return 1;
  var tol = tolerance!=null ? tolerance : (band[1]-band[0])*0.9 + 0.001;
  var d = v<band[0] ? band[0]-v : v-band[1];
  return clamp(1 - d/tol, 0, 1);
}

/* ---------- personal stretch bands ----------
   Derived from calibration. Deliberately set ABOVE the person's natural
   habit — the point is to stretch them past where they already sit, not
   to lower the bar to meet them. Terminal is never personalised: a fall
   is a fall, that's physics rather than physiology.                    */
function personalBands(tone){
  var P=PROFILE;
  if(!P || !P.natural) return null;
  var T=tone.target, F=P.flat, E=P.expressive, N=P.natural;

  // With a three-point profile we can do this properly: anchor the band on
  // where THIS speaker's floor actually is, and scale it by the range they
  // demonstrably have on demand. A person whose flat already carries 6 st
  // and one whose flat carries 2 st should not be handed the same target.
  if(F && E && E.span > F.span + 0.5){
    var travel = E.span - F.span;
    var stdMid = (T.span[0]+T.span[1])/2, stdHalf = (T.span[1]-T.span[0])/2;
    // where the standard band sits as a fraction of a typical 8-st travel,
    // re-expressed against this speaker's own travel
    var frac = Math.max(0.35, Math.min(1.0, stdMid/8));
    var centre = F.span + travel*frac;
    var half = Math.max(1.2, stdHalf * (travel/8));
    var spanBand = [ +(centre-half).toFixed(1), +(centre+half).toFixed(1) ];
    // never let the personal floor fall at or below their flat — that would
    // score them as engaged while they are doing nothing
    spanBand[0] = Math.max(spanBand[0], +(F.span + travel*0.28).toFixed(1));
    spanBand[1] = Math.max(spanBand[1], spanBand[0]+1.5);
    return {
      wpm:  shift(T.wpm,  N.wpm,  1,    70, 240),
      span: [Math.max(2.5, spanBand[0]), Math.min(20, spanBand[1])],
      term: T.term,
      dyn:  shift(T.dyn,  (F.dyn!=null? F.dyn + Math.max(0,(E.dyn-F.dyn))*0.55 : N.dyn), 1, 2, 22),
      pause:shift(T.pause, N.pauseFrac, 1.05, 5, 55)
    };
  }

  // fallback: older profiles that only captured a single natural read
  function shift(band, natural, stretch, floor, ceil){
    if(natural==null) return band;
    var mid=(band[0]+band[1])/2;
    var lo = band[0] + (natural-mid)*0.33;
    var hi = band[1] + (natural-mid)*0.33;
    lo*=stretch; hi*=stretch;
    return [Math.max(floor, +lo.toFixed(1)), Math.min(ceil, +hi.toFixed(1))];
  }
  return {
    wpm:  shift(T.wpm,  N.wpm,  1,    70,  240),
    span: shift(T.span, N.span, 1.12, 3.5, 18),
    term: T.term,
    dyn:  shift(T.dyn,  N.dyn,  1.08, 2,   20),
    pause:shift(T.pause,N.pauseFrac, 1.05, 5, 55)
  };
}

/* How far this rep sits above the speaker's own FLOOR.
   Flat is the honest zero point — "you added 3.2 semitones over your own
   flat" means something, where "your span was 5.1" does not, because 5.1
   is engaged for one person and disengaged for another.               */
function vsBaseline(a, W){
  var P=PROFILE;
  if(!P || !P.natural) return null;
  var base = P.flat || P.natural;
  var ref  = P.flat ? 'flat' : 'baseline';
  var out=[];
  if(base.span!=null)  out.push({k:'Range',    d:a.span - base.span,   u:'st', ref:ref});
  if(base.dyn!=null)   out.push({k:'Dynamics', d:a.dyn  - base.dyn,    u:'dB', ref:ref});
  if(base.term!=null)  out.push({k:'Terminal', d:base.term - a.term,   u:'st', ref:ref});
  if(base.pauseFrac!=null) out.push({k:'Silence', d:a.pauseFrac-base.pauseFrac, u:'%', ref:ref});
  if(base.floorDrop!=null) out.push({k:'Held to end', d:base.floorDrop-a.floorDrop, u:'dB', ref:ref});
  var rows = out.map(function(x){ x.d=+x.d.toFixed(1); x.good = x.d > 0.4; return x; });

  // headroom: how much of their demonstrated range this rep actually used
  if(P.flat && P.expressive){
    var travel = Math.max(0.5, P.expressive.span - P.flat.span);
    var used = (a.span - P.flat.span) / travel * 100;
    rows.headroom = {
      pct: Math.round(Math.max(0, Math.min(140, used))),
      travel: +travel.toFixed(1),
      flat: +P.flat.span.toFixed(1),
      ceil: +P.expressive.span.toFixed(1)
    };
  }
  return rows;
}

function scoreAgainstTone(a, tone, wordCount, usePersonal){
  if(!a || a.empty) return null;
  var std=tone.target;
  var pers = personalBands(tone);
  var T = (usePersonal && pers) ? pers : std;
  var parts=[], faults=[], wins=[];

  var W=wpm(a, wordCount);
  var sW=bandScore(W, T.wpm, 42);
  parts.push({k:'Pace', v:Math.round(W), u:'wpm', s:sW, band:T.wpm});
  if(sW<0.62){
    if(W<T.wpm[0]) faults.push({t:'warn',b:'Too slow for this tone',s:'Target is '+T.wpm[0]+'–'+T.wpm[1]+' wpm. You ran at '+Math.round(W)+'. Slow delivery reads as laboured rather than deliberate below about 120.'});
    else faults.push({t:'bad',b:'Rushing',s:'Target is '+T.wpm[0]+'–'+T.wpm[1]+' wpm. You ran at '+Math.round(W)+'. Rushing is almost always a pause problem, not a rate problem — add silence rather than slowing the words.'});
  } else wins.push('Pace sat in the pocket for this tone.');

  var sS=bandScore(a.span, T.span, 5);
  parts.push({k:'Range', v:a.span.toFixed(1), u:'st', s:sS, band:T.span});
  if(a.span<4) faults.push({t:'bad',b:'Monotone',s:'Only '+a.span.toFixed(1)+' semitones of range. Under 4 and listeners stop processing content. Widen the movement while keeping your mean pitch low — those are independent dials.'});
  else if(a.span>15) faults.push({t:'warn',b:'Theatrical range',s:a.span.toFixed(1)+' semitones. Over about 14 it reads as performance rather than conversation.'});
  else if(sS>=0.62) wins.push('Pitch range was in the engaged band.');

  var sT=bandScore(a.term, T.term, 3.4);
  var termLbl = a.term<=-1 ? 'falling' : a.term>=1 ? 'rising' : 'flat';
  parts.push({k:'Terminal', v:(a.term>0?'+':'')+a.term.toFixed(1), u:'st '+termLbl, s:sT, band:T.term});
  if(sT<0.6){
    if(T.term[1]<0 && a.term>-1) faults.push({t:'bad',b:'Terminal did not fall',s:'This tone needs a fall of '+Math.abs(T.term[1])+'–'+Math.abs(T.term[0])+' semitones. You ended '+termLbl+' ('+a.term.toFixed(1)+' st). A statement that ends level or rising is heard as unsure, and it is the fastest way to lose a claim.'});
    else if(T.term[0]>0 && a.term<1) faults.push({t:'bad',b:'Terminal did not lift',s:'This tone needs a genuine rise. You ended '+termLbl+'. A question delivered flat reads as an interrogation.'});
    else faults.push({t:'warn',b:'Terminal off target',s:'Target '+T.term[0]+' to '+T.term[1]+' st; you produced '+a.term.toFixed(1)+'.'});
  } else wins.push('Terminal inflection was correct for the tone.');

  var sD=bandScore(a.dyn, T.dyn, 5);
  parts.push({k:'Dynamics', v:a.dyn.toFixed(1), u:'dB', s:sD, band:T.dyn});
  if(a.dyn<4) faults.push({t:'warn',b:'Flat dynamics',s:'Only '+a.dyn.toFixed(1)+' dB between your quietest and loudest phrase. Aim for 8–12. Volume variation is the parameter most speakers never touch.'});

  var sP=bandScore(a.pauseFrac, T.pause, 12);
  parts.push({k:'Silence', v:Math.round(a.pauseFrac), u:'%', s:sP, band:T.pause});
  if(a.pauseFrac<10) faults.push({t:'bad',b:'No silence',s:'Only '+Math.round(a.pauseFrac)+'% of that was pause. Under 10% is the acoustic signature of rushing regardless of your word rate.'});
  else if(sP>=0.65) wins.push('Pause fraction was healthy.');

  if(a.floorDrop>4.5) faults.push({t:'bad',b:'Trailing off',s:'Your final syllables were '+a.floorDrop.toFixed(1)+' dB below the utterance average. A correct falling terminal keeps its intensity to the last consonant — target within 4 dB. This is a breath-planning problem: breathe one clause earlier.'});
  else if(a.floorDrop<=4.5 && a.term<-1) wins.push('You fell in pitch without falling in energy — that is the hard version and you got it.');

  if(a.fryPct>28) faults.push({t:'warn',b:'Phrase-final fry',s:Math.round(a.fryPct)+'% of your voiced frames dropped below your modal floor. Occasional creak is normal English; this much starts costing you. Breathe earlier.'});

  var weights={Pace:1, Range:1.25, Terminal:1.55, Dynamics:.8, Silence:1};
  var tot=0, wsum=0;
  parts.forEach(function(p){ var w=weights[p.k]||1; tot+=p.s*w; wsum+=w; });
  var score=Math.round(clamp(tot/wsum,0,1)*100);
  if(a.floorDrop>6) score=Math.max(0,score-7);
  if(a.span<3) score=Math.max(0,score-8);

  return {
    score:score, parts:parts, faults:faults, wins:wins, wpm:W,
    personalised: !!(usePersonal && pers),
    hasPersonal: !!pers,
    vsBase: vsBaseline(a, W)
  };
}

/* ---------- targeted scorers ---------- */
function scoreTerminal(a, want){ // want: 'fall'|'rise'|'flat'
  if(!a||a.empty) return null;
  var t=a.term, ok, msg;
  if(want==='fall'){ ok = t<=-3; msg = ok ? 'Clean fall of '+Math.abs(t).toFixed(1)+' semitones.' :
    t<=-1 ? 'Only '+Math.abs(t).toFixed(1)+' st. Under 3 it is not reliably heard as a fall at all — go lower at the end, and keep the volume up while you do it.' :
    'You ended '+(t>=1?'rising':'flat')+'. That is the uptalk pattern. Say it again and put the last word at the bottom of your range.'; }
  else if(want==='rise'){ ok = t>=2.5; msg = ok ? 'Clear rise of '+t.toFixed(1)+' semitones.' :
    'You ended '+(t<=-1?'falling':'flat')+' ('+t.toFixed(1)+' st). A genuine question needs a lift of at least 3 semitones on the final syllable.'; }
  else { ok = Math.abs(t)<1.6; msg = ok ? 'Held level — suspended, which is what a sustained tone needs.' :
    'You moved '+t.toFixed(1)+' st. A level tone should stay within about 1.5 either way.'; }
  return {ok:ok, msg:msg, val:t, score: ok?100:Math.round(clamp(100-Math.abs((want==='fall'?-4:want==='rise'?4:0)-t)*13,0,100))};
}

function scorePace(a, wordCount, band){
  if(!a||a.empty) return null;
  var W=wpm(a,wordCount);
  var s=Math.round(bandScore(W,band,40)*100);
  return {val:Math.round(W), score:s, ok:inBand(W,band),
    msg: inBand(W,band) ? 'In the band.' : W<band[0] ? 'Under target — '+Math.round(W)+' vs '+band[0]+'.' : 'Over target — '+Math.round(W)+' vs '+band[1]+'.'};
}

function scoreRange(a, minSt){
  if(!a||a.empty) return null;
  var ok=a.span>=minSt;
  return {val:a.span, score:Math.round(clamp(a.span/minSt,0,1.3)*77), ok:ok,
    msg: ok ? a.span.toFixed(1)+' semitones — engaged.' : 'Only '+a.span.toFixed(1)+' st. Widen the movement, and do it without raising your average pitch.'};
}

function scoreFloor(a){
  if(!a||a.empty) return null;
  var ok=a.floorDrop<=4;
  return {val:a.floorDrop, ok:ok, score:Math.round(clamp(1-(a.floorDrop-1)/9,0,1)*100),
    msg: ok ? 'Held to the end — '+a.floorDrop.toFixed(1)+' dB drop.' : 'Lost '+a.floorDrop.toFixed(1)+' dB by the end. Target under 4.'};
}

function scorePauses(a, wanted){ // wanted: array of seconds
  if(!a||a.empty) return null;
  var got=a.pauses.slice();
  var rows=wanted.map(function(w,i){
    var g=got[i];
    if(g==null) return {want:w, got:null, ok:false};
    return {want:w, got:g, ok: Math.abs(g-w) <= Math.max(0.22, w*0.35)};
  });
  var hit=rows.filter(function(r){return r.ok;}).length;
  return {rows:rows, score:Math.round(hit/Math.max(1,wanted.length)*100), hit:hit, total:wanted.length};
}

/* ---------- contour comparison ---------- */
function contourTrace(a){
  if(!a||a.empty) return [];
  var v=a.frames.filter(function(f){return f.f0s>0 && f.db>a.gate;});
  if(v.length<4) return [];
  var t0v=v[0].t, t1v=v[v.length-1].t, span=Math.max(.15,t1v-t0v);
  var base=a.baseline;
  return v.map(function(f){ return [ (f.t-t0v)/span, hzToSt(f.f0s, base) ]; });
}

function scoreContour(trace, target){
  if(!trace.length) return {score:0, msg:'Nothing detected. Check the mic and speak up.'};
  // normalise target to zero-mean like the trace
  var tm=mean(target.map(function(p){return p[1];}));
  var um=mean(trace.map(function(p){return p[1];}));
  function at(pts,x){
    for(var i=1;i<pts.length;i++){
      if(pts[i][0]>=x){
        var a1=pts[i-1], b1=pts[i];
        var r=(x-a1[0])/Math.max(1e-6,(b1[0]-a1[0]));
        return a1[1]+(b1[1]-a1[1])*r;
      }
    }
    return pts[pts.length-1][1];
  }
  var err=0, N=40;
  for(var i=0;i<=N;i++){
    var x=i/N;
    var d=(at(trace,x)-um)-(at(target,x)-tm);
    err+=d*d;
  }
  var rmse=Math.sqrt(err/(N+1));
  var score=Math.round(clamp(1-(rmse-0.7)/5.5,0,1)*100);
  var msg = score>=82 ? 'Very close match — that is the shape.' :
            score>=62 ? 'Right shape, magnitude off. Exaggerate the movement.' :
            score>=38 ? 'The direction is roughly there but the contour is flatter than the target.' :
                        'Not the shape yet. Watch the grey line and try tracing it with an exaggerated "ooo" first, then add the words.';
  return {score:score, rmse:rmse, msg:msg};
}

/* ---------- playback ---------- */
var playCtx=null, playSrc=null;
function buildBuffer(){
  if(!chunks.length) return null;
  var total=chunks.reduce(function(s,c){return s+c.length;},0);
  var AC=window.AudioContext||window.webkitAudioContext;
  playCtx=playCtx||new AC();
  var b=playCtx.createBuffer(1,total,SR);
  var d=b.getChannelData(0), o=0;
  chunks.forEach(function(c){ d.set(c,o); o+=c.length; });
  return b;
}
var lastBuf=null;
function snapshot(){ lastBuf=buildBuffer(); return lastBuf; }
function play(onEnd){
  var b=lastBuf||buildBuffer();
  if(!b) { if(onEnd) onEnd(); return null; }
  try{ if(playSrc) playSrc.stop(); }catch(e){}
  playSrc=playCtx.createBufferSource();
  playSrc.buffer=b; playSrc.connect(playCtx.destination);
  playSrc.onended=function(){ if(onEnd) onEnd(); };
  if(playCtx.state==='suspended') playCtx.resume();
  playSrc.start();
  return b.duration;
}
function stopPlay(){ try{ if(playSrc) playSrc.stop(); }catch(e){} }
function waveform(nPoints){
  var b=lastBuf||buildBuffer();
  if(!b) return [];
  var d=b.getChannelData(0), step=Math.max(1,Math.floor(d.length/nPoints)), out=[];
  for(var i=0;i<nPoints;i++){
    var m=0, s=i*step, e=Math.min(d.length,s+step);
    for(var j=s;j<e;j++){ var v=Math.abs(d[j]); if(v>m) m=v; }
    out.push(m);
  }
  return out;
}
function hasRecording(){ return !!(lastBuf||chunks.length); }

/* export as wav */
function exportWav(){
  var b=lastBuf||buildBuffer();
  if(!b) return null;
  var d=b.getChannelData(0), len=d.length;
  var buf=new ArrayBuffer(44+len*2), view=new DataView(buf);
  function ws(o,s){ for(var i=0;i<s.length;i++) view.setUint8(o+i,s.charCodeAt(i)); }
  ws(0,'RIFF'); view.setUint32(4,36+len*2,true); ws(8,'WAVE'); ws(12,'fmt ');
  view.setUint32(16,16,true); view.setUint16(20,1,true); view.setUint16(22,1,true);
  view.setUint32(24,SR,true); view.setUint32(28,SR*2,true); view.setUint16(32,2,true);
  view.setUint16(34,16,true); ws(36,'data'); view.setUint32(40,len*2,true);
  for(var i=0;i<len;i++){ var s=clamp(d[i],-1,1); view.setInt16(44+i*2, s<0?s*0x8000:s*0x7FFF, true); }
  return new Blob([view],{type:'audio/wav'});
}

/* ---------- events ---------- */
function on(fn){ listeners.push(fn); }
function emit(){ listeners.forEach(function(f){ try{f(micState,lastErr);}catch(e){} }); }

return {
  start:start, stop:stop, ready:ready, state:state, error:error, on:on,
  beginCapture:beginCapture, endCapture:endCapture, isCapturing:isCapturing,
  live:live, liveFrames:liveFrames, analyse:analyse,
  setProfile:setProfile, getProfile:getProfile, bounds:bounds,
  analyseNoise:analyseNoise, analyseSustain:analyseSustain, analyseGlide:analyseGlide,
  analyseSibilants:analyseSibilants, analyseNatural:analyseNatural,
  personalBands:personalBands, vsBaseline:vsBaseline, cog:cog,
  wpm:wpm, scoreAgainstTone:scoreAgainstTone, scoreTerminal:scoreTerminal,
  scorePace:scorePace, scoreRange:scoreRange, scoreFloor:scoreFloor, scorePauses:scorePauses,
  contourTrace:contourTrace, scoreContour:scoreContour,
  snapshot:snapshot, play:play, stopPlay:stopPlay, waveform:waveform, hasRecording:hasRecording,
  exportWav:exportWav, hzToSt:hzToSt, pct:pct, median:median, mean:mean
};
})();
</script>

<script>
/* ============================================================
   CLOUD — Supabase auth, sync and telemetry.

   Local-first by design. The app works completely without an
   account and completely offline; the cloud is additive. If the
   CDN is blocked, the network is down, or the config is blank,
   everything degrades to exactly the previous behaviour.

   NEVER uploads audio. Derived numbers only.
   ============================================================ */
'use strict';

var CLOUD_CONFIG = {
  url: 'https://pbppdiytunqhbouyreek.supabase.co',
  key: 'sb_publishable_JldfAxoUGGHON5PXY7e20w_SmCAT1_f'
};

var Cloud = (function(){

var sb=null, ready=false, booting=null;
var user=null, profile=null;
var listeners=[];
var queue=[];              // telemetry waiting to flush
var pushTimer=null, flushTimer=null;
var sessionStart=Date.now(), activeMs=0, lastTick=Date.now(), focused=true;

function on(fn){ listeners.push(fn); }
function emit(){ listeners.forEach(function(f){ try{f();}catch(e){} }); }

function configured(){ return !!(CLOUD_CONFIG.url && CLOUD_CONFIG.key); }

/* ---------- boot ---------- */
function boot(){
  if(booting) return booting;
  if(!configured()) return Promise.resolve(false);
  booting = import('https://esm.sh/@supabase/supabase-js@2').then(function(m){
    sb = m.createClient(CLOUD_CONFIG.url, CLOUD_CONFIG.key, {
      auth:{persistSession:true, autoRefreshToken:true, detectSessionInUrl:false}
    });
    return sb.auth.getSession();
  }).then(function(res){
    ready = true;
    var s = res && res.data && res.data.session;
    if(s && s.user){ user = s.user; return loadProfile().then(pullAll); }
  }).then(function(){
    if(sb) sb.auth.onAuthStateChange(function(evt, sess){
      if(evt==='SIGNED_OUT'){ user=null; profile=null; emit(); }
    });
    emit();
    return true;
  }).catch(function(e){
    ready=false;
    console.warn('[cloud] unavailable —', e && e.message);
    return false;
  });
  return booting;
}

/* ---------- auth ---------- */
function signUp(f){
  // f: {email, pin, username, fullName, phone}
  if(!ready) return Promise.reject(new Error('Cloud not ready'));
  if(!/^\d{6}$/.test(f.pin)) return Promise.reject(new Error('PIN must be exactly 6 digits'));
  return sb.auth.signUp({
    email: f.email.trim(),
    password: f.pin,
    options:{ data:{
      username: (f.username||'').trim(),
      full_name: (f.fullName||'').trim(),
      phone: (f.phone||'').trim(),
      org: 'sprk'
    }}
  }).then(function(r){
    if(r.error) throw r.error;
    user = r.data.user;
    if(!r.data.session){
      // shouldn't happen with confirm-email off, but handle it
      return signIn(f.email, f.pin);
    }
    return loadProfile().then(function(){ return pushAll(true); });
  }).then(function(){ emit(); return true; });
}

function signIn(email, pin){
  if(!ready) return Promise.reject(new Error('Cloud not ready'));
  return sb.auth.signInWithPassword({email:email.trim(), password:pin}).then(function(r){
    if(r.error) throw r.error;
    user = r.data.user;
    return loadProfile().then(pullAll);
  }).then(function(){ emit(); return true; });
}

function signOut(){
  if(!ready) return Promise.resolve();
  return pushAll(true).catch(function(){}).then(function(){
    return sb.auth.signOut();
  }).then(function(){ user=null; profile=null; emit(); });
}

function loadProfile(){
  if(!user) return Promise.resolve(null);
  return sb.from('profiles').select('*').eq('id', user.id).maybeSingle().then(function(r){
    profile = r.data || null;
    if(profile) sb.from('profiles').update({last_seen:new Date().toISOString()}).eq('id',user.id).then(function(){});
    return profile;
  });
}

function signedIn(){ return !!user; }
function isAdmin(){ return !!(profile && profile.role==='admin'); }
function me(){ return {user:user, profile:profile}; }

/* ---------- sync ---------- */
function pullAll(){
  if(!user) return Promise.resolve();
  return Promise.all([
    sb.from('progress').select('payload,updated_at').eq('user_id',user.id).maybeSingle(),
    sb.from('voice_profiles').select('payload').eq('user_id',user.id).maybeSingle()
  ]).then(function(res){
    var p = res[0] && res[0].data, v = res[1] && res[1].data;
    var local = S.raw();
    if(p && p.payload && Object.keys(p.payload).length){
      var remote = p.payload;
      // remote wins only if it is genuinely further along — protects a
      // fresh browser from wiping a phone's progress and vice versa
      if((remote.reps||0) >= (local.reps||0)) S.mergeRemote(remote);
    }
    if(v && v.payload && v.payload.done && !(local.profile && local.profile.done)){
      S.raw().profile = v.payload; Audio.setProfile(v.payload); S.save();
    }
    if(window.UI) UI.render();
  }).catch(function(e){ console.warn('[cloud] pull failed', e && e.message); });
}

function pushAll(immediate){
  if(!user || !ready) return Promise.resolve();
  if(!immediate){
    clearTimeout(pushTimer);
    return new Promise(function(res){ pushTimer=setTimeout(function(){ pushAll(true).then(res); }, 4000); });
  }
  var s = S.raw(), lp = S.levelProgress();
  var payload = JSON.parse(JSON.stringify(s));
  delete payload.advisorMisses;   // those go to their own table
  payload.secondsActive = Math.round(totalSeconds());

  var jobs = [
    sb.from('progress').upsert({
      user_id:user.id, payload:payload, xp:s.xp|0, level:lp.lvl|0,
      reps:s.reps|0, streak:s.streak|0, updated_at:new Date().toISOString()
    }, {onConflict:'user_id'})
  ];
  if(s.profile && s.profile.done){
    var vp=s.profile;
    jobs.push(sb.from('voice_profiles').upsert({
      user_id:user.id, payload:vp,
      modal_hz:vp.modalHz||null, low_hz:vp.lowHz||null, high_hz:vp.highHz||null,
      flat_span: vp.flat?vp.flat.span:null,
      nat_span:  vp.natural?vp.natural.span:null,
      ceil_span: vp.expressive?vp.expressive.span:null,
      updated_at:new Date().toISOString()
    }, {onConflict:'user_id'}));
  }
  return Promise.all(jobs).catch(function(e){ console.warn('[cloud] push failed', e && e.message); });
}

/* ---------- telemetry ---------- */
function log(table, row){
  if(!configured()) return;
  queue.push({t:table, r:row});
  if(queue.length>400) queue.shift();
  clearTimeout(flushTimer);
  flushTimer=setTimeout(flush, 2500);
}
function flush(){
  if(!ready || !user || !queue.length) return Promise.resolve();
  var batch=queue.splice(0, queue.length);
  var byTable={};
  batch.forEach(function(x){
    (byTable[x.t]=byTable[x.t]||[]).push(Object.assign({user_id:user.id}, x.r));
  });
  return Promise.all(Object.keys(byTable).map(function(t){
    return sb.from(t).insert(byTable[t]);
  })).catch(function(e){
    console.warn('[cloud] telemetry flush failed', e && e.message);
    queue = batch.concat(queue);   // put it back, try again later
  });
}

function logRep(o){
  log('reps', {
    tone:o.tone||null, drill:o.drill||null, score:o.score==null?null:Math.round(o.score),
    wpm:num(o.wpm), span:num(o.span), term:num(o.term), dyn:num(o.dyn),
    pause_frac:num(o.pauseFrac), floor_drop:num(o.floorDrop), fry_pct:num(o.fryPct),
    base_hz:num(o.baseHz), personalised: !!o.personalised
  });
}
function logFairness(o){
  log('fairness_flags', {
    verdict:o.verdict, tone:o.tone||null, score:o.score==null?null:Math.round(o.score),
    acoustics:o.acoustics||null, note:o.note||null
  });
}
function logAdvisorMiss(o){
  log('advisor_misses', {
    stage:o.stage||null, line:(o.line||'').slice(0,600),
    mods:o.mods||[], recommended:o.recommended||null, expected:o.expected||null
  });
}
function logFeedback(o){
  log('feedback', {page:o.page||null, message:(o.message||'').slice(0,4000), context:o.context||null});
  return flush();
}
function num(v){ return (v==null||isNaN(v))?null:Math.round(v*100)/100; }

/* ---------- time on task ---------- */
function tick(){
  var now=Date.now();
  if(focused && now-lastTick < 65000) activeMs += now-lastTick;
  lastTick=now;
}
function totalSeconds(){
  tick();
  return (S.raw().secondsActive||0) + activeMs/1000;
}
setInterval(function(){
  tick();
  if(activeMs > 30000){
    S.raw().secondsActive = Math.round((S.raw().secondsActive||0) + activeMs/1000);
    activeMs = 0; S.save();
    if(user) pushAll();
  }
}, 30000);
document.addEventListener('visibilitychange', function(){
  tick(); focused = !document.hidden; lastTick=Date.now();
});
window.addEventListener('beforeunload', function(){
  tick();
  S.raw().secondsActive = Math.round((S.raw().secondsActive||0) + activeMs/1000);
  S.save();
});

/* ---------- admin ---------- */
function team(){
  if(!ready || !isAdmin()) return Promise.resolve(null);
  return Promise.all([
    sb.from('team_overview').select('*').order('reps', {ascending:false}),
    sb.from('team_weak_tones').select('*'),
    sb.from('fairness_flags').select('*').order('created_at',{ascending:false}).limit(60),
    sb.from('advisor_misses').select('*').order('created_at',{ascending:false}).limit(60),
    sb.from('feedback').select('*').order('created_at',{ascending:false}).limit(60),
    sb.from('reps').select('user_id,tone,score,created_at,drill').order('created_at',{ascending:false}).limit(800)
  ]).then(function(r){
    return {
      people:  r[0].data||[], weak: r[1].data||[],
      fairness:r[2].data||[], misses:r[3].data||[],
      feedback:r[4].data||[], reps:r[5].data||[]
    };
  }).catch(function(e){ console.warn('[cloud] team fetch failed', e && e.message); return null; });
}

return {
  boot:boot, configured:configured, isReady:function(){return ready;},
  signUp:signUp, signIn:signIn, signOut:signOut,
  signedIn:signedIn, isAdmin:isAdmin, me:me, on:on,
  pushAll:pushAll, pullAll:pullAll, flush:flush,
  logRep:logRep, logFairness:logFairness, logAdvisorMiss:logAdvisorMiss, logFeedback:logFeedback,
  totalSeconds:totalSeconds, team:team
};
})();
</script>

<script>
/* ============================================================
   STATE — persistence, XP, mastery, streaks, spaced repetition
   ============================================================ */
'use strict';

var Store = (function(){
  var KEY='tonalitygym.v1';
  var mem={};
  var ok=(function(){ try{ var k='__t'; localStorage.setItem(k,'1'); localStorage.removeItem(k); return true; }catch(e){ return false; } })();
  return {
    get:function(){
      if(!ok) return mem[KEY]||null;
      try{ var v=localStorage.getItem(KEY); return v?JSON.parse(v):null; }catch(e){ return null; }
    },
    set:function(v){
      if(!ok){ mem[KEY]=v; return; }
      try{ localStorage.setItem(KEY, JSON.stringify(v)); }catch(e){}
    },
    clear:function(){ if(!ok){ mem={}; return; } try{ localStorage.removeItem(KEY); }catch(e){} },
    available:ok
  };
})();

var S = (function(){
  var def={
    v:1, xp:0, reps:0, scored:0, sessions:0,
    mastery:{},        // toneId -> {m:0-100, n:reps, last:ts, best:0}
    twisters:{},       // twisterId -> {cleared:bool, bpm:n, reps:n}
    codexRead:{}, powerRead:{},
    ach:{}, day:1, dayDone:{},
    streak:0, lastDay:null, bestStreak:0,
    hist:[],           // {ts, tone, score, wpm, span, term}
    prefs:{theme:'dark', ref:'auto', voice:'unset', hardMode:false, autoNext:true, showNums:true,
           personalTargets:false, demoUnlock:false},
    counters:{warmups:0, perfect:0, floorStreak:0, twCleared:0, gauntlets:0, gauntletBest:0, scripts:0},
    /* voice profile from calibration — see Audio.setProfile */
    profile:{done:false, at:null, noiseDb:null, modalHz:null, mpt:null, steadiness:null,
             lowHz:null, highHz:null, semitones:null,
             sibilant:null,   // {sHz, shHz, ratio, flag}
             natural:null,    // {wpm, span, term, dyn, pauseFrac, floorDrop, baseHz}
             history:[]},     // past calibrations, for drift
    scenarios:[], advisorMisses:[],
    secondsActive:0,
    firstSeen:null
  };
  var s = Store.get() || JSON.parse(JSON.stringify(def));
  // migrate missing keys
  (function fill(t,d){ for(var k in d){ if(!(k in t)) t[k]=JSON.parse(JSON.stringify(d[k]));
    else if(d[k] && typeof d[k]==='object' && !Array.isArray(d[k])) fill(t[k],d[k]); } })(s,def);
  if(!s.firstSeen) s.firstSeen=Date.now();
  // hand the saved voice profile to the audio engine before anything records
  if(s.profile && s.profile.done) Audio.setProfile(s.profile);

  function save(){ Store.set(s); }
  function today(){ var d=new Date(); return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); }
  function dayDiff(a,b){
    if(!a) return 99;
    var pa=a.split('-').map(Number), pb=b.split('-').map(Number);
    var da=new Date(pa[0],pa[1]-1,pa[2]), db=new Date(pb[0],pb[1]-1,pb[2]);
    return Math.round((db-da)/86400000);
  }

  function touchDay(){
    var t=today();
    if(s.lastDay===t) return;
    var d=dayDiff(s.lastDay,t);
    if(d===1) s.streak++;
    else if(d>1||d===99) s.streak=1;
    s.lastDay=t; s.sessions++;
    if(s.streak>s.bestStreak) s.bestStreak=s.streak;
    checkAch(); save();
  }

  function level(){
    var l=1; while(l<50 && s.xp>=cumXp(l+1)) l++;
    return l;
  }
  function cumXp(l){ var t=0; for(var i=1;i<l;i++) t+=xpForLevel(i); return t; }
  function levelProgress(){
    var l=level(), a=cumXp(l), b=cumXp(l+1);
    return {lvl:l, rank:rankFor(l), cur:s.xp-a, need:b-a, pct: b>a ? (s.xp-a)/(b-a)*100 : 100, total:s.xp};
  }

  function addXp(n, why){
    s.xp+=n; touchDay(); checkAch(); save();
    if(window.UI && UI.toast) UI.toast('<b>+'+n+' XP</b> · '+(why||''), 'xp');
    if(window.UI && UI.paintHud) UI.paintHud();
  }

  /* mastery with decay: loses 1 point per day after 3 days idle */
  function masteryOf(id){
    var m=s.mastery[id];
    if(!m) return 0;
    var days=Math.floor((Date.now()-(m.last||Date.now()))/86400000);
    var decay=Math.max(0, days-3);
    return Math.max(0, Math.round(m.m - decay));
  }
  function rawMastery(id){ return s.mastery[id] ? s.mastery[id].m : 0; }

  function recordRep(toneId, score, extra){
    touchDay();
    s.reps++;
    var m=s.mastery[toneId] || (s.mastery[toneId]={m:0,n:0,last:0,best:0});
    if(score!=null){
      s.scored++;
      // exponential moving toward the score, weighted by how many reps done
      var w = m.n<3 ? 0.45 : m.n<8 ? 0.3 : 0.18;
      var base=masteryOf(toneId);
      m.m = Math.round(clamp01(base + (score-base)*w));
      if(score>m.best) m.best=score;
      s.hist.push({ts:Date.now(), tone:toneId, score:score,
        wpm: extra&&extra.wpm?Math.round(extra.wpm):null,
        span: extra&&extra.span!=null?+extra.span.toFixed(1):null,
        term: extra&&extra.term!=null?+extra.term.toFixed(1):null,
        baseHz: extra&&extra.baseHz?Math.round(extra.baseHz):null});
      if(s.hist.length>900) s.hist=s.hist.slice(-900);
      if(score>=95){ s.counters.perfect++; }
      if(extra && extra.floorDrop!=null){
        if(extra.floorDrop<4) s.counters.floorStreak++; else s.counters.floorStreak=0;
      }
    }
    m.n++; m.last=Date.now();
    var xp = score==null ? 6 : Math.max(5, Math.round(score/6) + (score>=90?12:score>=75?6:0));
    s.xp+=xp;
    checkAch(); save();
    // mirror to the cloud if signed in — derived numbers only, never audio
    if(window.Cloud && Cloud.signedIn && Cloud.signedIn()){
      Cloud.logRep({tone:toneId, drill:(extra&&extra.drill)||null, score:score,
        wpm:extra&&extra.wpm, span:extra&&extra.span, term:extra&&extra.term,
        dyn:extra&&extra.dyn, pauseFrac:extra&&extra.pauseFrac,
        floorDrop:extra&&extra.floorDrop, fryPct:extra&&extra.fryPct,
        baseHz:extra&&extra.baseHz, personalised:s.prefs.personalTargets});
      Cloud.pushAll();
    }
    if(window.UI && UI.paintHud) UI.paintHud();
    return xp;
  }
  function clamp01(v){ return v<0?0:v>100?100:v; }

  /* spaced repetition queue: weakest & stalest first, unlocked only */
  function weakQueue(n, filterFam){
    var lvl=level();
    var pool=TONES.filter(function(t){
      if(t.fam==='defect') return false;
      if(filterFam && t.fam!==filterFam) return false;
      return tierUnlocked(t.tier);
    });
    var scored=pool.map(function(t){
      var m=s.mastery[t.id];
      var mast=masteryOf(t.id);
      var days = m ? (Date.now()-(m.last||0))/86400000 : 999;
      var urgency = (100-mast)*1.0 + Math.min(60, days*4) + (m?0:35);
      return {t:t, u:urgency, m:mast};
    });
    scored.sort(function(a,b){ return b.u-a.u; });
    return scored.slice(0, n||8).map(function(x){ return x.t; });
  }

  function tierUnlocked(tier){
    if(s.prefs.demoUnlock) return true;      /* admin demo mode — every tier open */
    var l=level();
    return tier<=1 || (tier===2 && l>=4) || (tier===3 && l>=9) || (tier===4 && l>=16);
  }

  /* --- admin demo helpers ------------------------------------------------
     Level gating is a UX pacing device, not a security boundary — what
     actually protects data is row-level security in Postgres. So setting
     your own level locally is harmless. It still only appears for admins. */
  function setLevel(target){
    target=Math.max(1, Math.min(50, Math.round(target||1)));
    s.xp = cumXp(target);
    checkAch(); save();
    if(window.UI && UI.paintHud) UI.paintHud();
    return level();
  }
  function setDemoUnlock(on){ s.prefs.demoUnlock=!!on; save(); }
  function tierNeed(tier){ return tier<=1?1:tier===2?4:tier===3?9:16; }

  /* achievements */
  function grant(id){
    if(s.ach[id]) return false;
    s.ach[id]=Date.now();
    var a=ACHIEVEMENTS.filter(function(x){return x.id===id;})[0];
    if(a && window.UI && UI.toast) UI.toast(a.i+' <b>'+a.n+'</b> unlocked', 'xp');
    s.xp+=45;
    return true;
  }
  function checkAch(){
    var c=s.counters;
    if(s.scored>=1) grant('first');
    if(c.warmups>=10) grant('warm10');
    if(s.streak>=3) grant('streak3');
    if(s.streak>=7) grant('streak7');
    if(s.streak>=30) grant('streak30');
    if(s.reps>=100) grant('reps100');
    if(s.reps>=500) grant('reps500');
    if(s.reps>=2000) grant('reps2000');
    if(c.perfect>=1) grant('perf');
    if(c.perfect>=5) grant('perf5');
    if(c.floorStreak>=10) grant('floor');
    if(c.twCleared>=25) grant('tw25');
    if(c.twCleared>=100) grant('tw100');
    if(c.gauntlets>=1) grant('gaunt');
    if(c.gauntletBest>=85) grant('gaunt90');
    if(c.scripts>=1) grant('script');
    var core=['neutral','concern','challenge','skeptic','vision','consequence','certainty'];
    if(core.every(function(id){ return masteryOf(id)>=70; })) grant('seven');
    var fams={}; Object.keys(s.mastery).forEach(function(id){ if(TONE_BY_ID[id]) fams[TONE_BY_ID[id].fam]=1; });
    if(Object.keys(fams).length>=9) grant('allfam');
    if(CODEX.every(function(x){ return s.codexRead[x.id]; })) grant('codex');
    if(Object.keys(s.powerRead).length>=PRINCIPLES.length) grant('power');
    if(s.dayDone[30]) grant('day30');
    if(s.dayDone[90]) grant('day90');
  }
  function noteMetric(k,v){
    if(k==='span' && v>=10) grant('mono');
    if(k==='term' && v<=-7) grant('fall');
    if(k==='pause' && v>=2) grant('silence');
    if(k==='brutal') grant('brutal');
    save();
  }

  function stats(){
    var h=s.hist;
    var last20=h.slice(-20), last100=h.slice(-100);
    function avg(a,f){ var v=a.map(f).filter(function(x){return x!=null;}); return v.length? v.reduce(function(p,c){return p+c;},0)/v.length : null; }
    var masteries=TONES.filter(function(t){return t.fam!=='defect';}).map(function(t){ return masteryOf(t.id); });
    return {
      avgRecent: avg(last20,function(x){return x.score;}),
      avg100: avg(last100,function(x){return x.score;}),
      avgWpm: avg(last100,function(x){return x.wpm;}),
      avgSpan: avg(last100,function(x){return x.span;}),
      avgTerm: avg(last100,function(x){return x.term;}),
      overall: masteries.length ? masteries.reduce(function(a,b){return a+b;},0)/masteries.length : 0,
      covered: Object.keys(s.mastery).length,
      total: TONES.length
    };
  }

  /* ---------- voice profile ---------- */
  function saveProfile(p){
    var old=s.profile;
    if(old && old.done){
      s.profile.history = (old.history||[]).concat([{
        at:old.at, modalHz:old.modalHz, lowHz:old.lowHz, highHz:old.highHz,
        mpt:old.mpt, natural:old.natural, sibilant:old.sibilant
      }]).slice(-8);
    }
    var hist=s.profile.history||[];
    s.profile=Object.assign({}, s.profile, p, {done:true, at:Date.now(), history:hist});
    Audio.setProfile(s.profile);
    save();
    return s.profile;
  }
  function profile(){ return s.profile && s.profile.done ? s.profile : null; }
  function clearProfile(){
    s.profile={done:false, at:null, noiseDb:null, modalHz:null, mpt:null, steadiness:null,
               lowHz:null, highHz:null, semitones:null, sibilant:null, natural:null,
               history:s.profile.history||[]};
    Audio.setProfile(null); save();
  }
  /* has their voice drifted far enough from the profile to be worth re-running? */
  function profileDrift(){
    var p=profile(); if(!p || !p.modalHz) return null;
    var recent=s.hist.slice(-15).filter(function(h){ return h.baseHz; });
    if(recent.length<8) return null;
    var med=recent.map(function(h){return h.baseHz;}).sort(function(a,b){return a-b;})[Math.floor(recent.length/2)];
    var st=12*Math.log2(med/p.modalHz);
    return Math.abs(st) > 3.5 ? {st:+st.toFixed(1), measured:Math.round(med), profile:Math.round(p.modalHz)} : null;
  }

  /* merge a remote snapshot in, keeping whichever side is further along
     on each counter so signing in on a second device never loses work */
  function mergeRemote(r){
    if(!r || typeof r!=='object') return;
    ['xp','reps','scored','sessions','streak','bestStreak','day','secondsActive'].forEach(function(k){
      if(typeof r[k]==='number') s[k]=Math.max(s[k]||0, r[k]);
    });
    ['mastery','twisters','codexRead','powerRead','ach','dayDone'].forEach(function(k){
      if(r[k] && typeof r[k]==='object'){
        s[k]=s[k]||{};
        Object.keys(r[k]).forEach(function(id){
          var a=s[k][id], b=r[k][id];
          if(a==null){ s[k][id]=b; return; }
          if(typeof a==='number' && typeof b==='number'){ s[k][id]=Math.max(a,b); return; }
          if(typeof a==='object' && typeof b==='object'){
            s[k][id]=Object.assign({}, b, a);
            if(b.m!=null && a.m!=null) s[k][id].m=Math.max(a.m,b.m);
            if(b.n!=null && a.n!=null) s[k][id].n=Math.max(a.n,b.n);
            if(b.best!=null && a.best!=null) s[k][id].best=Math.max(a.best,b.best);
            if(b.last!=null && a.last!=null) s[k][id].last=Math.max(a.last,b.last);
          }
        });
      }
    });
    if(Array.isArray(r.hist) && r.hist.length > (s.hist||[]).length) s.hist=r.hist.slice(-900);
    if(Array.isArray(r.scenarios) && r.scenarios.length > (s.scenarios||[]).length) s.scenarios=r.scenarios;
    if(r.profile && r.profile.done && !(s.profile && s.profile.done)){
      s.profile=r.profile; if(window.Audio && Audio.setProfile) Audio.setProfile(r.profile);
    }
    if(r.prefs) s.prefs=Object.assign({}, r.prefs, s.prefs);
    save();
  }

  function reset(){ Store.clear(); location.reload(); }
  function exportJson(){ return JSON.stringify(s,null,2); }
  function importJson(txt){
    try{ var o=JSON.parse(txt); if(!o||typeof o!=='object') throw 0;
      Store.set(o); location.reload(); return true; }catch(e){ return false; }
  }

  return {
    raw:function(){return s;}, save:save, level:level, levelProgress:levelProgress,
    addXp:addXp, recordRep:recordRep, masteryOf:masteryOf, rawMastery:rawMastery,
    saveProfile:saveProfile, profile:profile, clearProfile:clearProfile, profileDrift:profileDrift,
    mergeRemote:mergeRemote,
    weakQueue:weakQueue, tierUnlocked:tierUnlocked, tierNeed:tierNeed,
    setLevel:setLevel, setDemoUnlock:setDemoUnlock,
    grant:grant, checkAch:checkAch, noteMetric:noteMetric, stats:stats, touchDay:touchDay,
    reset:reset, exportJson:exportJson, importJson:importJson, today:today
  };
})();
</script>

<script>

var UI = (function(){

/* ---------- tiny helpers ---------- */
function $(s,r){ return (r||document).querySelector(s); }
function $$(s,r){ return Array.prototype.slice.call((r||document).querySelectorAll(s)); }
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function el(h){ var d=document.createElement('div'); d.innerHTML=h.trim(); return d.firstChild; }
function rnd(a){ return a[Math.floor(Math.random()*a.length)]; }
function shuffle(a){ var b=a.slice(); for(var i=b.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=b[i]; b[i]=b[j]; b[j]=t; } return b; }
function words(s){ return String(s).replace(/[⟨⟩]/g,' ').split(/\s+/).filter(function(w){ return /[a-z0-9]/i.test(w); }).length; }
function fmtT(s){ s=Math.max(0,Math.floor(s)); return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); }
function md(s){

    .replace(/\*\*(.+?)\*\*/g,'<b>$1</b>')

    .replace(/\n/g,'<br>');
}

/* ---------- toasts ---------- */

{g:'Train'},

{g:'Study'},

];

/* ---------- canvas: live scope ---------- */
function LiveScope(canvas, opts){
  opts=opts||{};
  var ctx2=canvas.getContext('2d'), raf=null;
  var hist=[], MAX=opts.max||260;
  var dpr=Math.min(2,window.devicePixelRatio||1);
  function size(){
    var r=canvas.getBoundingClientRect();
    canvas.width=Math.max(2,r.width*dpr); canvas.height=Math.max(2,r.height*dpr);
  }
  size();
  var ro = window.ResizeObserver ? new ResizeObserver(size) : null;
  if(ro) ro.observe(canvas);

  function cssv(n){ return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }

  function draw(){
    var L=Audio.live();
    var base=opts.baseline || null;
    hist.push({f0:L.f0, db:L.db});
    if(hist.length>MAX) hist.shift();

    var W=canvas.width, H=canvas.height;
    ctx2.clearRect(0,0,W,H);

    // grid
    ctx2.strokeStyle=cssv('--line'); ctx2.lineWidth=1*dpr;
    for(var i=1;i<4;i++){ var y=H*i/4; ctx2.beginPath(); ctx2.moveTo(0,y); ctx2.lineTo(W,y); ctx2.stroke(); }

    // reference baseline
    var voiced=hist.filter(function(h){return h.f0>0;}).map(function(h){return h.f0;});
    var ref = base || (voiced.length>5 ? Audio.median(voiced) : 0);

    if(ref>0){
      ctx2.strokeStyle=cssv('--acc-line'); ctx2.setLineDash([4*dpr,4*dpr]);
      ctx2.beginPath(); ctx2.moveTo(0,H/2); ctx2.lineTo(W,H/2); ctx2.stroke(); ctx2.setLineDash([]);
    }

    // rms band
    ctx2.fillStyle=cssv('--cy-wash');
    ctx2.beginPath(); ctx2.moveTo(0,H);
    for(var j=0;j<hist.length;j++){
      var x=j/(MAX-1)*W;
      var amp=Math.max(0, Math.min(1,(hist[j].db+62)/56));
      ctx2.lineTo(x, H-amp*H*0.34);
    }
    ctx2.lineTo(W,H); ctx2.closePath(); ctx2.fill();

    // pitch trace
    if(ref>0){
      ctx2.strokeStyle=cssv('--acc'); ctx2.lineWidth=2.4*dpr; ctx2.lineJoin='round'; ctx2.lineCap='round';
      var span=opts.span||14; // semitones top-to-bottom
      var started=false;
      ctx2.beginPath();
      for(j=0;j<hist.length;j++){
        var x2=j/(MAX-1)*W;
        if(hist[j].f0>0){
          var st=12*Math.log2(hist[j].f0/ref);
          var y2=H/2 - (st/span)*H;
          y2=Math.max(3*dpr,Math.min(H-3*dpr,y2));
          if(!started){ ctx2.moveTo(x2,y2); started=true; } else ctx2.lineTo(x2,y2);
        } else { started=false; }
      }
      ctx2.stroke();
    }
    raf=requestAnimationFrame(draw);
  }
  draw();
  return {stop:function(){ if(raf) cancelAnimationFrame(raf); if(ro) ro.disconnect(); }, clear:function(){hist=[];}};
}

/* ---------- canvas: static contour plot ---------- */
function drawContour(canvas, target, trace, opts){
  opts=opts||{};
  var dpr=Math.min(2,window.devicePixelRatio||1);
  var r=canvas.getBoundingClientRect();
  canvas.width=Math.max(2,r.width*dpr); canvas.height=Math.max(2,(opts.h||190)*dpr);
  canvas.style.height=(opts.h||190)+'px';
  var c=canvas.getContext('2d'), W=canvas.width, H=canvas.height;
  function cssv(n){ return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
  c.clearRect(0,0,W,H);

  var span=opts.span||16, pad=14*dpr;
  function Y(st){ return H/2 - (st/span)*(H-pad*2); }
  function X(t){ return pad + t*(W-pad*2); }

  c.strokeStyle=cssv('--line'); c.lineWidth=1*dpr;
  [-6,-3,0,3,6].forEach(function(st){
    c.beginPath(); c.moveTo(0,Y(st)); c.lineTo(W,Y(st)); c.stroke();
    c.fillStyle=cssv('--faint'); c.font=(9*dpr)+'px ui-monospace,monospace';
    c.fillText((st>0?'+':'')+st, 3*dpr, Y(st)-3*dpr);
  });
  c.strokeStyle=cssv('--line2'); c.beginPath(); c.moveTo(0,Y(0)); c.lineTo(W,Y(0)); c.stroke();

  function path(pts, colour, width, dash){
    if(!pts||pts.length<2) return;
    c.strokeStyle=colour; c.lineWidth=width*dpr; c.lineJoin='round'; c.lineCap='round';
    if(dash) c.setLineDash(dash.map(function(d){return d*dpr;})); else c.setLineDash([]);
    c.beginPath();
    pts.forEach(function(p,i){ var x=X(p[0]), y=Math.max(4*dpr,Math.min(H-4*dpr,Y(p[1])));
      if(i===0) c.moveTo(x,y); else c.lineTo(x,y); });
    c.stroke(); c.setLineDash([]);
  }
  path(target, cssv('--muted'), 2.6, [6,5]);
  if(trace && trace.length) path(trace, cssv('--acc'), 3);
}

/* ---------- canvas: waveform ---------- */
function drawWave(canvas, data, progress){
  var dpr=Math.min(2,window.devicePixelRatio||1);
  var r=canvas.getBoundingClientRect();
  canvas.width=Math.max(2,r.width*dpr); canvas.height=Math.max(2,r.height*dpr);
  var c=canvas.getContext('2d'), W=canvas.width, H=canvas.height;
  function cssv(n){ return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
  c.clearRect(0,0,W,H);
  if(!data.length) return;
  var bw=W/data.length, mx=Math.max.apply(null,data)||1;
  data.forEach(function(v,i){
    var h=Math.max(1.5*dpr,(v/mx)*H*0.86);
    c.fillStyle = (progress!=null && i/data.length<=progress) ? cssv('--acc') : cssv('--hi');
    c.fillRect(i*bw, (H-h)/2, Math.max(1,bw-1*dpr), h);
  });
}

/* ---------- score ring ---------- */
function ring(score, label){
  var R=48, C=2*Math.PI*R, off=C*(1-Math.max(0,Math.min(100,score))/100);
  var col = score>=85?'var(--ok)' : score>=68?'var(--acc)' : score>=45?'var(--acc)' : 'var(--no)';
  return '<div class="ring"><svg width="112" height="112" viewBox="0 0 112 112">'+
    '<circle cx="56" cy="56" r="'+R+'" fill="none" stroke="var(--hi)" stroke-width="9"/>'+
    '<circle cx="56" cy="56" r="'+R+'" fill="none" stroke="'+col+'" stroke-width="9" stroke-linecap="round" '+
      'stroke-dasharray="'+C.toFixed(1)+'" stroke-dashoffset="'+off.toFixed(1)+'"/></svg>'+
    '<div class="txt"><div><b style="color:'+col+'">'+Math.round(score)+'</b><span>'+esc(label||'score')+'</span></div></div></div>';
}

function readouts(parts){
  return '<div class="readout">'+parts.map(function(p){
    var cls = p.s>=.78?'good' : p.s>=.5?'warn' : 'bad';
    return '<div class="ro '+cls+'"><p class="k">'+esc(p.k)+'</p>'+
      '<div class="v">'+esc(p.v)+'<span class="u">'+esc(p.u||'')+'</span></div>'+
      (p.band?'<p class="t">target '+p.band[0]+'–'+p.band[1]+'</p>':'')+'</div>';
  }).join('')+'</div>';
}

function faultList(faults, wins){
  var h='';
  if(faults && faults.length) h+=faults.map(function(f){
    return '<div class="fault '+(f.t==='warn'?'warn':'')+'"><span class="fi">'+(f.t==='warn'?'△':'✕')+'</span>'+
      '<div><b>'+esc(f.b)+'</b><span>'+esc(f.s)+'</span></div></div>'; }).join('');
  if(wins && wins.length) h+=wins.map(function(w){
    return '<div class="fault ok"><span class="fi">✓</span><div><span>'+esc(w)+'</span></div></div>'; }).join('');
  return h ? '<div class="faults">'+h+'</div>' : '';
}

var Drill = (function(){

var $=UI.$, esc=UI.esc, el=UI.el;
var stage=$('#stage');

var D = null; // active drill state
var scope=null, clockT=null, holdT=null;

/* ---------------- lifecycle ---------------- */
function open(name, total){
  D.name=name; D.total=total; D.i=0; D.t0=Date.now(); D.results=[];
  $('#stName').textContent=name;
  stage.classList.add('on');
  clearInterval(clockT);
  clockT=setInterval(function(){ $('#stClock').textContent=UI.fmtT((Date.now()-D.t0)/1000); },500);
  $('#stClock').textContent='0:00';
  paintTop();
}
function close(){
  stage.classList.remove('on');
  clearInterval(clockT); clearTimeout(holdT);
  if(scope){ scope.stop(); scope=null; }
  if(Audio.isCapturing()) Audio.endCapture();
  Audio.stopPlay();
  D=null;
  UI.render();
}
function paintTop(){
  if(!D) return;
  $('#stPos').textContent = D.total ? (Math.min(D.i+1,D.total)+' / '+D.total) : '';
  $('#stProg').style.width = D.total ? (D.i/D.total*100)+'%' : '0%';
}
function body(h){ $('#stBody').innerHTML=h; paintTop(); }
function hint(h){ $('#stHint').innerHTML=h||''; }
function foot(nextLabel, showPrev){
  $('#stNext').textContent=nextLabel||'Next →';
  $('#stPrev').style.display = showPrev===false ? 'none' : '';
}

$('#stExit').onclick=close;
$('#stRestart').onclick=function(){ if(D && D.restart) D.restart(); };
$('#stNext').onclick=function(){ if(D && D.next) D.next(); };
$('#stPrev').onclick=function(){ if(D && D.prev) D.prev(); };

document.addEventListener('keydown', function(e){
  if(!stage.classList.contains('on')) return;
  if(/input|textarea|select/i.test(e.target.tagName)) return;
  if(e.key==='Escape'){ e.preventDefault(); close(); }
  else if(e.key===' '){ e.preventDefault(); if(D&&D.space) D.space(); }
  else if(e.key==='ArrowRight'){ e.preventDefault(); if(D&&D.next) D.next(); }
  else if(e.key==='ArrowLeft'){ e.preventDefault(); if(D&&D.prev) D.prev(); }
  else if(e.key==='r'||e.key==='R'){ if(D&&D.redo) D.redo(); }
  else if(e.key==='p'||e.key==='P'){ if(Audio.hasRecording()) playback(); }
});

    if(b) b.textContent = L.f0>0 ? Math.round(L.f0)+' Hz' : '—';
    if(r) r.textContent = Audio.isCapturing() ? L.elapsed.toFixed(1)+'s' : '';
    if(lv){
      if(!lv.children.length){ for(var i=0;i<9;i++) lv.appendChild(document.createElement('i')); }
      var amp=Math.max(0,Math.min(1,(L.db+58)/50));
      for(var j=0;j<9;j++){
        var on = amp*9 > j;
        lv.children[j].style.height = (on? 6+j*1.9 : 2)+'px';
        lv.children[j].style.opacity = on? '1':'.22';
      }
    }
    levelRaf=requestAnimationFrame(tickNums);
  })();
}

function wireRecorder(onDone, opts){
  opts=opts||{};
  var rec=$('#recBtn'), play=$('#playBtn'), redo=$('#redoBtn');
  var recording=false;
  startScope(opts.baseline);

  function begin(){
    if(!Audio.ready()){ UI.needMic().then(function(ok){ if(ok){ startScope(opts.baseline); begin(); } }); return; }
    recording=true;
    Audio.beginCapture({spectra: !!opts.spectra});
    rec.textContent='■ Stop'; rec.classList.remove('sec');
    $('#ovLeft').textContent='recording';
    $('#recNote').textContent='';
    play.style.display='none'; redo.style.display='none';
    $('#result').innerHTML='';
    if(opts.maxSec) holdT=setTimeout(end, opts.maxSec*1000);
  }
  function end(){
    if(!recording) return;
    clearTimeout(holdT);
    recording=false;
    var a=Audio.endCapture();
    Audio.snapshot();
    rec.textContent='● Record';
    $('#ovLeft').textContent='done';
    play.style.display=''; redo.style.display='';
    if(!a || a.empty){
      $('#result').innerHTML='<div class="note no" style="margin-top:14px"><span class="l">Nothing detected</span>'+
        'No voiced speech was picked up. Check that the right microphone is selected, move closer, and speak at a normal conversational level.</div>';
      return;
    }
    onDone(a);
  }
  rec.onclick=function(){ recording?end():begin(); };
  play.onclick=playback;
  redo.onclick=function(){ $('#result').innerHTML=''; play.style.display='none'; redo.style.display='none'; begin(); };
  D.space=function(){ recording?end():begin(); };
  D.redo=function(){ if(!recording){ $('#result').innerHTML=''; begin(); } };
}

function playback(){
  var w=$('#playBtn'); if(!Audio.hasRecording()) return;
  if(w) w.textContent='▶ Playing…';
  Audio.play(function(){ if(w) w.textContent='▶ Playback'; });
}

/* ---------------- utility ---------------- */
/* "vs your baseline" strip — always shown when a profile exists, alongside
   the standard score rather than instead of it. Two honest numbers. */
/* "Was that score fair?" — the highest-value telemetry in the app.
   The audio engine was validated against synthetic signals, not real
   voices, so this is how a systematic misread on a particular kind of
   voice actually surfaces instead of quietly making someone give up. */
function fairnessStrip(tone, score, a){
  var id='fair'+Math.random().toString(36).slice(2,8);
  setTimeout(function(){
    var w=document.getElementById(id); if(!w) return;
    w.onclick=function(e){
      var b=e.target.closest('[data-fair]'); if(!b) return;
      var v=b.dataset.fair;
      if(window.Cloud && Cloud.signedIn()){
        Cloud.logFairness({verdict:v, tone:tone&&tone.id, score:score,
          acoustics:{wpm:a&&Math.round(a.dur*10)/10, span:a&&+a.span.toFixed(1), term:a&&+a.term.toFixed(1),
                     dyn:a&&+a.dyn.toFixed(1), floorDrop:a&&+a.floorDrop.toFixed(1),
                     baseHz:a&&Math.round(a.baseline), fryPct:a&&Math.round(a.fryPct)}});
      } else {
        var s=S.raw(); s.localFairness=(s.localFairness||[]).concat([{v:v,tone:tone&&tone.id,score:score,at:Date.now()}]).slice(-60); S.save();
      }
      w.innerHTML='<p class="tiny dim" style="margin:0">Logged — thank you. That is what makes the scoring better.</p>';
    };
  },0);
  return '<div id="'+id+'" style="margin-top:14px;padding-top:12px;border-top:1px solid var(--line);'+
    'display:flex;gap:9px;align-items:center;flex-wrap:wrap">'+
    '<span class="tiny dim">Was that score fair?</span>'+
    '<button class="btn gh sm" data-fair="about_right" style="padding:3px 10px;font-size:11.5px">Fair</button>'+
    '<button class="btn gh sm" data-fair="too_low" style="padding:3px 10px;font-size:11.5px">Too harsh</button>'+
    '<button class="btn gh sm" data-fair="too_high" style="padding:3px 10px;font-size:11.5px">Too generous</button>'+
    '</div>';
}

function baselineStrip(r){
  if(!r || !r.vsBase || !r.vsBase.length) return '';
  var hr=r.vsBase.headroom;
  var lbl = r.vsBase[0] && r.vsBase[0].ref==='flat' ? 'vs your flat — your own floor' : 'vs your calibration baseline';
  return '<div style="margin:12px 0 0">'+
    '<p class="lbl" style="margin-bottom:7px;color:var(--cy)">'+lbl+'</p>'+
    '<div class="readout">'+r.vsBase.map(function(x){
      var sign = x.d>0?'+':'';
      return '<div class="ro '+(x.good?'good':'')+'" style="'+(x.good?'':'opacity:.75')+'">'+
        '<p class="k">'+esc(x.k)+'</p>'+
        '<div class="v" style="font-size:17px">'+sign+x.d+'<span class="u">'+esc(x.u)+'</span></div>'+
        '<p class="t">'+(x.good?'above your flat':x.d<-0.4?'below it':'about the same')+'</p></div>';
    }).join('')+'</div>'+
    (hr? '<div style="margin-top:10px">'+
      '<div style="display:flex;justify-content:space-between;font-size:11.5px;margin-bottom:5px">'+
      '<span class="dim2">Range you deployed — of the '+hr.travel+' st you demonstrated on demand</span>'+
      '<span class="mono '+(hr.pct>=70?'':'dim')+'" style="color:'+(hr.pct>=70?'var(--ok)':hr.pct>=40?'var(--acc)':'var(--muted)')+'">'+hr.pct+'%</span></div>'+
      '<div class="meter '+(hr.pct>=70?'ok':'')+'"><i style="width:'+Math.min(100,hr.pct)+'%"></i></div>'+
      '<p class="tiny dim" style="margin:6px 0 0">Your flat sits at '+hr.flat+' st, your ceiling at '+hr.ceil+' st. '+
      (hr.pct>=70?'You are using most of what you have.':hr.pct>=40?'Room to push further — the capacity is already there.':'You have far more range available than you are using here. That is a deployment habit, not a limit.')+'</p></div>':'')+
    '</div>';
}

function toneChip(t){ return '<span class="tone">'+esc(t.name)+'</span>'; }
function cueBlock(t, extra){

function targetPills(t){

   '<span class="pill">'+T.wpm[0]+'–'+T.wpm[1]+' wpm</span>'+
