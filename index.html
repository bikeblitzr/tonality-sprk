{t:'The pitch shifts swiftly, the shift pitches swiftly.',c:'orig',d:5,tg:['/tʃ/','/ʃ/','/ft/','/fts/','/sw/'],why:'The /fts/ coda plus /tʃ/-/ʃ/ alternation plus word-class reversal. Written as a final-boss original.'},
{t:'Speak the peak, peak the speak, speak the peak precisely.',c:'orig',d:4,tg:['/sp/','/p/','/k/','/pr/'],why:'The /sp/-/p/ contrast is aspiration only, which English speakers produce unconsciously and cannot easily control on demand.'}
];
</script>

<script>
/* ============================================================
   EMPHASIS ENGINE + LINE POOLS + CONTOURS + PAUSE DRILLS
   ============================================================ */
'use strict';

/* ------------------------------------------------------------
   EMPHASIS SHIFT
   One sentence. Move the stress. The meaning changes completely.
   w = the words · m[i] = what the sentence means when word i is stressed
   ------------------------------------------------------------ */
var EMPHASIS = [
{id:'e1', w:['I','never','said','she','stole','my','money'],
 m:['Somebody else said it — but it wasn\'t me.',
    'Not once. Ever. I\'m denying the whole history of it.',
    'I didn\'t say it out loud — I might have implied it, written it, or thought it.',
    'I said someone stole it. Just not her.',
    'She didn\'t steal it — she borrowed it, or was given it.',
    'She stole money, but it wasn\'t mine.',
    'She took something of mine. It wasn\'t money.'],
 note:'The canonical demonstration. Seven words, seven completely different accusations, and not a single word changed. Everything you need to know about prosody is in this one line.'},

{id:'e2', w:['I','didn\'t','say','you','could','do','that'],
 m:['Someone gave you permission. Not me.',
    'I said the opposite, in fact.',
    'I didn\'t say it — but I may have signalled it.',
    'Somebody could. It wasn\'t you.',
    'I never said you were able to — I might have said you were allowed to.',
    'I didn\'t say do it. I said prepare for it.',
    'You could do something. Not that.'],
 note:'The permission version. Useful because it is the exact sentence managers use badly — the wrong stress here starts a genuine argument about what was agreed.'},

{id:'e3', w:['We','need','to','talk','about','the','price'],
 m:['Both of us. Not just you and your team.',
    'This isn\'t optional and it isn\'t a suggestion.',
    'Talking is the mechanism. Not emailing, not thinking about it.',
    'A conversation, not a negotiation. Not a decision. Yet.',
    'It\'s the subject, not something adjacent to it.',
    'That specific price. Not pricing in general.',
    'The price. Not the terms, not the scope, not the timeline.'],
 note:'A sales sentence that lands seven ways. Stress "need" and you have created pressure. Stress "talk" and you have removed it. Same words.'},

{id:'e4', w:['That','is','not','what','I','meant'],
 m:['That specific thing. Other things, maybe.',
    'It isn\'t — present tense, right now, definitively.',
    'A flat denial. The strongest version.',
    'You\'ve got the content wrong, not the intent.',
    'Someone meant it. Not me.',
    'That may be what I said. It is not what I intended.'],
 note:'The correction sentence. Stress on "meant" is a repair; stress on "not" is a fight.'},

{id:'e5', w:['I','think','this','could','work','for','you'],
 m:['My opinion, offered as mine — not a claim.',
    'Think, not know. A deliberate hedge.',
    'This one specifically. Not the other options.',
    'Possibility, not certainty. Honest, or weak, depending on the terminal.',
    'It works. That\'s the claim.',
    'For you specifically. Not in general.',
    'For you — as opposed to for me, or for someone else.'],
 note:'Watch what happens to your credibility as the stress moves left. Stress "think" and you have hedged. Stress "work" and you have claimed. Nothing else changed.'},

{id:'e6', w:['You','said','you\'d','have','it','done','by','Friday'],
 m:['You. Not the team, not someone else — you personally.',
    'It was said out loud. There is a record.',
    'You committed to it. It was your undertaking, not mine.',
    'You said you\'d have it. Not attempt it, not start it.',
    'That specific piece of work.',
    'Finished. Complete. Not in progress.',
    'By then, not after.',
    'Friday. Not Monday.'],
 note:'The accountability sentence. Every stress position is a different confrontation, and choosing the wrong one turns a check-in into an accusation.'},

{id:'e7', w:['She','handled','that','call','well'],
 m:['She did. Not the person you were expecting.',
    'She managed it — the handling was the skill, not the outcome.',
    'That one. The others, less so.',
    'The call specifically, as opposed to the follow-up.',
    'Well — genuinely, not just adequately.'],
 note:'Praise. Stress "that" and you have accidentally implied the others were bad. Emphasis creates contrast whether you intend it or not.'},

{id:'e8', w:['I\'m','not','sure','that\'s','the','best','use','of','our','time'],
 m:['I\'m not — others might be.',
    'A hedge on a challenge. Softest version.',
    'Uncertain rather than opposed.',
    'That specific approach.',
    'The single best, out of the options.',
    'Best. As opposed to acceptable.',
    'Use — how we deploy it, not how much we have.',
    'Ours, jointly. Not just mine.',
    'Time, as opposed to money or attention.'],
 note:'A polite objection that can be delivered as a genuine question or as a shutdown, entirely through stress placement.'},

{id:'e9', w:['We','can','do','that'],
 m:['We can. Others might not be able to.',
    'It is within our capability — with a fall, it\'s a promise; with a rise, it\'s a maybe.',
    'Do it, rather than discuss it.',
    'That specific thing, and by implication not the rest.'],
 note:'Four words. The shortest useful emphasis drill. Say it four ways and hear four different commercial positions.'},

{id:'e10', w:['This','is','the','last','time','I','ask'],
 m:['This instance, specifically.',
    'It is — a statement of fact, not a threat.',
    'The final one, definitively.',
    'Last. There will be no more.',
    'The last time. There may be other forms of pressure.',
    'I won\'t ask again. Someone else might.',
    'Ask. Next time it won\'t be a request.'],
 note:'A pressure line. Stress on "ask" is the most menacing version and it requires no volume at all.'},

{id:'e11', w:['I','want','you','to','understand','something'],
 m:['Me. This is coming from me personally.',
    'Want, not need. A softer frame than it looks.',
    'You specifically. Not the room.',
    'Understand, not agree. An important distinction to voice.',
    'Something particular. The stress here sets up a pause.'],
 note:'A classic setup line. The stress you choose determines whether the next sentence lands as a confidence or a lecture.'},

{id:'e12', w:['They','offered','us','a','better','deal'],
 m:['Them. The competitor. Not you.',
    'Offered — it\'s on the table, not agreed.',
    'Us. They came to us.',
    'Better than yours. That\'s the point.',
    'A deal, not a relationship.'],
 note:'The leverage sentence. In a negotiation, stress placement here is the entire message and most people put it in the wrong place.'},

{id:'e13', w:['I','can\'t','help','you','with','that'],
 m:['I can\'t. Someone here can.',
    'Not won\'t — genuinely cannot.',
    'Help is the wrong frame. I could do it for you, but I can\'t help.',
    'You specifically — there\'s a policy reason.',
    'That specific thing. Everything else, yes.'],
 note:'A refusal. Stress on "that" keeps the relationship. Stress on "you" ends it.'},

{id:'e14', w:['That\'s','a','great','question'],
 m:['That one. Unlike the others.',
    'One of several great ones.',
    'Great — genuinely, not politely.',
    'A question, and I\'m about to not answer it.'],
 note:'The most over-used phrase in professional speech. Stress on "great" is sincere; stress on "question" is stalling, and everyone can hear it.'},

{id:'e15', w:['We','should','probably','start','thinking','about','next','year'],
 m:['Us, together.',
    'Should — obligation, gently applied.',
    'Probably. The hedge that lets everyone off the hook.',
    'Start. Begin, not complete.',
    'Thinking, as opposed to doing.',
    'About it, around it — not on it.',
    'Next, as opposed to this.',
    'Year, not quarter.'],
 note:'A sentence made almost entirely of hedges. Say it with the stress on "start" and a falling terminal and it becomes a decision. Nothing else changes.'},

{id:'e16', w:['Nobody','told','me','about','the','change'],
 m:['Not one person. A complete failure.',
    'Told — I may have read it somewhere. Nobody said it.',
    'Me. Others were told.',
    'About it. I heard around it, not about it.',
    'That specific change.',
    'The change, as opposed to the reason for it.'],
 note:'A complaint. Stress on "me" makes it personal and political. Stress on "nobody" makes it a process problem. Choose deliberately.'},

{id:'e17', w:['I\'d','like','to','make','one','thing','clear'],
 m:['Me. My position specifically.',
    'Like, not need. Deliberately low-pressure.',
    'Make it — actively, now.',
    'One. Only one. That\'s the whole point of the sentence.',
    'A thing, a fact, not a feeling.',
    'Clear. Unambiguous. No room left.'],
 note:'The classic pre-statement. Stress on "one" is disciplined; stress on "clear" is a warning.'},

{id:'e18', w:['You','don\'t','have','to','decide','today'],
 m:['You specifically are under no obligation.',
    'A genuine release of pressure.',
    'No requirement exists.',
    'Decide — you could do something short of deciding.',
    'Today. But soon. This is the version with a hidden deadline.'],
 note:'The single most useful line in a soft close, and the stress placement decides whether it relieves pressure or applies it.'},

{id:'e19', w:['That','was','my','fault'],
 m:['That one. Not the other things.',
    'It was — past tense, done, accepted.',
    'Mine. Nobody else\'s.',
    'A fault, an error. Not a decision.'],
 note:'An apology. Stress on "my" is ownership. Stress on "that" is a limited admission — and people hear the limit.'},

{id:'e20', w:['We\'ve','never','done','it','that','way','before'],
 m:['Us. Others have.',
    'Never once. A hard boundary.',
    'Done. We\'ve considered it.',
    'It. Similar things, yes.',
    'That way. Other ways, yes.',
    'That way. As opposed to some other way.',
    'Before. Implying: but we could now.'],
 note:'The objection every innovator hears. Where they put the stress tells you whether it is a real objection or an invitation.'},

{id:'e21', w:['I','told','you','this','would','happen'],
 m:['I did. And you didn\'t listen.',
    'Told — explicitly, not hinted.',
    'You, specifically.',
    'This exact thing.',
    'Would. It was a prediction, not a warning.',
    'Happen. The event, not the consequence.'],
 note:'Six ways to say I-told-you-so, five of which end a relationship. Stress on "this" is the only survivable one.'},

{id:'e22', w:['What','exactly','are','we','paying','for'],
 m:['What — the substance of it.',
    'Exactly. Precision demanded. The hostile version.',
    'Are we — present, ongoing.',
    'We. Us, the ones writing the cheque.',
    'Paying. Money is changing hands and I want to see the return.',
    'For. The purpose, the deliverable.'],
 note:'A challenge from a buyer. The stress tells you whether you are being audited or attacked, and they need completely different responses.'},

{id:'e23', w:['Let\'s','be','honest','about','where','this','is','going'],
 m:['Together. An invitation, not an accusation.',
    'Be it, rather than perform it.',
    'Honest, as opposed to polite.',
    'About it. Directly.',
    'Where — the destination.',
    'This. This specific thing.',
    'Is. Present. It\'s already in motion.',
    'Going. The trajectory, not the current state.'],
 note:'A frame-setting line. Stress "let\'s" and it\'s collaborative. Stress "honest" and you have just told them they were lying.'},

{id:'e24', w:['I','don\'t','think','that\'s','going','to','work'],
 m:['My view. Offered as mine.',
    'A negation of thought, not of fact — technically weaker than it sounds.',
    'Think. I don\'t know. I suspect.',
    'That specific approach.',
    'Going to — future. It might work now and fail later.',
    'Work. It might do something. Not work.'],
 note:'Notice that the strongest possible version — stress on "work", falling terminal — is also the shortest and quietest.'},

{id:'e25', w:['How','much','do','you','actually','want','this'],
 m:['How — the mechanism of your wanting.',
    'Much. Degree. Quantity of desire.',
    'Do you — a genuine question.',
    'You. As opposed to the people around you.',
    'Actually. Beneath what you\'ve been saying.',
    'Want, as opposed to need, or say you want.',
    'This. This specific thing, not the general idea.'],
 note:'A challenge question. Stress on "actually" is the one that makes people uncomfortable, and it is usually the right one.'}
];

/* ------------------------------------------------------------
   FOCUS RULES — the "when to emphasize what" ruleset
   ------------------------------------------------------------ */
var FOCUS_RULES = [
{r:'One nuclear accent per thought group.',
 d:'A single intonation phrase gets exactly one primary stress. Two is shouting. Three is a robot. If you feel four words in a sentence all deserve emphasis, you actually have two or three sentences and you should break them.',
 bad:'WE need to FIX the PRICING PROBLEM immediately.', good:'We need to fix the pricing problem <em>immediately</em>.'},
{r:'Default focus lands on the last content word.',
 d:'With no special context, English puts the nuclear accent on the final noun, verb, adjective or adverb of the phrase. This is the resting state — everything else is a deliberate departure from it.',
 bad:'I bought a <em>car</em> yesterday at the dealership.', good:'I bought a car yesterday at the <em>dealership</em>.'},
{r:'New information takes the accent. Given information loses it.',
 d:'The moment a word has been said, it stops being accent-worthy. Repeating a word at full prominence is the single most common cause of speech that sounds patronising, and almost nobody notices they are doing it.',
 bad:'We tested three <em>options</em>. The second <em>option</em> won.', good:'We tested three <em>options</em>. The <em>second</em> one won.'},
{r:'Contrast overrides everything.',
 d:'When you are correcting or distinguishing, the contrasted word takes the accent no matter where it sits — even if it is a function word. This is the one case where stressing "the" or "of" is correct.',
 bad:'It\'s not a problem, it\'s an <em>opportunity</em>.', good:'It\'s not <em>a</em> problem, it\'s <em>the</em> problem.'},
{r:'Function words are reduced unless contrasted.',
 d:'Articles, prepositions, auxiliaries and pronouns collapse to schwa in normal speech. A speaker who gives every "to" and "for" its full vowel sounds like they are reading, because they are.',
 bad:'I want TO talk TO you ABOUT the report.', good:'I want t\'talk t\'you about the <em>report</em>.'},
{r:'Everything after the nucleus gets compressed.',
 d:'Once the primary accent has landed, the rest of the phrase should drop in both pitch range and volume. This is called post-focus compression, it improves listener comprehension by twenty-five to thirty percentage points, and virtually nobody is taught it.',
 bad:'It was <em>MARTIN</em> who <em>SIGNED</em> the <em>CONTRACT</em>.', good:'It was <em>Martin</em> who signed the contract.'},
{r:'Numbers only take the accent when the number is the point.',
 d:'"It costs three thousand" accents "thousand" if the amount matters, and accents "costs" if the fact of a cost matters. Reflexively hitting every figure is the most common tell of an untrained presenter.',
 bad:'Revenue grew <em>ELEVEN</em> percent to <em>FOUR</em> million.', good:'Revenue grew eleven percent to four <em>million</em>.'},
{r:'Emphasise the verb when the claim is the action.',
 d:'"We <em>built</em> it" and "we built <em>it</em>" are different claims. If the surprising part is that you did it rather than what you did, the verb takes the accent.',
 bad:'We <em>built</em> the whole <em>system</em> in six <em>weeks</em>.', good:'We built the whole system in <em>six weeks</em>.'},
{r:'Never accent a hedge.',
 d:'"I <em>think</em> it works" foregrounds your uncertainty. "I think it <em>works</em>" foregrounds the claim. Same words, opposite effect on your credibility.',
 bad:'I <em>think</em> we can probably do that.', good:'I think we can <em>do</em> that.'},
{r:'The word before a pause inherits weight for free.',
 d:'A pause promotes whatever preceded it. You can create emphasis with silence alone and no vocal effort at all — which is the cheapest and most under-used technique in speaking.',
 bad:'The answer is no and here\'s why.', good:'The answer is <em>no</em>. ⟨pause⟩ Here\'s why.'},
{r:'Emphasise less as the stakes go up.',
 d:'Counter-intuitive and reliably true. High-stakes content delivered flat reads as fact. High-stakes content delivered with heavy emphasis reads as sales. The more important the sentence, the more you should underplay it.',
 bad:'This is the MOST IMPORTANT DECISION you will make ALL YEAR.', good:'This is the most important decision you\'ll make this year.'},
{r:'Move the accent between repetitions.',
 d:'When you say a similar sentence twice, put the accent somewhere new. Identical melody on consecutive sentences is what produces the sing-song, template-reading sound.',
 bad:'Faster <em>setup</em>. Cheaper <em>running</em>. Simpler <em>support</em>.', good:'<em>Faster</em> to set up. Cheaper to <em>run</em>. And support just… works.'}
];

/* ------------------------------------------------------------
   PAUSE DRILLS — ⟨n⟩ marks a required pause of n×100 ms
   ------------------------------------------------------------ */
var PAUSE_DRILLS = [
{t:'So the real question ⟨7⟩ is whether you actually want this.', why:'A pre-nucleus pause. The silence promotes everything after it — you get emphasis without raising your voice.', tag:'Rhetorical pause'},
{t:'The answer is no. ⟨12⟩ And here is exactly why.', why:'Post-statement pause. Lets a hard word land before you soften it. Speaking through this gap is the single most common way people undo their own boundary.', tag:'Landing pause'},
{t:'What would have to be true ⟨5⟩ for you to say yes today? ⟨20⟩', why:'Post-question silence. Two full seconds. Anything shorter and you will answer your own question — which is the most common self-inflicted wound in selling.', tag:'Question silence'},
{t:'There were three of us. ⟨4⟩ Only one came back. ⟨15⟩', why:'Narrative beat. The pause carries the weight the words deliberately do not.', tag:'Story beat'},
{t:'I want to be very clear about this. ⟨10⟩ We are not doing that.', why:'The setup-then-deliver pattern. The pause is what converts a statement into a position.', tag:'Gravity pause'},

/* ============================================================
   THE CODEX — the theory. Read once, reference forever.
   ============================================================ */
'use strict';

var CODEX = [
{id:'why', title:'Why tonality outranks the words', sub:'The case for spending a year on this',
 body:`Everyone accepts, in the abstract, that *how* you say something matters. Almost nobody trains it, because it feels like a personality trait rather than a skill. It is not. It is a set of about eight measurable, independently controllable acoustic parameters, and every one of them responds to practice the same way a golf swing does.

Here is the practical case.

**The same sentence has between five and eight distinct meanings depending on where the stress falls.** Not shades — different propositions. "I never said she stole my money" accuses seven different people of seven different things depending only on which of the seven words carries the accent. If you are not choosing that consciously, you are choosing it randomly, several times a minute, all day.

**Terminal direction changes how confident you are perceived to be, measurably.** In controlled experiments where only the pitch of the *final word* was digitally altered — around four percent of the total speech — listeners rated the falling version as substantially more confident than the rising one. Nothing else changed. Same speaker, same words, same everything.

**And the effect is about frequency, not depth.** Manipulating seventy-five percent of sentences produced a far bigger effect than manipulating twenty-five percent, while listeners could not reliably tell a moderate manipulation from a strong one. Which means the trainable thing is *consistency* — hitting the right terminal most of the time — rather than any dramatic single gesture. That is good news, because consistency is exactly what drilling produces.

**There is one finding that reverses most people's intuition, and it is the single most useful thing in this app.** Confident speech has a **low mean pitch** and a **wide pitch range**. Unconfident speech has a high mean and a narrow range. Most people, trying to sound authoritative, flatten their voice — which lowers the range and produces something that reads as dead rather than certain. And most people, trying to sound animated, raise their whole register — which reads as anxious.

Mean pitch and pitch range are independent parameters. You can drop one and widen the other simultaneously, and doing so is the fastest single improvement available to almost any speaker. The Monotone Killer drill exists specifically for this.

**Persuasion is not the same as agreement, and tone affects them differently.** Falling terminals increased the amount of *thinking* listeners did about the message — the proportion of on-topic thoughts went from roughly two-thirds to three-quarters. Which means confident delivery amplified whatever was already there: it made strong arguments more persuasive and weak arguments *less* persuasive. Sounding certain about something thin is worse than sounding uncertain about it.

That last point is the ethical core of this whole app. Tonality is an amplifier. It does not manufacture a case. Have a real one, then learn to deliver it.`},

{id:'params', title:'The eight parameters', sub:'Everything you control, and what each one does',
 body:`Every tone in this app is a specific setting of these eight dials. Learn to move them independently and you can produce any tone on command, including ones nobody has named.

**1 · Mean pitch (register).** Where your voice sits. Adult male speaking fundamental sits around 115 Hz, adult female around 200 Hz — but the absolute number is irrelevant. What matters is where you are relative to *your own* comfortable middle. Low register reads as authoritative, calm, serious. High register reads as energetic, anxious, young, or deferential.

**2 · Pitch range (span).** How far you move within a phrase. Measured in semitones so it is comparable across voices. Under **4 semitones** reads as monotone. **6–10** is engaged, normal, credible. Over **14** is theatrical. This is independent of register and it is the dial most people never touch.

**3 · Terminal inflection.** What the pitch does in the last few hundred milliseconds. A **falling** terminal signals completion and certainty; a **rising** one signals a question or uncertainty; a **level** one signals suspension. A confident declarative drops **4 to 7 semitones** from the nuclear peak to the end. Below about 3 semitones it is not reliably heard as a fall at all.

**4 · Rate.** Persuasive and presentational speech sits between roughly **148 and 174 words per minute**. Under 120 reads as laboured. Over about 200 starts to cost comprehension, and over 250 costs intelligibility. But the more important variable is *variation* — rate that never changes is as flat as pitch that never changes.

**5 · Pause.** The most under-used parameter by a wide margin. Below **200 ms** no pause is perceived at all. Clause pauses run **200–400 ms**, sentence pauses **400–700 ms**, rhetorical pauses **500–1000 ms**, and after asking a genuine question you need **1500 ms or more** or you will answer it yourself. The confidence signature is **fewer, longer** pauses. The anxiety signature is more, shorter ones.

**6 · Loudness and dynamic range.** Conversational speech runs 60–68 dB at a metre with about 17 dB of available range. Most untrained speakers use under 4 dB of it. Target **8–12 dB** between your quietest and loudest phrase. And the emphasis word only needs about **3 dB** — the rest is pitch and duration.

**7 · Voice quality.** Modal (normal), breathy (intimate, warm), creaky or fry (low energy, phrase-final), tense (strained), falsetto. Occasional phrase-final creak is normal English; above about forty percent of phrases it starts costing you.

**8 · Articulation.** Precision of consonant release. This is the dial that produces "expertise" without volume — crisp consonants at normal loudness read as competent, whereas raised volume reads as selling. It is also the only parameter that is purely mechanical, which is why the tongue-twister gym exists.`},

{id:'emph', title:'When to emphasise what', sub:'The complete ruleset',
 body:`This is the question the whole app is named after. Here is the actual answer.

**The default: the last content word.** With no special context, English puts the primary accent on the final noun, verb, adjective or adverb of the phrase. "I bought a car at the *dealership*." Everything else is a deliberate departure from this resting state, and departures carry meaning precisely because there is a default to depart from.

**Rule one: one nuclear accent per thought group.** A single intonation phrase gets exactly one primary stress. Two is shouting. Three is a machine. Skilled English speakers produce phrases averaging around **five and a half syllables** — if you feel four words deserve emphasis, you have three phrases and you should break them.

**Rule two: new information takes the accent, given information loses it.** The moment a word has been said, it stops being accent-worthy. "We tested three *options*. The *second* one won" — not "the second *option* won." Re-accenting a word you already said is the single most common cause of speech that sounds patronising, and virtually nobody notices they are doing it.

**Rule three: contrast overrides everything.** When correcting or distinguishing, the contrasted word takes the accent regardless of position — even a function word. "It's not *a* problem, it's *the* problem." This is the one context where stressing "the" is correct.

There is a specific acoustic signature to contrastive accent that most people leave out: the pitch **dips below baseline immediately before the peak**, and the peak arrives about **100 to 125 milliseconds later** than it would in ordinary emphasis. That low onglide is what makes contrast audible. Without it, you have produced ordinary emphasis and the correction does not land. The Contrastive Scoop drill trains exactly this.

**Rule four: compress everything after the nucleus.** Once the primary accent lands, drop both pitch range and volume for the rest of the phrase — by at least **2 semitones and 2 dB**. This is called post-focus compression. It improves the listener's ability to identify what you emphasised by **twenty-five to thirty percentage points**, it is trivially easy to do, and it is almost never taught. If you learn one thing from this page, learn this one.

**Rule five: function words reduce.** Articles, prepositions, auxiliaries and pronouns collapse to schwa unless contrasted. A speaker who gives every "to" and "for" a full vowel sounds like they are reading, because they are.

**Rule six: never accent a hedge.** "I *think* it works" foregrounds your uncertainty. "I think it *works*" foregrounds the claim. Identical words.

**Rule seven: the word before a pause gets weight for free.** A pause promotes whatever preceded it. You can create emphasis with silence alone and zero vocal effort, and it is the cheapest technique available.

**Rule eight: emphasise *less* as the stakes go up.** Counter-intuitive and reliably true. High-stakes content delivered flat reads as fact; the same content delivered with heavy emphasis reads as sales. The more important the sentence, the more you should underplay it.

**Rule nine: move the accent between repetitions.** Identical melody on consecutive sentences is what produces the sing-song, template-reading sound. Say a similar thing twice, put the accent somewhere new.`},

{id:'term', title:'The terminal map', sub:'What the last half-second means',
 body:`More listener judgement rides on the final few hundred milliseconds of your sentence than on anything else you do. Here is the complete inventory.

**Low fall.** Down to your baseline. Signals finality, assertion, a closed proposition. Perceived as authoritative and decisive. Needs to exceed **3 semitones** to register as a fall at all; **4 to 7** is the working range for a confident declarative. Correct for statements, wh-questions, commands, closings, the last item in a list. Wrong when used on literally every phrase — that reads as sermonising.

**High fall.** Same endpoint, higher starting point, bigger excursion. Signals involvement and strong assertion. The difference from low fall is entirely in the onset height, not the landing.

**High rise.** Up to 40% higher by the end of the phrase, roughly 5–6 semitones. A genuine question — you are asking the listener to supply something. Correct for yes-no questions, checking, incredulity. Wrong on declaratives.

**Uptalk (rise on a statement).** Not identical to a question rise — it differs in onset and slope, though the two overlap enough that they are frequently confused. Worth knowing: uptalk is not rare or pathological. It has real discourse functions — floor-holding, checking shared ground, inviting continuation. The problem is not its existence; the problem is using it on claims, prices, commitments and closes, where it hollows out the content. Target: **under 20%** of your declaratives.

**Low rise.** Small rise from a low nucleus. Non-finality, politeness, encouraging continuation. Lower stakes than a high rise, and the correct terminal for a soft permission ask.

**Fall-rise.** Down, then back up to mid. Signals implication and reservation — "yes, but". It is how English marks a contrastive topic and it is how you concede a point before pivoting. Wrong on the closing sentence of an argument, where it audibly leaves the door open. Also a very common unconscious habit in people who are afraid of being definitive, and if that is you, you will hear it immediately in the Terminal Trainer.

**Rise-fall.** Up above the nuclear peak, then down. Being impressed, strongly involved, or — in the wrong context — arch and sarcastic. High-arousal. Overused it reads as theatrical.

**Level / sustained.** A plateau. Suspension, floor-holding, "there is more coming". The most frequent floor-holding device in English. Wrong as a default, where it becomes the sound of reading a list you do not care about.

**A note on trailing off.** "Trailing off" and a correct falling terminal are acoustically adjacent and are constantly confused. The difference is **not pitch** — both fall. The difference is that a correct fall keeps its **intensity and its voicing** all the way to the final consonant, and trailing off loses both. Target: the final syllable within **4 dB** of the sentence average. That is what the Volume Floor drill measures.`},

{id:'pause', title:'The pause', sub:'The most under-used instrument you own',
 body:`Silence is a positive act. It has a taxonomy, it has durations, and it is the only parameter where doing more of it is almost always correct.

**Below 200 milliseconds, no pause is perceived.** That is the floor. Anything shorter is a juncture, not a pause.

**200–400 ms** — clause boundary. Where a comma would go. In careful reading, about 79% of within-sentence punctuation marks get one.

**400–700 ms** — sentence boundary. News-reading median is around 400 ms, mean around 490. Essentially 100% of sentence boundaries get one in professional reading.

**500–1000 ms** — rhetorical pause. This is emphasis by silence. Place it *before* the word you want promoted and you get emphasis without vocal effort.

**800–1500 ms** — topic transition. The paragraph break of speech. Almost nobody leaves enough space here, which is why so many presentations feel like one undifferentiated block.

**1000–2500 ms** — dramatic pause. Real weight. Earn it or it is embarrassing.

**1500 ms minimum after asking a question.** This is the number to memorise. It has to exceed the listener's own turn-taking latency or you will answer your own question — which is the most common self-inflicted wound in selling, coaching and interviewing alike.

**Under 1000 ms before answering one.** The asymmetry is important. Long pauses *before* your own answers reduce perceived sincerity measurably; over about 2000 ms it is clearly detrimental. So: long silences after your questions, short ones before your answers.

**The confidence signature is fewer and longer.** Anxious speakers produce *more* pauses that are *shorter*. Confident speakers produce fewer, longer ones. This ratio is directly measurable and it is what the Pause Discipline drill scores.

**Target pause fraction: 15–25% of total speaking time.** If you are under 10% you are rushing regardless of your word rate.

One more thing. Breath placement should align with syntactic boundaries. Fewer than **15%** of your inhalations should land mid-constituent — breathing in the middle of a phrase is one of the loudest available signals that you have not planned the sentence.`},

{id:'defects', title:'The defect catalogue', sub:'Every named delivery problem, how to detect it, how to fix it',
 body:`Each of these has a deliberate-production drill in the Defect Lab, because you cannot reliably avoid a habit you cannot reproduce on purpose.

**Uptalk on statements.** *Detect:* rising terminal on more than 20% of declaratives. *Fix:* pick one sentence, say it rising, then say it falling, back to back, ten times. The internal difference is enormous and completely invisible until you do this.

**Monotone.** *Detect:* under 4 semitones of 80th-percentile pitch span. *Fix:* the Monotone Killer. Note the actual instruction — widen the range while **lowering** the mean. Most people do the opposite and produce anxiety.

**Mumbling.** *Detect:* reduced high-frequency energy, unreleased final consonants. *Fix:* the plosive rack and DDK drills. Purely mechanical, responds fast.

**Rushing.** *Detect:* over 6.5 syllables per second combined with a pause fraction under 10%. *Fix:* pause work, not rate work. Rushing is almost always a pause problem wearing a rate costume.

**Trailing off.** *Detect:* final-syllable intensity more than 4 dB below the utterance mean. *Fix:* Volume Floor drill. Also breathe earlier — this is a breath-planning failure most of the time.

**Filler words.** *Detect:* over 1 per 100 words is above a trained target; conversational baseline is about 2.6 per 100. *Fix:* replace the filler with silence. You cannot delete a habit, only substitute one, and silence is the substitution.

**Over-emphasis.** *Detect:* more than one prominence per intonation phrase. *Fix:* the post-focus compression drill. Hit one word, then compress everything after it.

**Sing-song.** *Detect:* identical pitch contour on consecutive sentences. *Fix:* deliberately move the nuclear accent between repetitions.

**Fake enthusiasm.** *Detect:* raised mean pitch with narrow range — the acoustic signature of effort rather than feeling. *Fix:* lower the mean, widen the range. Same paragraph, completely different reception.

**Hedging.** *Detect:* qualifiers stacked before the claim, rising terminals. *Fix:* say the identical sentence with every qualifier deleted and a falling terminal. Change nothing else and listen to what happens to the claim.

**Phrase-final fry.** *Detect:* pitch dropping below 60% of your modal F0 with irregular periodicity, on more than 40% of phrases. *Fix:* breathe at the previous clause boundary. Fry at phrase ends is a breath-management problem, not a voice problem.`},

{id:'practice', title:'How to actually practise', sub:'The protocol that produces change',
 body:`Reading this app does nothing. Here is what works.

**Deliberate over volume.** Twelve focused minutes beats an hour of reps you are not listening to. The mechanism is attention, not repetition — you have to be *comparing* each rep against a target, which is exactly what the scoring is for.

**One parameter at a time.** Do not try to fix pace and terminals and range in the same session. Pick the dial with the worst score, work only on it for a week, and let the others stay wrong. Trying to fix everything is how people fix nothing.

**Record everything, and listen to it later.** Real-time self-perception is unreliable — you hear your voice through bone conduction, which is a completely different signal from what anyone else receives. The playback is the coaching.

**Do the deliberate-defect drills.** Producing uptalk on purpose is the fastest way to stop producing it by accident. This is counter-intuitive enough that most people skip it, and it is the highest-yield thing in the app.

**Warm up first, always.** Straw phonation, lip trills, hum, then the articulator roll-call. Six minutes. It is the difference between practising your voice and practising your tired voice.

**Practise at the edge, perform in the middle.** Drill at exaggerated settings — bigger falls, wider range, longer pauses than you would ever use. Real performance will land at about sixty percent of your practice extremity, which is exactly where you want it.

**Space it out.** Four fifteen-minute sessions across a week beats one hour. This is one of the most robust findings in all of skill acquisition and it is why this app has a spaced-repetition queue rather than a course.

**Practise in the mouth you will perform with.** If you present on video calls, drill on a headset. If you present in rooms, drill standing up at volume. Motor skills are context-bound to an annoying degree.

**A note on plateaus.** They are normal and they last about two to three weeks. The usual cause is that you have automated the thing you were training and have not picked a new target. When a score stops moving, change the dial you are working on.`},

{id:'phone', title:'The channel changes the physics', sub:'Phone, video, room and stage are four different instruments',
 body:`Everything in this app is correct for a conversation across a table. Every other channel bends the rules.

**Phone.** You have lost the entire visual channel, so every signal has to be carried acoustically. Compress your dynamic range — a whisper that works in person disappears into a phone codec. Slow down by roughly ten percent. Increase your verbal acknowledgements, because your listener has no visual confirmation that you are still there. And crucially: phone codecs cut low frequencies, which strips out exactly the chest resonance that carries authority. Compensate with articulation precision rather than with volume.

**Video call.** Latency destroys the pause. A two-second silence over a laggy connection is indistinguishable from a dropped call, and both parties will start talking simultaneously. Shorten dramatic pauses to about 1200 ms and use a visual cue — a small nod, a hand — to signal that the silence is deliberate. Also: eye-line beats everything. Camera at eye height, and look at the lens on the important sentence.

**Room, unamplified.** Now you need real projection, which is a breath-support question rather than a volume question. Widen the dynamic range — you can use the full 12 dB. Lengthen pauses; a room absorbs silence in a way a headset does not. And the back row needs about fifteen percent more articulation than you think.

**Stage with a microphone.** The microphone gives back the intimacy you lose in a room, which means you can whisper again — and a whisper on a stage with good amplification is one of the most powerful things available. But the mic also amplifies every breath, every lip smack and every sibilant. Articulation has to get *cleaner*, not louder.

**Recorded and asynchronous.** No feedback loop at all, so nothing self-corrects. Slow to 110–130 words per minute. Vary at the *sentence* level rather than the word level — long-form listening needs macro variation. And pause harder than feels natural, because your listener may be doing something else.`},

{id:'ethics', title:'The line', sub:'Where technique becomes something else',
 body:`This app teaches a set of tools that work on people. It is worth being explicit about where the boundary sits, because the tools do not come with one.

**The test is whether the thing is true.** Every technique here has an honest use and a dishonest one, and the mechanics are identical in both. A scarcity tone on a real constraint is information. The same tone on a manufactured deadline is a lie delivered well. Nothing in the delivery distinguishes them — only the fact does.

**Emotional intensity is a resource you are spending on their behalf.** Consequence work, identity questions and confrontation all produce real discomfort. That is legitimate when it surfaces something they already knew and were avoiding. It is not legitimate as a lever to be pulled repeatedly because it produces compliance. The practical marker: once is diagnostic, twice is technique, three times is coercion — and it is on the recording.

**A person under distress cannot consent to anything.** If someone becomes genuinely upset, the correct move is to stop, not to press the advantage. This is not only ethics; it is also the commercial answer, because decisions made in that state reverse.

**Sounding certain about something you are not certain about is the core failure mode.** And the research is unusually clear here: confident delivery makes *weak* arguments less persuasive, not more. It amplifies whatever is actually there. So the tonality work has a prerequisite, and the prerequisite is having something true to say.

**The counter-moves matter more than the moves.** The most valuable thing in the Power section is not the ability to run these patterns. It is the ability to feel one running on you in real time and to name it silently. That skill costs nothing and it protects you for the rest of your life.`}
