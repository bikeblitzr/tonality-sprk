 recipe:{pitch:'Flattened and deliberately unaccented on the obvious clause, then re-lifted on the pivot.',pace:'Quick, almost throwaway on the first clause; normal after.',volume:'Reduced on the obvious clause.',terminal:'Falls on the obvious clause, lifts into the next.',resonance:'Neutral then forward.'},
 target:{wpm:[145,190],span:[7,14],term:[-5,2],dyn:[8,16],pause:[10,20]},
 overdone:'Presumptuous. They balk at the assumption you skipped over.',
 antidote:'Only deaccent things they have already agreed to. Deaccenting a contested claim is how you lose an argument you never had.',
 lines:['Obviously you\'ll save the time — but that\'s not really the point.','Sure, it\'s cheaper. Far more importantly, it\'s repeatable.','The money side takes care of itself. What actually changes is the calendar.','Yes it works. Everybody\'s does. Here\'s what nobody else has.','You\'ll get the reports — fine, everyone does that. What you won\'t get anywhere else is the review layer.','That part\'s a given. The interesting bit is what it lets you do next.','Right, the setup\'s handled. The thing worth talking about is month three.','Faster, obviously. But that\'s the boring benefit.','Of course it integrates. The question is what happens when it breaks.','That\'s table stakes. Here\'s the actual difference.']},

{id:'sl_hypo', fam:'straight', name:'Money Aside', tier:3,
 conveys:'This is only a thought experiment. No pressure attached.',
 useWhen:'Isolating an objection. Testing whether what they said is what they mean.',
 cue:'Lean back. Eyebrows up. You have no stake in the answer.',
 recipe:{pitch:'Slightly raised, light, disarming.',pace:'Quick and casual.',volume:'Light.',terminal:'Rising — it is a genuine question and has to sound like one.',resonance:'Light, unweighted.'},
 target:{wpm:[145,190],span:[6,12],term:[2,7],dyn:[4,11],pause:[10,20]},
 overdone:'Reads as a trap. They see the setup coming and harden.',
 antidote:'Genuinely accept the answer. If you run the isolation and then argue with the result, you have taught them the question was fake.',
 lines:['Just hypothetically — if cost weren\'t part of it, would you want this?','Setting the money aside for a second, is the thing itself right for you?','Pretend it was free. Would you use it?','If I could sort that out, would there be anything else?','Say the timing was perfect. Then what?','Just so I understand — is it the price, or is it the thing?','If that piece weren\'t an issue, are we good?','Imagine it was already paid for. Would you start Monday?','Purely as a thought — what if we could work around that?','Is that the only thing standing in the way?']},

{id:'sl_close', fam:'straight', name:'No Big Deal', tier:3,
 conveys:'This next step is the obvious, easy, unremarkable thing.',
 useWhen:'The actual ask. Every close carries this tone.',
 cue:'Asking someone to pass the salt.',
 recipe:{pitch:'Flat, unremarkable, no emphasis spike.',pace:'Casual, slightly quick.',volume:'Normal or a touch lower.',terminal:'Falling, then full stop and silence.',resonance:'Neutral modal.'},
 target:{wpm:[125,168],span:[3,8],term:[-6,-2],dyn:[4,10],pause:[14,26]},
 overdone:'Dismissive. Sounds like you do not believe in what you are selling.',
 antidote:'Flat delivery, then absolute silence. The flatness is only powerful because of what follows it.',
 lines:['So — do you want our help with this?','Shall we get you started then?','Want to go ahead?','So what do you say?','Do you want to do this?','Alright — should we set it up?','You in?','Want me to send it over?','So — yes?','Shall we?']},

{id:'sl_presup', fam:'straight', name:'Presupposing', tier:3,
 conveys:'The decision has already been made. We are just doing logistics now.',
 useWhen:'Transitions and post-yes. Forward framing.',
 cue:'Talking about something that was agreed last week.',
 recipe:{pitch:'Even, calm, unhurried. Lift only into an attached question.',pace:'Moderate, statements allowed to land.',volume:'Normal.',terminal:'Flat to falling on the presupposed clause.',resonance:'Neutral, easy.'},
 target:{wpm:[130,170],span:[4,9],term:[-5,-1],dyn:[4,11],pause:[14,25]},
 overdone:'Presumptuous. Triggers "hold on, I never agreed to that", and now you are defending instead of proceeding.',
 antidote:'Only presuppose after a real yes. Presupposition before agreement is the single most common cause of late-stage collapse.',
 lines:['So when we get you set up, the first thing we\'ll do is —','Once you\'re in, you\'ll want to start with the second module.','I\'ll get the paperwork over this afternoon.','What\'s the best email for the onboarding link?','We\'ll book your first session for next Tuesday, does the morning work?','When you\'re running this in six weeks you\'ll see what I mean.','The team will reach out on day one.','So the only thing left is which start date suits you.','I\'ll put you down for the October cohort.','Your first review\'s at the thirty-day mark.']},

/* ---------------- QUIET MODEL / NEPQ ---------------- */
{id:'nq_neutral', fam:'nepq', name:'Detached Neutral', tier:2,
 conveys:'I am not attached to the outcome, so there is nothing here for you to resist.',
 useWhen:'Default state for an entire consultative conversation. Especially the opening.',
 cue:'You already have enough clients. You are checking whether this one is even a fit.',
 recipe:{pitch:'Low to mid, narrow range, minimal excursion.',pace:'Slow and unhurried.',volume:'Conversational, slightly under.',terminal:'Flat to falling. Deliberately avoids the eager rising contour.',resonance:'Relaxed modal.'},
 target:{wpm:[105,145],span:[3,7],term:[-5,-1],dyn:[4,10],pause:[18,30]},
 overdone:'Flat. Bored. Robotic. Neutral without warmth is indistinguishable from disinterest.',
 antidote:'Add small acknowledgement sounds — a quiet "mm", a short "right". They keep neutral from becoming dead.',
 lines:['So before we get into anything — can I ask what made you take the call?','I\'m not sure yet whether this is something we can help with.','Let\'s just have a conversation and see.','No agenda here. I just want to understand the situation.','Might be a fit, might not be.','I\'d rather find out now than waste your afternoon.','Tell me what\'s going on and we\'ll see where it lands.','I don\'t know enough yet to have an opinion.','Let\'s find out.','That\'s useful. Keep going.']},

{id:'nq_curious', fam:'nepq', name:'Unagenda\'d Curiosity', tier:1,
 conveys:'I want the real answer and I am not steering you toward one.',
 useWhen:'Connection and situation questions. The whole front half of discovery.',
 cue:'Tilt your chin slightly up. The posture produces the tone more reliably than intention.',
 recipe:{pitch:'Small lift on the question word or key noun, then settling down.',pace:'Slow, with the back half of the question slower than the front.',volume:'Soft to conversational.',terminal:'Falling. The curiosity is carried mid-sentence, not at the end.',resonance:'Light modal.'},
 target:{wpm:[100,140],span:[4,9],term:[-5,-1],dyn:[4,10],pause:[20,32]},
 overdone:'Nosy. A fast curious tone is an interrogation.',
 antidote:'Slow the second half. Every time. It is the most reproducible rule in this entire system.',
 lines:['What made you look at this now?','How are you handling it currently?','What does that process look like for you?','Who\'s involved when that comes up?','What have you tried so far?','How did you end up doing it that way?','What made you reach out?','What does that usually cost you?','How often does that happen?','And what happens then?']},

{id:'nq_concern', fam:'nepq', name:'Quiet Concern', tier:1,
 conveys:'That matters more than you are letting on.',
 useWhen:'Problem-awareness questions. Consequence questions. Anywhere emotion needs to surface without being forced.',
 cue:'Lean in. The lean lowers your larynx and softens your volume automatically.',
 recipe:{pitch:'Lowered, narrowed, breathier.',pace:'Notably slowed. Pauses inserted mid-sentence, not just at the end.',volume:'Softened.',terminal:'Falling.',resonance:'Breathy, close.'},
 target:{wpm:[95,132],span:[3,8],term:[-6,-2],dyn:[4,10],pause:[22,36]},
 overdone:'Alarmist. Sounds like you are manufacturing a crisis, and they get defensive about their own situation.',
 antidote:'Ask, then stop. Concern that keeps talking becomes a sales pitch about their pain.',
 lines:['And how has that been affecting you?','What does that end up costing?','How do you feel about where it\'s at?','And that\'s been going on how long?','What\'s that doing to the rest of it?','Does that worry you at all?','How are you dealing with that side of it?','And nobody\'s been able to fix it?','What happens when it goes wrong?','So who ends up carrying that?']},

{id:'nq_soft', fam:'nepq', name:'Soft Ask', tier:2,
 conveys:'No pressure, at the exact moment when pressure would be expected.',
 useWhen:'The commitment question. Budget. Decision authority. Anything sensitive.',
 cue:'Whatever they say is genuinely fine with you.',
 recipe:{pitch:'Lowered, gentle.',pace:'Slow, then a complete stop.',volume:'The quietest you get in the whole conversation.',terminal:'Falling.',resonance:'Soft modal, slight breath.'},
 target:{wpm:[95,132],span:[3,8],term:[-6,-2],dyn:[3,9],pause:[24,40]},
 overdone:'Tentative. Weak. Sounds like you expect a no, which invites one.',
 antidote:'Soft in volume, definite in terminal. The fall at the end is what keeps softness from becoming apology.',
 lines:['So — where do you want to go from here?','Would it make sense to look at working together?','What would you like to do?','Is that something you\'d want help with?','How do you want to handle it?','Do you want to take the next step on this?','What\'s the right move for you?','Would you like me to put something together?','Where does that leave us?','So what are you thinking?']},

{id:'nq_challenge', fam:'nepq', name:'Respectful Pressure', tier:3,
 conveys:'I am not going to let you off the hook, and I am on your side.',
 useWhen:'Consequence questions, once trust exists. Confronting something they have been tolerating.',
 cue:'Intensity, not volume. Every ounce of extra weight goes into slowing down, never into getting louder.',
 recipe:{pitch:'Lowered and narrowed.',pace:'Slowed and deliberate, with real pauses between clauses.',volume:'Firm but not raised.',terminal:'Hard fall.',resonance:'Grounded chest.'},
 target:{wpm:[90,128],span:[4,9],term:[-8,-3],dyn:[5,12],pause:[24,38]},
 overdone:'Aggressive. Before trust exists it detonates the conversation.',
 antidote:'Earn it with three concern-tone questions first. Challenge is a withdrawal from an account you have to fund.',
 lines:['So what happens if you do nothing?','How long are you willing to let that run?','And you\'re alright with that?','What\'s the plan if this is still the same in a year?','Who fixes it if you don\'t?','Is waiting actually the safe option here?','So it stays broken.','What would have to happen for you to take it seriously?','And that\'s acceptable to you?','At what point does it become urgent?']},

{id:'nq_playful', fam:'nepq', name:'Playful', tier:1,
 conveys:'This is low stakes, I am a human, relax.',
 useWhen:'Openers. Pattern interrupts. Disarming someone who came in defensive.',
 cue:'A slight smile. It is audible.',
 recipe:{pitch:'Slightly raised, more melodic movement.',pace:'Light and quick.',volume:'Normal.',terminal:'Usually rising.',resonance:'Bright, forward.'},
 target:{wpm:[145,190],span:[7,13],term:[0,6],dyn:[6,13],pause:[10,20]},
 overdone:'Flippant. Kills credibility the moment it bleeds into a serious section.',
 antidote:'Use it early and then retire it. Playfulness in the consequence section is disqualifying.',
 lines:['I promise this isn\'t a pitch. Yet.','Right, I\'ll do the boring bit first.','You can hang up whenever you like, no hard feelings.','I\'m going to ask you some slightly nosy questions.','Fair warning — I ask a lot of questions.','I\'ll be honest, I have no idea if I can help you.','Terrible time to call, isn\'t it.','Alright, no sales voice. I promise.','This is the part where I pretend to be organised.','Bear with me, I\'ve got a list.']},

/* ---------------- COLOUR WHEEL ---------------- */
{id:'c_delight', fam:'colour', name:'Delight', tier:1, conveys:'Something just went better than expected.',
 useWhen:'Good news. A right answer. A moment worth marking.', cue:'Let the first syllable jump. Delight lives in the attack.',
 recipe:{pitch:'Sharp rise on the first stressed syllable, then a bright fall.',pace:'Quick.',volume:'Elevated.',terminal:'Rise-fall.',resonance:'Bright, forward, open.'},
 target:{wpm:[150,200],span:[9,16],term:[-4,3],dyn:[8,16],pause:[8,18]},
 overdone:'Manic. Or fake — unearned delight is instantly detectable.',antidote:'Earn it with a low line immediately before. Delight is a contrast effect.',
 lines:['Oh, that\'s brilliant.','No — really?','That\'s exactly it.','Ha! Perfect.','Look at that.','Yes! That\'s the one.','Oh that\'s good.','Beautiful.','Now we\'re talking.','That made my day.']},

{id:'c_deadpan', fam:'colour', name:'Deadpan', tier:2, conveys:'I am saying something absurd with a completely straight face.',
 useWhen:'Dry humour. Understatement. Defusing tension without acknowledging it.', cue:'Zero inflection change from the previous sentence. The flatness is the joke.',
 recipe:{pitch:'Completely level.',pace:'Unchanged.',volume:'Unchanged.',terminal:'Flat.',resonance:'Neutral.'},
 target:{wpm:[110,155],span:[1,4],term:[-3,1],dyn:[2,7],pause:[14,26]},
 overdone:'Just flat. Deadpan only works when the content is doing the work.',antidote:'The content must be genuinely funny or genuinely absurd. Deadpan on ordinary content is monotone.',
 lines:['That went well.','Cool. Love that for us.','I\'m thrilled.','Yes. Great. Wonderful.','What a treat.','Can\'t wait.','Marvellous.','Fantastic news for everyone involved.','Well. There it is.','Delightful.']},

{id:'c_incredulous', fam:'colour', name:'Incredulity', tier:2, conveys:'You cannot possibly be serious.',
 useWhen:'Genuine surprise. A number that does not make sense. Pushing back on something absurd.', cue:'Rise sharply above your normal ceiling, then drop hard.',
 recipe:{pitch:'Rise-fall with a large excursion. Peak well above your normal range.',pace:'Slowed on the key word.',volume:'Elevated.',terminal:'Falls hard after the peak.',resonance:'Open, forward.'},
 target:{wpm:[105,155],span:[10,18],term:[-8,-2],dyn:[8,17],pause:[16,30]},
 overdone:'Theatrical, or insulting. Incredulity aimed at a person rather than a fact is contempt.',antidote:'Aim it at the number, the situation, the fact — never at their judgement.',
 lines:['You\'re joking.','Forty thousand?','They said what?','And nobody stopped them?','That can\'t be right.','Wait, seriously?','For that?','How is that even possible?','You\'re telling me it took nine months?','Come on.']},

{id:'c_resigned', fam:'colour', name:'Resignation', tier:2, conveys:'I have stopped fighting this.',
 useWhen:'Admitting defeat. Naming a reality nobody can change. Powerful in storytelling, dangerous in selling.', cue:'Let the breath out before you speak. Say it on the exhale.',
 recipe:{pitch:'Descending throughout, ending low.',pace:'Slow, heavy.',volume:'Fading slightly but not trailing off.',terminal:'Long, low fall.',resonance:'Breathy, unsupported edge.'},
 target:{wpm:[80,118],span:[3,8],term:[-8,-3],dyn:[4,10],pause:[26,42]},
 overdone:'Self-pity. Which asks the listener to look after you.',antidote:'One line only, then change the energy. Sustained resignation is a burden on the listener.',
 lines:['It is what it is.','I don\'t think it\'s going to change.','We tried everything.','That\'s just how it goes.','I stopped expecting it years ago.','Some of them you don\'t win.','Yeah. I know.','There\'s nothing left to do about it.','That ship\'s gone.','Fine. Alright.']},

{id:'c_defiant', fam:'colour', name:'Defiance', tier:3, conveys:'No. And I am not moving.',
 useWhen:'Holding a boundary. Refusing a bad deal. The moment a line has to be drawn.', cue:'Plant your feet. Weight down. The voice follows the body.',
 recipe:{pitch:'Low, firm, minimal movement.',pace:'Slow, spaced, each word landed.',volume:'Full, supported, unwavering.',terminal:'Hard fall, hard stop.',resonance:'Deep chest.'},
 target:{wpm:[85,125],span:[4,10],term:[-10,-4],dyn:[7,15],pause:[24,40]},
 overdone:'Belligerence. Defiance with anger becomes a fight; defiance with calm becomes a wall.',antidote:'Remove all heat. The calmer the delivery, the more immovable it sounds.',
 lines:['No.','That\'s not happening.','I\'m not going to do that.','Ask me again and the answer will be the same.','This one isn\'t negotiable.','We\'re not doing it that way.','You can find someone else for that.','That\'s where I stop.','I won\'t.','Not a chance.']},

{id:'c_tender', fam:'colour', name:'Tenderness', tier:2, conveys:'I am handling this carefully because you matter.',
 useWhen:'Personal moments. Bad news to someone you care about. Rare and powerful in professional contexts.', cue:'Speak as though someone nearby is asleep.',
 recipe:{pitch:'Low-mid, gentle undulation, no spikes.',pace:'Slow.',volume:'Very quiet, but fully voiced.',terminal:'Soft fall.',resonance:'Breathy, warm, close.'},
 target:{wpm:[80,120],span:[4,9],term:[-6,-1],dyn:[3,8],pause:[26,42]},
 overdone:'Saccharine. Or intimate in a context that has not earned intimacy, which is deeply uncomfortable.',antidote:'Context check. Tenderness with a near-stranger reads as a boundary violation.',
 lines:['Hey. It\'s alright.','I know. I know.','Take your time.','You don\'t have to explain.','I\'m here.','That\'s a lot to carry.','It\'s okay to not be okay about it.','I\'ve got you.','Just breathe for a second.','You did what you could.']},

{id:'c_wry', fam:'colour', name:'Wry', tier:2, conveys:'I find this faintly ridiculous and I am not going to make a fuss about it.',
 useWhen:'Building rapport through shared observation. Naming an absurdity everyone can see.', cue:'One eyebrow. Half a smile. The tone is a shrug.',
 recipe:{pitch:'Slight rise-fall on one word, level elsewhere.',pace:'Relaxed, unhurried.',volume:'Slightly reduced.',terminal:'Falling, with a small lift on the ironic word.',resonance:'Relaxed modal.'},
 target:{wpm:[115,158],span:[4,9],term:[-5,0],dyn:[4,11],pause:[14,26]},
 overdone:'Sarcasm. Which is wry with the warmth removed, and it makes enemies.',antidote:'Keep the target external. Wry about a situation is charming; wry about a person is a dig.',
 lines:['Naturally.','Well, of course it did.','That\'s convenient.','Shocking, I know.','As you\'d expect.','Yes, that tracks.','Funny how that works.','I\'m sure it\'s a coincidence.','Ah, the classic approach.','Nobody could have predicted this.']},

{id:'c_awe', fam:'colour', name:'Awe', tier:2, conveys:'This is bigger than I expected.',
 useWhen:'Genuine admiration. Describing scale. Storytelling peaks.', cue:'Slow down and go quiet. Awe is not loud.',
 recipe:{pitch:'Mid, slow wide movement.',pace:'Slowed considerably.',volume:'Reduced — awe drops the volume.',terminal:'Long, slow fall.',resonance:'Open throat, breathy.'},
 target:{wpm:[80,120],span:[6,13],term:[-6,-1],dyn:[6,13],pause:[26,42]},
 overdone:'Sounds like a nature documentary. Or worse, fake wonder in a sales context.',antidote:'Use once. Awe repeated becomes a tic.',
 lines:['I\'ve never seen anything like it.','Twelve thousand of them. In one night.','You could hear it from a mile away.','That is... genuinely remarkable.','I had to sit down.','It went on for hours.','Nobody had done that before.','And it just kept going.','I still don\'t know how they did it.','That\'s the most impressive thing I\'ve seen all year.']},

{id:'c_conspir', fam:'colour', name:'Conspiratorial', tier:2, conveys:'This is between us.',
 useWhen:'Building intimacy fast. Sharing something semi-private. Making an ally.', cue:'Lean in and drop the volume. The physical closeness produces the sound.',
 recipe:{pitch:'Dropped, narrow.',pace:'Quick and low.',volume:'Down to near-whisper, fully voiced.',terminal:'Falling.',resonance:'Close, breathy, chest.'},
 target:{wpm:[125,170],span:[3,8],term:[-6,-2],dyn:[4,11],pause:[14,26]},
 overdone:'Creepy. Or gossipy, which makes them wonder what you say about them.',antidote:'Only share things that reflect well on the absent party. Conspiratorial praise builds trust; conspiratorial criticism destroys it.',
 lines:['Between you and me —','Don\'t tell anyone I said this.','Look, I\'ll be straight with you.','Here\'s what actually happened.','This doesn\'t leave the room.','I\'m not supposed to know this.','Can I tell you something?','Off the record —','You didn\'t hear it from me.','The real reason is much simpler.']},

{id:'c_impatient', fam:'colour', name:'Impatience', tier:3, conveys:'We are going too slowly and I want to move.',
 useWhen:'Cutting through waffle. Escalating. Deliberately, never accidentally.', cue:'Clip the ends of the words. Shorten every gap.',
 recipe:{pitch:'Slightly raised, compressed range.',pace:'Fast, clipped.',volume:'Elevated.',terminal:'Short sharp falls.',resonance:'Forward, tense edge.'},
 target:{wpm:[175,225],span:[4,10],term:[-7,-2],dyn:[6,14],pause:[5,13]},
 overdone:'Rude. And it hands them the moral high ground instantly.',antidote:'Name the impatience instead of performing it. "I want to be respectful of time" does the same job without the cost.',
 lines:['Right — what\'s the actual question?','Let\'s skip ahead.','Yes, and?','Give me the short version.','We\'ve covered that.','What do you need from me?','Okay. Next.','I\'ve got four minutes. Go.','Cut to it.','So what are we deciding?']},

{id:'c_hopeful', fam:'colour', name:'Cautious Hope', tier:2, conveys:'This might actually work, and I do not want to jinx it.',
 useWhen:'Turning a corner in a hard conversation. The moment before commitment.', cue:'Half the energy of delight. The restraint is what makes it believable.',
 recipe:{pitch:'Gentle rise, held, small fall.',pace:'Slightly slowed.',volume:'Soft to normal.',terminal:'Fall-rise — hopeful but not settled.',resonance:'Light, warm.'},
 target:{wpm:[110,152],span:[5,11],term:[-3,3],dyn:[5,11],pause:[18,30]},
 overdone:'Naive. Or it reads as needing them to say yes.',antidote:'Attach the hope to a condition. "If that holds, this could work" is hope with a spine.',
 lines:['That could actually work.','Maybe this is the year.','I think we might be onto something.','If that holds, we\'re in good shape.','There\'s a version of this that goes really well.','I\'d like to be wrong about the risk.','That\'s the first good sign in months.','Let\'s see.','Something\'s shifting.','I\'m allowing myself to be slightly optimistic.']},

{id:'c_weary', fam:'colour', name:'Weariness', tier:2, conveys:'I have done this a hundred times and it costs me now.',
 useWhen:'Authenticity in storytelling. Signalling that a warning comes from experience.', cue:'Support the breath but let the pitch sit at the bottom. Weary is low, not weak.',
 recipe:{pitch:'Low throughout, minimal movement.',pace:'Slow, even.',volume:'Reduced but supported.',terminal:'Low fall.',resonance:'Relaxed chest, slight breath.'},
 target:{wpm:[85,125],span:[2,7],term:[-7,-2],dyn:[3,9],pause:[24,38]},
 overdone:'Whining. Or it makes you sound burnt out, which is a bad advertisement.',antidote:'Weariness plus competence. Say the tired thing, then say the fix.',
 lines:['I\'ve seen this film before.','Every single time.','Yeah. That one always goes the same way.','Look — I\'ll save you eight months.','I used to argue about this. I don\'t anymore.','Third time this year.','Same story, different name.','I know exactly where this ends.','You can do it that way. Most people do.','I\'ll tell you what happens, and then you\'ll do it anyway.']},

{id:'c_proud', fam:'colour', name:'Quiet Pride', tier:2, conveys:'I did that, and I am not going to pretend I did not.',
 useWhen:'Credentialing without bragging. Answering "why should I trust you".', cue:'State the fact and stop. No emphasis on the impressive part.',
 recipe:{pitch:'Mid-low, even.',pace:'Measured.',volume:'Normal — resist the urge to lift.',terminal:'Clean fall.',resonance:'Grounded, easy.'},
 target:{wpm:[115,155],span:[4,9],term:[-6,-2],dyn:[5,11],pause:[16,28]},
 overdone:'Bragging. Which happens the instant you add emphasis or volume to the number.',antidote:'Deaccent the impressive word. Understatement is what turns a claim into a fact.',
 lines:['We\'ve done about six hundred of these.','I built the first version myself.','Fourteen years, same problem, every day.','I\'ve been wrong about a lot. Not about this.','That one\'s mine.','We haven\'t lost a client to that issue since.','I know this bit cold.','Yeah, that was us.','I\'ve made every mistake there is to make here.','It works. I\'ve watched it work.']},

{id:'c_apolog', fam:'colour', name:'Sheepish', tier:1, conveys:'I know, I know.',
 useWhen:'Small admissions. Human moments. Disarming.', cue:'Half-laugh in the voice. It has to be light or it becomes real apology.',
 recipe:{pitch:'Mid, slight rise, small fall.',pace:'Quick.',volume:'Slightly reduced.',terminal:'Rise then small fall.',resonance:'Light, forward.'},
 target:{wpm:[135,180],span:[5,11],term:[-3,3],dyn:[4,10],pause:[12,24]},
 overdone:'Undermines you. Sheepish about something serious reads as not taking it seriously.',antidote:'Small things only. Never be sheepish about a real error — that needs Clean Apology.',
 lines:['Yeah, that was me.','I know, I know.','In my defence — actually no, I have no defence.','Guilty.','I did say I\'d have it Tuesday, didn\'t I.','Look, it made sense at the time.','Alright, fair.','I may have overcommitted slightly.','That one\'s on me and I knew it as I did it.','Not my finest work.']},

{id:'c_clinical', fam:'colour', name:'Clinical', tier:2, conveys:'I am reporting facts and I have removed myself from them.',
 useWhen:'Numbers. Bad news that needs to be understood before it is felt. Technical explanation.', cue:'Read it like a weather forecast.',
 recipe:{pitch:'Level, even, no colour.',pace:'Steady, unvarying.',volume:'Even.',terminal:'Small consistent falls.',resonance:'Neutral modal.'},
 target:{wpm:[125,165],span:[2,6],term:[-5,-1],dyn:[3,8],pause:[14,26]},
 overdone:'Cold. Delivering human news clinically is how organisations get hated.',antidote:'Clinical for the facts, then a deliberate switch to warmth for the meaning. The switch is the skill.',
 lines:['Revenue is down eleven percent quarter on quarter.','There are three options and each has a cost.','The system failed at 04:12 and recovered at 06:40.','Forty-one of sixty responded.','Here are the numbers as they stand.','The contract ends on the thirtieth.','Two of the three tests passed.','That represents about a fifth of the total.','The margin is four points below plan.','These are the facts. Then I\'ll tell you what I think.']},

{id:'c_bright', fam:'colour', name:'Bright & Brisk', tier:1, conveys:'Let us get on with it, cheerfully.',
 useWhen:'Openings, logistics, agenda-setting, anything administrative that would otherwise be boring.', cue:'Forward energy. Consonants crisp, tempo up, no rush.',
 recipe:{pitch:'Mid-high, lively.',pace:'Quick.',volume:'Normal to slightly up.',terminal:'Mixed, mostly small falls.',resonance:'Bright, forward.'},
 target:{wpm:[155,200],span:[6,12],term:[-5,1],dyn:[5,12],pause:[9,18]},
 overdone:'Perky. Which grates within thirty seconds.',antidote:'Bright for the admin, then drop into something lower for the substance. Never stay bright.',
 lines:['Right — three things and then I\'ll let you go.','Quick one for you.','Let\'s get the boring bit out of the way.','Two minutes, then we\'re done.','Okay! Where were we.','So, agenda: this, this, and this.','Easy one first.','Let\'s crack on.','Right, I\'ve got everything in front of me.','Perfect. Next thing.']},

{id:'c_menace', fam:'colour', name:'Calm Menace', tier:4, conveys:'I am not raising my voice and that should worry you.',
 useWhen:'Almost never in business. Powerful in fiction, negotiation brinkmanship, and as an acting exercise.', cue:'The calmer the delivery, the more threatening the content becomes. Never add heat.',
 recipe:{pitch:'Low, absolutely level.',pace:'Slow, spaced, unhurried.',volume:'Quiet, controlled.',terminal:'Level or slight fall.',resonance:'Chest, restrained.'},
 target:{wpm:[75,115],span:[2,7],term:[-6,-1],dyn:[3,9],pause:[28,46]},
 overdone:'Cartoon villain. And in a real professional setting, a fireable offence.',antidote:'This is a range exercise. Drill it for control; almost never deploy it.',
 lines:['I\'d think very carefully about the next thing you say.','We can do this the easy way.','I know where you live. I have your address on the form.','Let\'s not pretend either of us is confused.','I\'ll ask one more time.','That would be a mistake.','You have until Friday.','I\'d hate for this to get complicated.','Do we understand each other?','I\'m being very reasonable right now.']},

{id:'c_soothe', fam:'colour', name:'Soothing', tier:1, conveys:'Nothing here is an emergency.',
 useWhen:'De-escalation. Angry customers. Panic. The highest-value tone in customer-facing work.', cue:'Go slower and quieter than they are. They will match you within three exchanges.',
 recipe:{pitch:'Low-mid, smooth, slow undulation.',pace:'Slow and even. No acceleration whatsoever.',volume:'Soft, steady.',terminal:'Gentle consistent falls.',resonance:'Warm, relaxed.'},
 target:{wpm:[95,132],span:[4,9],term:[-6,-2],dyn:[3,9],pause:[20,34]},
 overdone:'Patronising. "Calm down" energy escalates rather than de-escalates.',antidote:'Never name their emotion as a problem. Slow your own delivery and let entrainment do the work silently.',
 lines:['Okay. Let\'s take this one piece at a time.','I\'ve got it. We\'ll sort it.','Nothing\'s broken permanently here.','Tell me what happened, from the start.','That\'s frustrating and I\'d be annoyed too.','Right — here\'s what I can do today.','We have time.','I\'m not going anywhere until this is fixed.','Let\'s deal with the urgent bit first.','You\'re in the right place.']},

{id:'c_grave', fam:'colour', name:'Grave', tier:3, conveys:'Someone has been hurt by this.',
 useWhen:'Serious news. Loss. Consequences with human weight.', cue:'Strip out every trace of performance. Plain, low, unhurried.',
 recipe:{pitch:'Low, minimal movement.',pace:'Slow.',volume:'Moderate, supported, unhidden.',terminal:'Low definite falls.',resonance:'Chest, unpushed.'},
 target:{wpm:[80,118],span:[2,7],term:[-8,-3],dyn:[4,10],pause:[28,44]},
 overdone:'Melodrama, which makes a real event feel manufactured.',antidote:'Underplay. The more serious the content, the flatter the delivery should be.',
 lines:['I have some difficult news.','It didn\'t go the way we hoped.','We lost the account. And two people with it.','I need to tell you something before you hear it elsewhere.','This is going to affect people.','There isn\'t a good version of this.','It happened on Sunday.','I wanted you to hear it from me.','We got it wrong and someone paid for it.','I don\'t have anything to soften this with.']},

{id:'c_seduce', fam:'colour', name:'Restrained Allure', tier:3, conveys:'I am not trying to convince you of anything.',
 useWhen:'Luxury, craft, exclusivity. Describing something desirable without describing it as desirable.', cue:'Understate everything. The restraint is what creates the pull.',
 recipe:{pitch:'Low, smooth, slow movement.',pace:'Slow, unhurried, generous pauses.',volume:'Soft.',terminal:'Long gentle falls.',resonance:'Warm, breathy, close.'},
 target:{wpm:[85,125],span:[4,10],term:[-6,-1],dyn:[4,11],pause:[24,40]},
 overdone:'Sleazy, or a perfume advert. The line is thin.',antidote:'Describe the object, never the feeling. "It takes four days to make one" beats "it feels incredible."',
 lines:['They only make forty a year.','It takes about four days. One person.','You won\'t see it advertised anywhere.','Feel the weight of it.','It gets better with use, not worse.','There\'s no version of this that\'s faster.','Most people never find out it exists.','It\'s not for everyone. That\'s rather the point.','No logo. Deliberately.','You\'ll know within about ten seconds.']},

{id:'c_vindic', fam:'colour', name:'Vindication', tier:2, conveys:'I said this would happen.',
 useWhen:'Rare, and dangerous. Powerful in storytelling; corrosive in relationships.', cue:'Resist the emphasis. Vindication is only tolerable when it is understated.',
 recipe:{pitch:'Mid, level, one small rise-fall.',pace:'Measured.',volume:'Normal — any lift becomes gloating.',terminal:'Small fall.',resonance:'Neutral.'},
 target:{wpm:[115,158],span:[4,9],term:[-5,-1],dyn:[4,11],pause:[16,28]},
 overdone:'Gloating. Which costs you more than being right earned you.',antidote:'Say it once, quietly, then immediately move to what happens now.',
 lines:['That\'s the thing I flagged in March.','Yeah. That\'s what I thought would happen.','It\'s in the notes from the first meeting.','I\'d rather have been wrong.','Anyway. What do we do now.','Same issue, six months later.','I did mention it.','Right. So — the fix we discussed then.','Not a surprise.','Let\'s not do the third one.']},

/* ---------------- BROADCAST & STAGE ---------------- */
{id:'b_anchor', fam:'broadcast', name:'The Anchor Read', tier:2,
 conveys:'This information is reliable and I am not part of the story.',
 useWhen:'Reading copy. Announcements. Any one-to-many factual delivery.',
 cue:'Emphasis on one word per clause, no more. Consistent falling terminals. Zero personality intrusion.',
 recipe:{pitch:'Mid, controlled, consistent movement pattern.',pace:'Steady, around 160 words per minute.',volume:'Even, projected.',terminal:'Falls on every sentence. Consistency matters more than depth.',resonance:'Forward, resonant, clean.'},
 target:{wpm:[148,178],span:[5,10],term:[-6,-2],dyn:[5,12],pause:[16,26]},
 overdone:'The parody newsreader voice. Sing-song, hitting the same melody every sentence.',
 antidote:'Vary which word in the clause carries the accent. The melody follows the meaning, not a template.',
 lines:['The vote passed by a margin of eleven.','Three regions reported outages beginning early this morning.','Officials say the review will conclude before the end of the month.','The company declined to comment.','That figure is the highest recorded since two thousand and nine.','More on that story in a moment.','Conditions are expected to improve overnight.','The decision affects roughly forty thousand households.','We\'ll have reaction from both sides after the break.','Here is what we know so far.']},

{id:'b_narrate', fam:'broadcast', name:'Narrator', tier:2,
 conveys:'I am carrying you through something, and you can relax into it.',
 useWhen:'Audiobook. Documentary. Long-form explanation. Any sustained listening.',
 cue:'Slower than you think. Around 120 words a minute. The listener has no visual channel.',
 recipe:{pitch:'Mid, warm, gently varied across sentences rather than within them.',pace:'Slow, around 110 to 130 words per minute.',volume:'Even, intimate, close-mic energy.',terminal:'Long falls with the occasional level tone to carry a list.',resonance:'Warm chest, relaxed.'},
 target:{wpm:[105,140],span:[5,10],term:[-6,-2],dyn:[5,12],pause:[18,30]},
 overdone:'Sleepy. Or the documentary voice, which draws attention to itself.',
 antidote:'Vary the *sentence-level* pitch, not the word level. Long-form needs macro variation, not micro.',
 lines:['It began, as most of these things do, with a small mistake.','Nobody noticed for eleven years.','What happened next has never been fully explained.','The river runs for two thousand miles before it reaches anything you would call a town.','She wrote the letter in March and never sent it.','There were four of them, and only one came back.','This is the part of the story most people get wrong.','It would be another decade before anyone tried again.','The room had not been opened since the war.','And that, in the end, was the whole of it.']},

{id:'b_keynote', fam:'broadcast', name:'The Keynote Turn', tier:3,
 conveys:'Everything I have said so far was setting up this.',
 useWhen:'The pivot of a talk. The moment the argument turns.',
 cue:'Full stop first. Two full seconds of silence. Then start lower and slower than everything before it.',
 recipe:{pitch:'Drop below your presentation baseline, then build.',pace:'Very slow at the turn, accelerating after.',volume:'Drop first, then build. The drop is what makes them lean in.',terminal:'Deep falls.',resonance:'Chest, open, projected.'},
 target:{wpm:[85,130],span:[7,14],term:[-9,-3],dyn:[9,18],pause:[26,42]},
 overdone:'TED-talk parody. The dramatic pause has been so overused that it now signals rehearsal.',
 antidote:'Earn it with genuine content. A pause before something ordinary is embarrassing.',
 lines:['But that is not what happened.','And here is where I was wrong.','Which brings me to the only thing I actually came here to say.','Everything I have just told you is the easy part.','So we ran it again. And the result was the opposite.','I want to tell you about the day I stopped believing that.','There is a version of this you have not heard.','And then, in about four seconds, everything changed.','This is the part I have never talked about publicly.','So. What do we do with that?']},

{id:'b_teach', fam:'broadcast', name:'Explainer', tier:1,
 conveys:'You will understand this by the end of the sentence.',
 useWhen:'Teaching. Onboarding. Explaining anything technical to anyone non-technical.',
 cue:'One idea per intonation phrase. Pause at every conceptual boundary, not every comma.',
 recipe:{pitch:'Mid, clear accent on each new term, deaccent on repeats.',pace:'Moderate with deliberate slowdowns on new information.',volume:'Even, clear.',terminal:'Falls at concept boundaries, level tones within a list.',resonance:'Forward, articulate.'},
 target:{wpm:[125,165],span:[5,11],term:[-6,-1],dyn:[5,12],pause:[18,30]},
 overdone:'Lecturing. Or over-slowing, which reads as thinking they are stupid.',
 antidote:'Deaccent every term the second time you say it. Repeating a word at full prominence is what makes teaching sound patronising.',
 lines:['There are three parts. I\'ll do them in order.','Think of it like a filter — things go in, most things don\'t come out.','The important word there is "eventually".','So that\'s step one. Step two is where it gets useful.','Ignore everything except this column.','Here\'s the mistake nearly everyone makes.','Same idea, different name.','You don\'t need to remember that bit.','Right — say that back to me.','That\'s the whole concept. The rest is detail.']},

/* ---------------- DEFECT LAB ---------------- */
{id:'d_uptalk', fam:'defect', name:'Uptalk (on purpose)', tier:1,
 conveys:'Everything I say is a question I am not sure about.',
 useWhen:'Only as a drill. Produce it deliberately so you can hear it, then produce its opposite.',
 cue:'Lift the last word of every sentence. Feel how it hollows out the claim.',
 recipe:{pitch:'Rise at the end of every phrase.',pace:'Normal.',volume:'Normal.',terminal:'Rising on declaratives.',resonance:'Light.'},
 target:{wpm:[130,175],span:[5,11],term:[2,8],dyn:[4,11],pause:[12,24]},
 overdone:'This is the defect. Every terminal rising is the single fastest way to sound unsure.',
 antidote:'The Fix: same sentence, terminal falls. Do them back to back until you can hear the difference from inside your own head.',
 lines:['So the report\'s finished?','I think the numbers are right?','We should probably launch on Tuesday?','My recommendation is the second option?','The client was happy with it?','I\'ve done this before?','That\'s our best estimate?','It costs about nine thousand?','I\'d like the role?','This is what I found?']},

{id:'d_mono', fam:'defect', name:'Monotone (on purpose)', tier:1,
 conveys:'I have stopped caring and so should you.',
 useWhen:'Only as a drill. Feel the flatness so you can detect it live.',
 cue:'Keep every syllable at the same pitch. Under four semitones of total range.',
 recipe:{pitch:'Flat. No excursion.',pace:'Even.',volume:'Even.',terminal:'Flat.',resonance:'Neutral.'},
 target:{wpm:[125,170],span:[0,4],term:[-2,1],dyn:[1,5],pause:[12,24]},
 overdone:'This is the defect. Under four semitones of range and listeners stop processing content.',
 antidote:'The Fix: same sentence, six to ten semitones of range with the *mean* pitch unchanged or lower. Range and register are independent — that is the whole insight.',
 lines:['I\'m really excited about this opportunity.','This is the best product on the market.','We had an incredible quarter.','I love this part of the job.','That\'s a fantastic idea.','I can\'t wait to get started.','This will change everything for you.','It\'s genuinely a privilege to be here.','You\'re going to love it.','This is the most important thing I\'ll say today.']},

{id:'d_trail', fam:'defect', name:'Trailing Off (on purpose)', tier:1,
 conveys:'I lost confidence somewhere in the middle of my own sentence.',
 useWhen:'Only as a drill. This is the most common defect in nervous speakers and the easiest to fix once heard.',
 cue:'Let the volume and the voicing die over the last three words. Note how the whole sentence retroactively weakens.',
 recipe:{pitch:'Falls, then loses pitch entirely into creak.',pace:'Decelerating into nothing.',volume:'Fading to inaudible.',terminal:'Fade, not fall.',resonance:'Losing support, glottal fry at the end.'},
 target:{wpm:[110,160],span:[2,7],term:[-9,-2],dyn:[1,5],pause:[14,26]},
 overdone:'This is the defect. It is acoustically adjacent to a correct falling terminal — the difference is that a correct fall *keeps its volume and its voicing* to the last syllable.',
 antidote:'The Fix: same falling pitch, but hold the intensity within four dB of the sentence average all the way to the final consonant. Fall in pitch, not in energy.',
 lines:['And that\'s basically what we\'re proposing, so, yeah.','I think it\'s a good idea, or at least, it might be.','The total comes to about fifteen thousand or so.','So that\'s my recommendation I suppose.','It should work, probably.','That\'s all I had really.','I\'d like to be considered for it, if that\'s alright.','We think the market\'s ready, more or less.','So, um, that\'s the plan.','Anyway, that\'s it.']},

{id:'d_hedge', fam:'defect', name:'Hedging (on purpose)', tier:2,
 conveys:'I am apologising for having an opinion.',
 useWhen:'Only as a drill. Learn to hear your own qualifiers.',
 cue:'Stack the softeners: just, sort of, kind of, maybe, I think, a bit, possibly, if that makes sense.',
 recipe:{pitch:'Rising, uncertain.',pace:'Hesitant with fillers.',volume:'Reduced.',terminal:'Rising or fading.',resonance:'Light, unsupported.'},
 target:{wpm:[120,175],span:[4,10],term:[0,6],dyn:[2,7],pause:[16,30]},
 overdone:'This is the defect. Every hedge is a small withdrawal from your own credibility.',
 antidote:'The Fix: say the identical sentence with every qualifier deleted and a falling terminal. Nothing else changes. Listen to what happens to the claim.',
 lines:['I just sort of thought maybe we could possibly look at it?','This might be a bit of a silly question but —','I\'m not an expert or anything, but I think perhaps —','Sorry, can I just quickly add something small?','It\'s only my opinion, and I could be totally wrong, but —','I kind of feel like it might sort of work?','Just a small thought, if that\'s okay?','I could be way off here, honestly, but —','Probably not important, but I wondered whether —','Sorry to bother you, I\'ll be really quick, I promise —']},

{id:'d_fry', fam:'defect', name:'Terminal Fry (on purpose)', tier:2,
 conveys:'I ran out of breath and support at the end of every phrase.',
 useWhen:'Only as a drill. Produce it deliberately to learn where your support runs out.',
 cue:'Speak until the very bottom of your range and let the folds rattle.',
 recipe:{pitch:'Drops below your modal floor into irregular vibration.',pace:'Slowing at the end.',volume:'Dropping.',terminal:'Creak.',resonance:'Glottal, unsupported.'},
 target:{wpm:[115,165],span:[2,8],term:[-10,-3],dyn:[2,7],pause:[14,28]},
 overdone:'This is the defect. Occasional phrase-final creak is normal English. Above about forty percent of phrases it starts costing you.',
 antidote:'The Fix: breathe earlier. Fry at the end of phrases is a breath-management problem, not a voice problem. Take the breath at the previous clause boundary and the fry disappears.',
 lines:['So that\'s what we ended up going with in the end.','I think it\'s probably the right approach overall.','We looked at three suppliers and picked the second one.','It should be ready by the end of the month.','That was the conclusion of the whole review.','I\'ve been doing this for about eleven years now.','The team\'s been working on it since January.','So that covers everything on the agenda.','That\'s roughly where we are with it.','And that brings us to the end of the quarter.']}
];

/* index */
var TONE_BY_ID = {};
TONES.forEach(function(t){ TONE_BY_ID[t.id] = t; });
</script>

<script>
/* ============================================================
   ARTICULATION GYM — tongue twisters & warmups
   Traditional folk material plus originals written for this app.
   d = difficulty 1-5 · tg = target phonemes · why = the phonetic reason it's hard
   ============================================================ */
'use strict';

var TWISTER_CATS = {
  warmup:  {name:'The Warmup Rack',      c:'var(--ok)',  blurb:'What every actor and broadcaster runs before they speak. Six minutes, in order. These are not tongue twisters — they are calibration. Do them before every session in this app.'},
  sib:     {name:'Sibilants  /s/ /ʃ/ /z/',c:'var(--cy)', blurb:'The hardest family in English, because /s/ and /ʃ/ differ only in tongue-blade position by a few millimetres. A lisp, a whistle, or a hiss lives here. So does most microphone unpleasantness.'},
  plos:    {name:'Plosives  /p/ /b/ /t/ /d/ /k/ /g/',c:'var(--acc)', blurb:'Stop consonants. Where crispness comes from and where mumbling starts. Alternating place of articulation — lips, then ridge, then soft palate — is what makes these hard.'},
  liquid:  {name:'Liquids  /r/ /l/',      c:'var(--vi)', blurb:'The two sounds that require the most precise tongue shaping in English, and the pair that non-native speakers and tired speakers collapse together first.'},
  fric:    {name:'Fricatives  /f/ /v/ /θ/ /ð/ /h/',c:'var(--pk)', blurb:'The th sounds do not exist in most of the world\'s languages, and they sit adjacent to /f/, /v/, /s/ and /d/. Sustained airflow with precise obstruction — the least forgiving articulation in English.'},
  nasal:   {name:'Nasals & Glides  /m/ /n/ /ŋ/ /w/ /j/',c:'var(--ok)', blurb:'Resonance work disguised as articulation. These build the forward placement that makes a voice carry without volume.'},
  vowel:   {name:'Vowel Gymnastics',      c:'var(--cy)', blurb:'Jaw, lip and tongue-height range. Vowels carry most of the acoustic energy in speech — a speaker with collapsed vowels sounds muffled no matter how crisp the consonants are.'},
  cluster: {name:'Consonant Clusters',    c:'var(--acc)', blurb:'Three and four consonants with no vowel between them. English allows some of the densest clusters of any major language, and they are the first thing that breaks under speed.'},
  long:    {name:'Long-Form Classics',    c:'var(--vi)', blurb:'The full-length traditional pieces. These train sustained articulation under breath pressure — very different from the two-second snap of a short twister.'},
  brutal:  {name:'The Brutal Rack',       c:'var(--no)', blurb:'The ones that break people. Minimal-pair alternation at maximum density. Nobody says these clean at speed on a first attempt. That is the point.'},
  world:   {name:'Around the World',      c:'var(--pk)', blurb:'Twisters from other languages, with pronunciation notes. Every one trains a contrast English does not have — which is exactly why they stretch you.'},
  orig:    {name:'The Originals',         c:'var(--ok)', blurb:'Written for this app, targeting the specific contrasts the classics miss.'}
};

var TWISTERS = [
/* ============ WARMUP RACK (do these first, in order) ============ */
{t:'Mmmmm — hum on a comfortable note, lips gently closed, feel the buzz in your lips and nose. 30 seconds.',c:'warmup',d:1,tg:['/m/'],why:'Semi-occluded vocal tract. Back-pressure balances fold closure and warms the voice with almost no strain. Always the first thing you do.'},
{t:'Mah — may — mee — moh — moo. Slide from the hum straight into the vowel without breaking the tone.',c:'warmup',d:1,tg:['/m/','vowels'],why:'Carries the resonance you just built in the hum forward into open vowels. Bridges humming to speech.'},
{t:'The tip of the tongue, the teeth, the lips. The tip of the tongue, the teeth, the lips.',c:'warmup',d:1,tg:['/t/','/ð/','/l/','/p/'],why:'The classic articulator roll-call. Cycles the three main points of contact in one short phrase.'},
{t:'Red leather, yellow leather.',c:'warmup',d:2,tg:['/r/','/l/','/ð/'],why:'The single most-used broadcast warmup. Forces the tongue between /r/, /l/ and /ð/ — three different shapes at nearly the same place.'},
{t:'Unique New York, unique New York, you know you need unique New York.',c:'warmup',d:2,tg:['/j/','/n/','/k/'],why:'The /juː/ glide followed by velar and alveolar nasals. Trains the back of the tongue independently of the front.'},
{t:'Bilabial plosive: puh puh puh puh puh. Then buh buh buh buh buh.',c:'warmup',d:1,tg:['/p/','/b/'],why:'Diadochokinetic drill. Target five to seven per second, clean. This is a measurable articulatory-speed benchmark.'},
{t:'Alveolar: tuh tuh tuh tuh tuh. Then duh duh duh duh duh.',c:'warmup',d:1,tg:['/t/','/d/'],why:'Second DDK position. Tongue tip only — the jaw should not move at all.'},
{t:'Velar: kuh kuh kuh kuh kuh. Then guh guh guh guh guh.',c:'warmup',d:1,tg:['/k/','/g/'],why:'Third DDK position, back of the tongue. Usually the slowest of the three and the one people neglect.'},
{t:'Now all three: puh-tuh-kuh, puh-tuh-kuh, puh-tuh-kuh. Fast as you can stay clean.',c:'warmup',d:3,tg:['/p/','/t/','/k/'],why:'Sequential DDK — front, middle, back. The gold-standard articulatory-agility test. Target one and a half to two and a half full sequences per second.'},
{t:'Aaah — sustain one comfortable note for as long as you can on one breath.',c:'warmup',d:1,tg:['support'],why:'Maximum phonation time. A useful weekly benchmark: fifteen seconds and up indicates decent breath support; twenty-plus is strong.'},
{t:'Lip trill (brrrrr) sliding from your lowest comfortable note to your highest and back.',c:'warmup',d:2,tg:['range'],why:'Semi-occluded pitch glide. Stretches the range with the folds protected by back-pressure. Do this before any range work.'},
{t:'Straw phonation: hum through a straw for thirty seconds, then speak.',c:'warmup',d:1,tg:['support'],why:'The most evidence-backed vocal warmup there is. The narrow tube raises back-pressure, which improves fold closure efficiency for several minutes afterwards.'},
{t:'Yawn-sigh: fake a yawn, then sigh out on an open "haaah" from high to low.',c:'warmup',d:1,tg:['resonance'],why:'Drops the larynx and opens the pharynx. Instantly widens resonance — the fastest way to a fuller-sounding voice.'},
{t:'Count from one to twenty on a single breath, keeping the last number as loud as the first.',c:'warmup',d:2,tg:['support'],why:'Breath economy plus anti-trailing-off. Most people lose eight or more dB by number fifteen. Target: within four dB from one to twenty.'},

/* ============ SIBILANTS ============ */
{t:'She sells seashells by the seashore. The shells she sells are surely seashells.',c:'sib',d:2,tg:['/s/','/ʃ/'],why:'The canonical /s/-/ʃ/ alternation. Two fricatives separated by about a centimetre of tongue-blade position — the brain keeps grabbing the wrong one.'},
{t:'Six sick sea serpents swam the seven seas.',c:'sib',d:2,tg:['/s/'],why:'Repeated /s/ with varying following vowels. Trains a stable groove position across changing tongue heights.'},
{t:'Sixth sick sheikh\'s sixth sheep\'s sick.',c:'sib',d:5,tg:['/s/','/ʃ/','/ks/','/θ/'],why:'Frequently nominated the hardest short twister in English. Combines /s/, /ʃ/ and /θ/ with the /ksθ/ cluster in "sixth" — three near-identical tongue positions in immediate succession.'},
{t:'Sally sells sea shells and Sheila sells shiny shoes.',c:'sib',d:3,tg:['/s/','/ʃ/'],why:'Alternating onsets across word boundaries. The similar-onset effect is at maximum here.'},
{t:'Suzy sees sixty scissors on the seashore shining.',c:'sib',d:3,tg:['/s/','/z/','/ʃ/'],why:'Adds voiced /z/ to the /s/-/ʃ/ pair. Now three sibilants, differing in voicing and place.'},
{t:'Cinnamon aluminium linoleum. Cinnamon aluminium linoleum.',c:'sib',d:4,tg:['/s/','/l/','/n/','/m/'],why:'Three polysyllables with rotating nasal and lateral patterns. Stress placement collapses before articulation does.'},
{t:'The soothsayer\'s seventh sister sewed sixty-six silk shirts.',c:'sib',d:4,tg:['/s/','/θ/','/ð/','/ʃ/'],why:'Four different fricatives in the same phrase, all made within two centimetres of each other.'},
{t:'Shy Shelly says she shall sew sheets.',c:'sib',d:3,tg:['/ʃ/','/s/'],why:'Almost pure /ʃ/ with two /s/ intruders. Trains resisting assimilation.'},
{t:'Sunshine city, seaside city, sunshine seaside city sights.',c:'sib',d:3,tg:['/s/','/ʃ/','/t/'],why:'Compound repetition with the /ns/ and /ts/ clusters embedded.'},
{t:'Which wristwatches are Swiss wristwatches?',c:'sib',d:4,tg:['/w/','/r/','/tʃ/','/s/'],why:'The /stw/ cluster in "wristwatches" is one of the least common in English and the tongue has no motor pattern for it.'},
{t:'Sixty-six sick chicks sat on six slick bricks.',c:'sib',d:4,tg:['/s/','/tʃ/','/k/','/kl/'],why:'Adds the affricate /tʃ/ to the sibilant set and drops in two clusters.'},
{t:'Sasha sews sashes and Sasha\'s sister sorts them.',c:'sib',d:3,tg:['/s/','/ʃ/','/z/'],why:'Name repetition forces the same alternation four times without letting the tongue reset.'},

/* ============ PLOSIVES ============ */
{t:'Peter Piper picked a peck of pickled peppers. A peck of pickled peppers Peter Piper picked.',c:'plos',d:2,tg:['/p/','/k/'],why:'The most famous twister in English. Alternates bilabial /p/ with velar /k/ — the two furthest-apart stop positions in the mouth.'},
{t:'Betty Botter bought some butter, but she said the butter\'s bitter.',c:'plos',d:3,tg:['/b/','/t/'],why:'Bilabial and alveolar alternation with almost identical vowels. The vowels being similar is what makes the consonants slip.'},
{t:'A proper copper coffee pot.',c:'plos',d:3,tg:['/p/','/k/','/f/'],why:'Short, dense, and famously deceptive. Three /p/-/k/ swaps in six syllables.'},
{t:'Big black bug bit a big black bear.',c:'plos',d:2,tg:['/b/','/g/','/bl/'],why:'Voiced stops at two places plus the /bl/ cluster. Good early-level plosive work.'},
{t:'Blake\'s black bike\'s back brake bracket block broke.',c:'plos',d:5,tg:['/bl/','/br/','/bk/','/k/'],why:'Seven consecutive words with /b/ onsets and alternating /l/ and /r/ following. Near-total phonemic similarity — the hardest kind.'},
{t:'Pad kid poured curd pulled cod.',c:'brutal',d:5,tg:['/p/','/k/','/d/'],why:'Developed in a psycholinguistics lab as a deliberate maximum-difficulty sequence. Test subjects could not complete it at speed; some stopped speaking entirely. The alternation defeats the motor planning system rather than the tongue.'},
{t:'Kitty caught the kitten in the kitchen.',c:'plos',d:2,tg:['/k/','/t/','/tʃ/'],why:'Velar-alveolar alternation with an affricate at the end.'},
{t:'Tim, the thin twin tinsmith.',c:'plos',d:4,tg:['/t/','/θ/','/tw/','/n/'],why:'/t/ and /θ/ are separated by a few millimetres of tongue-tip position. Adding the /tw/ cluster makes it brutal for a five-word phrase.'},
{t:'Good blood, bad blood.',c:'plos',d:4,tg:['/bl/','/d/','/g/'],why:'Deceptively short. The /d/-/bl/ transition requires the tongue tip to release and the lips to close in overlapping time — repeat it five times fast and the words fuse.'},
{t:'Two toads, totally tired, tried to trot to Tewkesbury.',c:'plos',d:4,tg:['/t/','/tr/','/d/'],why:'/t/ onset on almost every word, with /tr/ clusters breaking the pattern at unpredictable points.'},
{t:'A tutor who tooted the flute tried to tutor two tooters to toot.',c:'plos',d:4,tg:['/t/','/fl/','/uː/'],why:'Extended /t/ plus /uː/ with a flute-related cluster. Trains lip rounding held constant across changing tongue positions.'},
{t:'Cooks cook cupcakes quickly.',c:'plos',d:3,tg:['/k/','/kw/'],why:'Almost pure velar. Good isolation drill for the back of the tongue.'},
{t:'Twelve twins twirled twelve twigs.',c:'plos',d:4,tg:['/tw/','/l/','/v/'],why:'The /tw/ cluster five times with /l/ and /v/ interference. English rarely repeats /tw/ and the motor pattern is weak.'},
{t:'Brisk brave brigadiers brandished broad bright blades.',c:'plos',d:4,tg:['/br/','/bl/','/br/'],why:'Alternating /br/ and /bl/. The only difference is the liquid, and it is the classic minimal-pair trap.'},

/* ============ LIQUIDS ============ */
{t:'Red lorry, yellow lorry. Red lorry, yellow lorry.',c:'liquid',d:3,tg:['/r/','/l/'],why:'The definitive /r/-/l/ discrimination drill. Both are liquids made in almost the same region; the tongue keeps compromising into something between the two.'},
{t:'Really rural. Really rural. Really rural.',c:'liquid',d:5,tg:['/r/','/l/'],why:'Two words, and one of the hardest sequences in English. The /r/-/l/-/r/-/r/-/l/ chain with no consonant break to reset the tongue.'},
{t:'Rural juror. Rural juror. Rural juror.',c:'brutal',d:5,tg:['/r/','/l/','/dʒ/'],why:'Adds an affricate to "really rural". Three consecutive /r/ approximants in different syllabic positions. Widely considered unsayable at speed.'},
{t:'Larry sent the latter letter later.',c:'liquid',d:3,tg:['/l/','/r/','/t/'],why:'Flap-t plus /l/ and /r/ alternation. In most American accents the medial /t/ becomes a flap, which is articulatorily adjacent to /r/ — that is the trap.'},
{t:'Lovely lemon liniment.',c:'liquid',d:3,tg:['/l/','/m/','/n/'],why:'Pure /l/ with nasal interference. Trains a clean lateral release.'},
{t:'Round and round the rugged rock the ragged rascal ran.',c:'liquid',d:3,tg:['/r/'],why:'Sustained /r/ across changing vowels. Trains tongue-root stability.'},
{t:'Truly rural jewellery.',c:'liquid',d:5,tg:['/r/','/l/','/uː/','/dʒ/'],why:'Compounds every /r/-/l/ trap with the /uːəl/ sequence in "jewellery", which most speakers cannot articulate slowly, let alone fast.'},
{t:'Eleven benevolent elephants.',c:'liquid',d:4,tg:['/l/','/v/','/n/'],why:'Alternating /l/, /v/ and /n/ across three polysyllables. Stress pattern is what breaks first.'},
{t:'Willy\'s really weary.',c:'liquid',d:4,tg:['/w/','/r/','/l/'],why:'Three approximants — /w/, /r/, /l/ — in a four-word phrase. All three are made without full contact, so there is no crisp landmark to aim at.'},
{t:'The lips, the teeth, the tip of the tongue, the tip of the tongue, the teeth, the lips.',c:'liquid',d:3,tg:['/l/','/θ/','/t/','/ð/'],why:'The reversed version of the warmup. Reversing the order defeats the motor pattern you just built.'},
{t:'Lily ladles little Letty\'s lentil soup.',c:'liquid',d:3,tg:['/l/','/t/','/d/'],why:'Five /l/ onsets with alveolar stops between them.'},
{t:'Rory\'s lawn rake rarely rakes really right.',c:'liquid',d:5,tg:['/r/','/l/','/k/'],why:'/r/ in onset, coda and intervocalic position, all in one line, with /l/ intruders.'},

/* ============ FRICATIVES ============ */
{t:'Fresh fried fish, fish fresh fried, fried fish fresh, fish fried fresh.',c:'fric',d:4,tg:['/f/','/r/','/ʃ/'],why:'Word-order permutation with identical phonemes. The motor sequence has to be rebuilt every phrase — this is planning load, not articulation load.'},
{t:'Three free throws. Three free throws. Three free throws.',c:'fric',d:4,tg:['/θ/','/r/','/f/'],why:'The /θr/ cluster is rare and difficult; adding /fr/ next to it means the tongue tip and lower lip compete for the same timing slot.'},
{t:'The thirty-three thieves thought that they thrilled the throne throughout Thursday.',c:'fric',d:5,tg:['/θ/','/ð/','/θr/'],why:'Voiced /ð/ and voiceless /θ/ alternating, plus four /θr/ clusters. The voicing switch is the hard part, not the place.'},
{t:'Freshly fried flying fish.',c:'fric',d:3,tg:['/f/','/fl/','/fr/'],why:'/fr/ and /fl/ alternation — again, only the liquid differs.'},
{t:'Vincent vowed vengeance very vehemently.',c:'fric',d:3,tg:['/v/','/n/'],why:'Sustained /v/, which English uses less than /f/ and which many speakers under-voice.'},
{t:'Of all the felt I ever felt, I never felt a piece of felt which felt as fine as that felt felt.',c:'fric',d:4,tg:['/f/','/l/','/t/'],why:'Repetition of a single word in different syntactic roles. Comprehension collapses before articulation does.'},
{t:'Whether the weather be fine, or whether the weather be not, we\'ll weather the weather whatever the weather, whether we like it or not.',c:'fric',d:4,tg:['/w/','/ð/','/θ/'],why:'The /w/-/ð/ pairing repeated eight times. Trains sustaining a voiced dental fricative under speed, which is where most people substitute /d/ or /v/.'},
{t:'Thin sticks, thick bricks.',c:'fric',d:4,tg:['/θ/','/s/','/k/','/br/'],why:'/θ/ and /s/ are near-neighbours; the tongue tip has to move about four millimetres and the brain keeps rounding it off.'},
{t:'He threw three free throws.',c:'fric',d:5,tg:['/θr/','/fr/','/h/'],why:'The shortest sentence in English that reliably defeats trained speakers. /θr/ and /fr/ in immediate alternation.'},
{t:'Five very fine vivid vines.',c:'fric',d:3,tg:['/f/','/v/'],why:'Pure /f/-/v/ voicing contrast. Same articulation, voicing only.'},
{t:'This thistle seems like that thistle.',c:'fric',d:4,tg:['/ð/','/θ/','/s/','/sl/'],why:'Voiced and voiceless th plus the /sl/ cluster and the /stl/ sequence in "thistle".'},
{t:'Something in a thirty-acre thermal thicket of thorns and thistles thumped and thundered.',c:'fric',d:5,tg:['/θ/','/θr/','/ð/'],why:'Sustained /θ/ across a long phrase. Breath support fails before articulation does — which is the real lesson.'},

/* ============ NASALS & GLIDES ============ */
{t:'Mommy made me mash my M&Ms.',c:'nasal',d:2,tg:['/m/','/ʃ/'],why:'Sustained bilabial nasal. Excellent forward-resonance builder disguised as a twister.'},
{t:'Many an anemone sees an enemy anemone.',c:'nasal',d:4,tg:['/n/','/m/','/ə/'],why:'Near-identical polysyllables differing by one segment. The vowel reduction pattern is what collapses.'},
{t:'Nine nice night nurses nursing nicely.',c:'nasal',d:3,tg:['/n/','/naɪ/'],why:'Repeated /n/ onset with the same diphthong. Trains the tongue tip to release cleanly rather than smearing.'},
{t:'Ken Dodd\'s dad\'s dog\'s dead.',c:'nasal',d:4,tg:['/d/','/n/','/z/'],why:'Four possessives in a row means four /z/ or /s/ endings colliding with /d/ onsets.'},
{t:'A noisy noise annoys an oyster.',c:'nasal',d:3,tg:['/n/','/ɔɪ/','/z/'],why:'The /nɔɪz/ sequence repeated with shifting word boundaries — "an oyster" versus "a noisy".'},
{t:'Yellow yo-yos, young yaks yodel.',c:'nasal',d:3,tg:['/j/','/l/'],why:'The palatal glide /j/, which English speakers produce lazily. Forces genuine tongue-body raising.'},
{t:'We surely shall see the sun shine soon.',c:'nasal',d:3,tg:['/w/','/ʃ/','/s/'],why:'Glide plus sibilant alternation.'},
{t:'Which witch wished which wicked wish?',c:'nasal',d:4,tg:['/w/','/tʃ/','/ʃ/'],why:'Homophone confusion plus /tʃ/-/ʃ/ alternation. Semantic interference on top of phonetic.'},
{t:'Wayne went to Wales to watch walruses.',c:'nasal',d:2,tg:['/w/'],why:'Sustained /w/. A simple lip-rounding endurance drill.'},
{t:'Nick knits nine knotted knapsacks nightly.',c:'nasal',d:3,tg:['/n/','/k/','/kn/'],why:'Silent-k words force the reader past orthography into pure sound — useful for cold-read training.'},

/* ============ VOWELS ============ */
{t:'How now brown cow.',c:'vowel',d:2,tg:['/aʊ/'],why:'The classic diphthong drill. Trains full jaw travel from open to rounded.'},
{t:'A e i o u — say each one at full extension, exaggerating the lip and jaw shape.',c:'vowel',d:1,tg:['vowels'],why:'Baseline vowel-space calibration. Most people use about sixty percent of their available vowel space in normal speech.'},
{t:'Bee, bay, bah, bore, boo. Then reverse: boo, bore, bah, bay, bee.',c:'vowel',d:2,tg:['vowels'],why:'Front-to-back tongue travel with a fixed consonant. Isolates vowel movement from consonant movement.'},
{t:'Eleven elves licked eleven little liquorice lollipops.',c:'vowel',d:4,tg:['/ɛ/','/ɪ/','/l/'],why:'The /ɛ/-/ɪ/ contrast, which is one of the smallest vowel distinctions in English, repeated with /l/ interference.'},
{t:'The ochre ogre ogled the poker.',c:'vowel',d:4,tg:['/oʊ/','/g/','/k/'],why:'Nearly identical vowel with alternating velar stops.'},
{t:'I scream, you scream, we all scream for ice cream.',c:'vowel',d:2,tg:['/aɪ/','/skr/'],why:'The word-boundary trap — "I scream" and "ice cream" are the same phoneme string with different junctures. Trains juncture control.'},
{t:'Around the rugged rocks the ragged rascals rudely ran.',c:'vowel',d:3,tg:['/r/','/æ/','/ʌ/'],why:'The /æ/-/ʌ/ contrast, which collapses in many accents, with /r/ everywhere.'},
{t:'Purple paper people, purple paper people.',c:'vowel',d:3,tg:['/ɜr/','/eɪ/','/p/'],why:'Bilabial plosives with an r-coloured vowel — a combination that requires the tongue and lips to work independently.'},
{t:'Ed had edited it.',c:'vowel',d:4,tg:['/ɛ/','/d/','/ɪ/'],why:'Four words, almost all schwa and /d/. Deceptively difficult because there are no landmarks.'},
{t:'Toy boat. Toy boat. Toy boat. Toy boat.',c:'brutal',d:5,tg:['/ɔɪ/','/oʊ/','/t/','/b/'],why:'Two syllables. Almost nobody manages ten repetitions. The two diphthongs both end in a high glide and the tongue cannot reset between them fast enough.'},

/* ============ CLUSTERS ============ */
{t:'Strong strange strings stretched straight.',c:'cluster',d:5,tg:['/str/'],why:'The /str/ cluster five times. English allows it, but repeating it prevents the tongue from resetting, and it degrades toward /ʃtr/.'},
{t:'Sixths, twelfths, and thousandths.',c:'cluster',d:5,tg:['/ksθs/','/lfθs/','/ndθs/'],why:'Three of the densest consonant clusters in the entire language. Four consonants with no vowel. Say them slowly first — many speakers cannot produce them at all.'},
{t:'The sixth sheikh\'s sixth sheep\'s sick, and the sixth sheikh\'s sixth sheep\'s sixth shepherd\'s sick too.',c:'brutal',d:5,tg:['/ksθ/','/ʃ/','/s/'],why:'The extended version. Adds another /ʃ/ layer and pushes the phrase past comfortable breath length.'},
{t:'Splendid sprinting sprites splashed spritely.',c:'cluster',d:4,tg:['/spl/','/spr/'],why:'The /spl/-/spr/ pair. Only the liquid differs, and both are three-consonant onsets.'},
{t:'Crisp crusts crackle and crunch.',c:'cluster',d:4,tg:['/kr/','/sp/','/st/','/ntʃ/'],why:'Onset and coda clusters in the same words. Trains cluster release without vowel insertion.'},
{t:'Glowing globes gleamed and glinted.',c:'cluster',d:3,tg:['/gl/'],why:'Sustained /gl/ — voiced velar into lateral, a difficult transition to keep clean.'},
{t:'The scientists\' strict scripts stressed sixths.',c:'cluster',d:5,tg:['/str/','/skr/','/ksθs/'],why:'Written to combine the three hardest cluster types in English into one phrase.'},
{t:'Twin-screw steel cruiser.',c:'cluster',d:5,tg:['/tw/','/skr/','/st/','/kr/'],why:'A traditional Royal Navy drill. Four clusters, four words. Notorious.'},
{t:'Prompt promptly, prompt promptly, prompt promptly.',c:'cluster',d:4,tg:['/pr/','/mpt/','/ptl/'],why:'The /mptl/ sequence is one of the longest consonant runs English permits.'},
{t:'Black background, brown background.',c:'cluster',d:5,tg:['/bl/','/br/','/kgr/','/nd/'],why:'The /kgr/ juncture across the word boundary in "back-ground" has no motor pattern, and swapping /bl/ for /br/ each time defeats prediction.'},

/* ============ LONG-FORM CLASSICS ============ */
{t:'How much wood would a woodchuck chuck if a woodchuck could chuck wood? He would chuck, he would, as much as he could, and chuck as much wood as a woodchuck would if a woodchuck could chuck wood.',c:'long',d:4,tg:['/w/','/tʃ/','/k/','/d/'],why:'Sustained /w/ and /tʃ/ over a long phrase with heavy repetition. Breath management is the real challenge — plan your inhalations at the clause boundaries.'},
{t:'Betty Botter bought some butter, but she said the butter\'s bitter. If I put it in my batter it will make my batter bitter. But a bit of better butter will make my batter better. So she bought a bit of butter, better than her bitter butter, and she put it in her batter and the batter was not bitter. So it was better Betty Botter bought a bit of better butter.',c:'long',d:5,tg:['/b/','/t/','/ɪ/','/ʌ/','/ɛ/'],why:'The longest of the classics. Bilabial and alveolar stops with three near-identical vowels, sustained past comfortable breath length. Trains everything at once.'},
{t:'Theophilus Thistle, the successful thistle sifter, in sifting a sieve full of unsifted thistles, thrust three thousand thistles through the thick of his thumb.',c:'long',d:5,tg:['/θ/','/s/','/f/','/θr/'],why:'The most demanding /θ/ piece in English. Voiceless dental fricative sustained across a long, breath-hungry phrase with /s/ and /f/ competitors throughout.'},
{t:'A swan swam over the sea. Swim, swan, swim. Swan swam back again. Well swum, swan.',c:'long',d:4,tg:['/sw/','/m/','/n/'],why:'The /sw/ cluster with nasal codas. Deceptively simple to read, difficult to say cleanly at speed.'},
{t:'Moses supposes his toeses are roses, but Moses supposes erroneously. For nobody\'s toeses are posies of roses as Moses supposes his toeses to be.',c:'long',d:4,tg:['/z/','/s/','/oʊ/','/r/'],why:'Voiced and voiceless sibilants alternating with a fixed vowel. Trains voicing control.'},
{t:'Amidst the mists and coldest frosts, with barest wrists and stoutest boasts, he thrusts his fists against the posts and still insists he sees the ghosts.',c:'long',d:5,tg:['/sts/','/st/','/θr/'],why:'Eight /sts/ codas. The tongue must release /s/, stop for /t/, and release /s/ again — three gestures in the space usually given to one.'},
{t:'Peter Piper picked a peck of pickled peppers. A peck of pickled peppers Peter Piper picked. If Peter Piper picked a peck of pickled peppers, where\'s the peck of pickled peppers Peter Piper picked?',c:'long',d:3,tg:['/p/','/k/'],why:'The full version. Four permutations of the same phoneme set — a planning drill more than an articulation one.'},
{t:'Fuzzy Wuzzy was a bear. Fuzzy Wuzzy had no hair. Fuzzy Wuzzy wasn\'t very fuzzy, was he?',c:'long',d:3,tg:['/f/','/z/','/w/'],why:'The /z/-/w/ transition repeated. Voiced fricative into glide, which tends to smear.'},
{t:'If a dog chews shoes, whose shoes does he choose? He chews shoes he can chew, but he never chews shoes that a shoe-chewer chews.',c:'long',d:4,tg:['/tʃ/','/ʃ/','/z/','/uː/'],why:'The /tʃ/-/ʃ/ pair with a fixed rounded vowel throughout. Lip position constant, tongue position alternating.'},
{t:'One-one was a racehorse. Two-two was one too. One-one won one race. Two-two won one too.',c:'long',d:4,tg:['/w/','/n/','/t/','/uː/'],why:'Homophone density. Nothing is phonetically hard; the difficulty is entirely lexical retrieval under identical sound.'},
{t:'Denise sees the fleece, Denise sees the fleas. At least Denise could sneeze and feed and freeze the fleas.',c:'long',d:4,tg:['/s/','/z/','/fl/','/fr/'],why:'/s/-/z/ voicing with /fl/-/fr/ liquid alternation. Two independent contrasts running simultaneously.'},
{t:'I wish to wish the wish you wish to wish, but if you wish the wish the witch wishes, I won\'t wish the wish you wish to wish.',c:'long',d:5,tg:['/w/','/ʃ/','/tʃ/'],why:'The /wɪʃ/ syllable eleven times with tiny variations. Semantic tracking fails long before articulation does.'},

/* ============ BRUTAL RACK ============ */
{t:'Irish wristwatch, Swiss wristwatch.',c:'brutal',d:5,tg:['/ʃr/','/stw/','/tʃ/','/sw/'],why:'Widely nominated the hardest two-phrase twister in English. The /ʃr/ and /stw/ clusters do not occur adjacently anywhere else in the language.'},
{t:'Pleasant mother pheasant plucker, I\'m not the pleasant mother pheasant plucker, I\'m the pleasant mother pheasant plucker\'s son.',c:'brutal',d:5,tg:['/pl/','/f/','/ð/','/pk/'],why:'A traditional trap. The /pl/ and /f/ onsets plus the risk of transposition make this one of the most-failed pieces in performance training.'},
{t:'The seething sea ceaseth and thus the seething sea sufficeth us.',c:'brutal',d:5,tg:['/s/','/θ/','/ð/','/ˈsiːθ/'],why:'Alternating /s/ and /θ/ within nearly identical syllables. There is almost no acoustic landmark to steer by.'},
{t:'Six slippery snails slid silently seaward.',c:'brutal',d:4,tg:['/s/','/sl/','/l/'],why:'Five /s/-initial words, four with a following liquid. Maximum onset similarity.'},
{t:'A skunk sat on a stump and thunk the stump stunk, but the stump thunk the skunk stunk.',c:'brutal',d:5,tg:['/sk/','/st/','/θ/','/ŋk/'],why:'The /ŋk/ coda repeated with alternating /sk/, /st/ and /θ/ onsets. Semantic interference makes it worse.'},
{t:'Lesser leather never weathered wetter weather better.',c:'brutal',d:5,tg:['/l/','/ð/','/w/','/ɛ/'],why:'Every word ends in an r-coloured schwa and contains /ɛ/. There is no vowel variation to steer by at all.'},
{t:'Brad\'s big black bath brush broke.',c:'brutal',d:5,tg:['/br/','/bl/','/b/','/ʃ/'],why:'Six /b/ onsets with alternating liquids and a /ʃ/ finish.'},
{t:'Send toast ten steps to a stern stone-deaf stenographer.',c:'brutal',d:5,tg:['/st/','/ts/','/nd/','/nθ/'],why:'/st/ and /ts/ are mirror images and the tongue keeps swapping them. Eight cluster events in nine words.'},
{t:'She stood on the balcony inexplicably mimicking him hiccupping and amicably welcoming him in.',c:'brutal',d:5,tg:['/m/','/k/','/ŋ/','/ɪ/'],why:'Nine syllables of alternating nasals and velars with almost no vowel variation. A theatre-school standard.'},
{t:'Imagine an imaginary menagerie manager imagining managing an imaginary menagerie.',c:'brutal',d:5,tg:['/m/','/n/','/dʒ/','/ɪ/'],why:'Four polysyllables built from the same phoneme inventory in different orders. Lexical retrieval collapses immediately.'},

/* ============ WORLD ============ */
{t:'Trentatré trentini entrarono a Trento, tutti e trentatré trotterellando.  (Italian: thirty-three Trentonians entered Trento, all thirty-three trotting.)',c:'world',d:4,tg:['trilled /r/','/tr/'],why:'The Italian trilled /r/ inside a /tr/ cluster. Trains tongue-tip flexibility English never demands.'},
{t:'Tres tristes tigres tragaban trigo en un trigal.  (Spanish: three sad tigers swallowed wheat in a wheat field.)',c:'world',d:4,tg:['/tr/','trilled /r/'],why:'The most famous Spanish twister. Six /tr/ clusters with a trill. Excellent for English speakers because it demands a tongue gesture we have no habit for.'},
{t:'Fischers Fritz fischt frische Fische; frische Fische fischt Fischers Fritz.  (German: Fischer\'s Fritz fishes fresh fish.)',c:'world',d:4,tg:['/fʃ/','/fr/','/ʃ/'],why:'The /fʃ/ sequence does not occur in English. Trains independent lip and tongue-blade timing.'},
{t:'Un chasseur sachant chasser doit savoir chasser sans son chien.  (French: a hunter who knows how to hunt must know how to hunt without his dog.)',c:'world',d:4,tg:['/ʃ/','/s/','nasal vowels'],why:'/ʃ/-/s/ alternation plus French nasal vowels. Trains soft-palate control, which English speakers rarely exercise deliberately.'},
{t:'Konstantinopolitanischerdudelsackpfeifenmachersgeselle.  (German: apprentice to a Constantinopolitan bagpipe maker.)',c:'world',d:5,tg:['compounds','/pf/'],why:'A single word with the /pf/ affricate. Trains sustained articulation over an extreme syllable count on one breath.'},
{t:'Nel mezzo del cammin di nostra vita mi ritrovai per una selva oscura.  (Italian: read for legato vowel flow, not speed.)',c:'world',d:3,tg:['vowels','legato'],why:'Italian is a syllable-timed language with pure vowels. Reading it trains even syllable duration — the opposite of English stress-timing, and a genuine ear-opener.'},
{t:'Stół z powyłamywanymi nogami.  (Polish: a table with broken-off legs.)',c:'world',d:5,tg:['/w/','/ɨ/','clusters'],why:'Polish vowel /ɨ/ and consonant density. Almost impossible for an English mouth on first attempt, which is exactly why it stretches.'},
{t:'Nam kok kok, kok kok nam.  (Thai-style tonal pattern: say each syllable on a distinct pitch — low, mid, high, mid, low.)',c:'world',d:4,tg:['tone','pitch control'],why:'Not an articulation drill — a pitch-precision drill. Assigning discrete pitches to syllables trains exactly the F0 control this app measures.'},

/* ============ ORIGINALS ============ */
{t:'Certain sceptics sanction certain scripted sales.',c:'orig',d:4,tg:['/s/','/sk/','/skr/','/ʃ/'],why:'Written to alternate /s/, /sk/ and /skr/ — the three sibilant-cluster densities — inside one breath.'},
{t:'The tonal control cost Colin all control.',c:'orig',d:4,tg:['/t/','/k/','/l/','/oʊ/'],why:'Velar and alveolar stops around a fixed vowel with /l/ codas throughout. No vowel landmark to steer by.'},
{t:'Quiet quotes quell quick quarrels quietly.',c:'orig',d:4,tg:['/kw/'],why:'Five /kw/ onsets. English uses this cluster rarely enough that the motor pattern is under-trained in most speakers.'},
{t:'Practised pacing places pauses precisely.',c:'orig',d:4,tg:['/pr/','/p/','/s/','/z/'],why:'Bilabial onsets with sibilant codas — the two ends of the mouth working in opposite directions.'},
{t:'Drop the drawl, draw the drill, dwell on the detail.',c:'orig',d:4,tg:['/dr/','/dw/','/d/'],why:'The /dw/ cluster is one of the rarest in English. Placed next to /dr/ it exposes exactly how weak the motor pattern is.'},
{t:'Thrust the third thrilling thought through.',c:'orig',d:5,tg:['/θr/','/θ/','/ð/'],why:'Four /θr/ clusters with a voiced /ð/ intruder. Written as the maximum-density dental drill.'},
{t:'Whispered wisdom wins where wild words won\'t.',c:'orig',d:4,tg:['/w/','/wɪ/','/z/','/d/'],why:'Seven /w/ onsets with alternating following vowels. Lip-rounding endurance.'},
{t:'Flat black plastic packs stack fast.',c:'orig',d:5,tg:['/fl/','/bl/','/pl/','/st/','/kst/'],why:'Three different liquid clusters plus two coda clusters, all inside six words.'},
{t:'Measure the pleasure, treasure the leisure.',c:'orig',d:3,tg:['/ʒ/','/ʒər/','/tr/','/l/'],why:'The /ʒ/ phoneme is the rarest consonant in English. Four of them in one line builds a sound most speakers barely produce.'},
{t:'Chuck\'s cheap chalk choked the church clock.',c:'orig',d:4,tg:['/tʃ/','/k/','/tʃ/','/kl/'],why:'Affricate and velar stop alternation, which is the pairing most likely to collapse into a single articulation under speed.'},
{t:'Sell shells, shell cells, sell shelled cells.',c:'orig',d:5,tg:['/s/','/ʃ/','/l/','/lz/'],why:'A deliberately maximal /s/-/ʃ/ minimal-pair sequence with /ld/ and /lz/ codas.'},
{t:'Bright light, right night, night light bright.',c:'orig',d:4,tg:['/br/','/r/','/l/','/aɪt/'],why:'Fixed rhyme with rotating onsets — /br/, /r/, /l/, /n/. Rhyme removes the vowel cue, so only onsets differ.'},
{t:'Gregg\'s grey glove grabbed Greg\'s green glass.',c:'orig',d:5,tg:['/gr/','/gl/','/g/'],why:'/gr/ and /gl/ alternating six times. The classic liquid-swap trap at the velar place.'},
{t:'Nine fine wines shine behind the blind.',c:'orig',d:3,tg:['/n/','/aɪn/','/bl/','/ʃ/'],why:'Fixed rhyme with rotating onsets, gentler than the bright-light drill. Good intermediate step.'},
